kind: printer
id: skiqg3Zd6LUlHYcYkHEv/Q
variants:
- condition: printer.model == "Kingroon KLP1"
  name: Kingroon KLP1
  id: iajKWGIXc01K0mOsy4UeAQ
  variants:
  - condition: tool.nozzle_diameter == 0.4
    id: f545kudtKq2VmMevKq5EbA
    values:
      bed_custom_model: ''
      bed_custom_texture: ''
      before_layer_gcode: |
        ;BEFORE_LAYER_CHANGE
        ;[layer_z]
        G92 E0
      toolchange_gcode: ''
      cooling_tube_length: 5
      cooling_tube_retraction: 91.5
      default_print: 0.20mm Standard @Kingroon KLP1
      remaining_times: true
      machine_limits_usage: time_estimate_only
      extra_loading_move: -2
      extruder_clearance_height: 36
      extruder_clearance_radius: 65
      extruder_offset:
      - '0x0'
      gcode_flavor: klipper
      high_current_on_filament_swap: false
      layer_gcode: |-
        ;AFTER_LAYER_CHANGE
        ;[layer_z]
      end_gcode: |-
        G91; relative positioning
         G1 Z1.0 F3000 ; move z up little to prevent scratching of print
         G90; absolute positioning
         G1 X0 Y200 F1000 ; prepare for part removal
         M104 S0; turn off extruder
         M140 S0 ; turn off bed
         G1 X0 Y200 F1000 ; prepare for part removal
         M84 ; disable motors
         M106 S0 ; turn off fan
      machine_max_acceleration_e:
      - 5000.0
      - 5000.0
      machine_max_acceleration_extruding:
      - 5000.0
      - 20000.0
      machine_max_acceleration_retracting:
      - 5000.0
      - 5000.0
      machine_max_acceleration_travel:
      - 9000.0
      - 9000.0
      machine_max_acceleration_x:
      - 10000.0
      - 20000.0
      machine_max_acceleration_y:
      - 10000.0
      - 20000.0
      machine_max_acceleration_z:
      - 500.0
      - 200.0
      machine_max_jerk_e:
      - 2.5
      - 2.5
      machine_max_jerk_x:
      - 20.0
      - 9.0
      machine_max_jerk_y:
      - 20.0
      - 9.0
      machine_max_jerk_z:
      - 0.2
      - 0.4
      machine_max_junction_deviation:
      - 0.01
      machine_max_feedrate_e:
      - 100.0
      - 25.0
      machine_max_feedrate_x:
      - 500.0
      - 200.0
      machine_max_feedrate_y:
      - 500.0
      - 200.0
      machine_max_feedrate_z:
      - 50.0
      - 12.0
      machine_min_extruding_rate:
      - 0.0
      - 0.0
      machine_min_travel_rate:
      - 0.0
      - 0.0
      pause_print_gcode: PAUSE
      start_gcode: |-
        M190 S[first_layer_bed_temperature[initial_extruder]]
        M109 S[first_layer_temperature]
        G28 ; h1ome all axes
         M117 ;Purge extruder
         G92 E0 ; reset extruder
         G1 Z1.0 F3000 ; move z up little to prevent scratching of surface
         G1 X2 Y20 Z0.3 F5000.0 ; move to start-line position
         G1 X2 Y175.0 Z0.3 F1500.0 E15 ; draw 1st line
         G1 X2 Y175.0 Z0.4 F5000.0 ; move to side a little
         G1 X2 Y20 Z0.4 F1500.0 E30 ; draw 2nd line
         G92 E0 ; reset extruder
         G1 Z1.0 F3000 ; move z up little to prevent scratching of surface
      parking_pos_retraction: 92
      bed_shape:
      - '0x0'
      - 230x0
      - 230x230
      - '0x230'
      max_print_height: 210
      printer_notes: ''
      between_objects_gcode: ''
      single_extruder_multi_material: true
      template_custom_gcode: ''
      use_firmware_retraction: false
      use_relative_e_distances: true
      z_offset: 0
      thumbnails: 100x100/PNG
      custom_parameters_printer: '{"support_air_filtration": true}'
