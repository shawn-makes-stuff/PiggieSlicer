kind: printer
id: DDtW2aYBtgsIo8JIytiu4A
variants:
- condition: printer.model == "Kingroon KP3S PRO V2"
  name: Kingroon KP3S PRO V2
  id: tzptv9NIxhcNFBLzY3RO/w
  variants:
  - condition: tool.nozzle_diameter == 0.4
    id: swhEbkT2J4Qe1rOqLREYOA
    values:
      bed_custom_model: ''
      bed_custom_texture: ''
      before_layer_gcode: |
        ;BEFORE_LAYER_CHANGE
        ;[layer_z]
        G92 E0
      toolchange_gcode: M600
      cooling_tube_length: 5
      cooling_tube_retraction: 91.5
      default_print: 0.20mm Standard @Kingroon KP3S PRO V2
      remaining_times: true
      machine_limits_usage: time_estimate_only
      extra_loading_move: -2
      extruder_clearance_height: 25
      extruder_clearance_radius: 45
      extruder_offset:
      - '0x0'
      gcode_flavor: klipper
      high_current_on_filament_swap: false
      layer_gcode: |-
        ;AFTER_LAYER_CHANGE
        ;[layer_z]
      end_gcode: |-
        {if max_layer_z < max_print_height}G1 Z{z_offset+min(max_layer_z+2, max_print_height)} F600 ; Move print head up{endif}
        G1 X5 Y200 F6000 ; present print
        {if max_layer_z < max_print_height-10}G1 Z{z_offset+min(max_layer_z+20, max_print_height-10)} F600 ; Move print head further up{endif}
        {if max_layer_z < max_print_height*0.6}G1 Z{max_print_height*0.6} F600 ; Move print head further up{endif}
        M140 S0 ; turn off heatbed
        M104 S0 ; turn off temperature
        M107 ; turn off fan
        M84 X Y E ; disable motors
        END_PRINT
      machine_max_acceleration_e:
      - 10000.0
      - 5000.0
      machine_max_acceleration_extruding:
      - 10000.0
      - 9000.0
      machine_max_acceleration_retracting:
      - 10000.0
      - 9000.0
      machine_max_acceleration_travel:
      - 20000.0
      - 20000.0
      machine_max_acceleration_x:
      - 10000.0
      - 9000.0
      machine_max_acceleration_y:
      - 10000.0
      - 9000.0
      machine_max_acceleration_z:
      - 10000.0
      - 100.0
      machine_max_jerk_e:
      - 20.0
      - 5.0
      machine_max_jerk_x:
      - 20.0
      - 7.0
      machine_max_jerk_y:
      - 20.0
      - 7.0
      machine_max_jerk_z:
      - 0.4
      - 0.4
      machine_max_junction_deviation:
      - 0.01
      machine_max_feedrate_e:
      - 60.0
      - 60.0
      machine_max_feedrate_x:
      - 500.0
      - 200.0
      machine_max_feedrate_y:
      - 500.0
      - 200.0
      machine_max_feedrate_z:
      - 12.0
      - 12.0
      machine_min_extruding_rate:
      - 0.0
      - 0.0
      machine_min_travel_rate:
      - 0.0
      - 0.0
      pause_print_gcode: M601
      start_gcode: |-
        START_PRINT EXTRUDER_TEMP=[first_layer_temperature] BED_TEMP=[first_layer_bed_temperature]
        CANCEL_POWEROFF
        G90 ; use absolute coordinates
        M83 ; extruder relative mode
        G92 E0
      parking_pos_retraction: 92
      bed_shape:
      - '0x0'
      - 205x0
      - 205x205
      - '0x205'
      max_print_height: 200
      printer_notes: ''
      between_objects_gcode: ''
      single_extruder_multi_material: true
      template_custom_gcode: ''
      use_firmware_retraction: true
      use_relative_e_distances: true
      z_offset: 0
      thumbnails: 300x300/PNG
      custom_parameters_printer: '{"support_air_filtration": true}'
