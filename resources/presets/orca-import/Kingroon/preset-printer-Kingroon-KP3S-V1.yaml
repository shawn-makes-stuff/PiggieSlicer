kind: printer
id: b+Y1LjQooO4r1egGRa3HcA
variants:
- condition: printer.model == "Kingroon KP3S V1"
  name: Kingroon KP3S V1
  id: bsznXdOuM6oZ1uo2lxS2uw
  variants:
  - condition: tool.nozzle_diameter == 0.4
    id: qA3gJ9UeSikNd+iRu+L+Iw
    values:
      bed_custom_model: ''
      bed_custom_texture: ''
      before_layer_gcode: |
        ;BEFORE_LAYER_CHANGE
        ;[layer_z]
        G92 E0
      toolchange_gcode: ''
      cooling_tube_length: 0
      cooling_tube_retraction: 0
      default_print: 0.20mm Standard @Kingroon KP3S V1
      remaining_times: true
      machine_limits_usage: time_estimate_only
      extra_loading_move: 0
      extruder_clearance_height: 36
      extruder_clearance_radius: 65
      extruder_offset:
      - '0x0'
      gcode_flavor: klipper
      high_current_on_filament_swap: false
      layer_gcode: |-
        ;AFTER_LAYER_CHANGE
        ;[layer_z]
      end_gcode: |-
        G91; relative positioning
         G1 Z1.0 F3000 ; move z up little to prevent scratching of print
         G90; absolute positioning
         G1 X0 Y180 F1000 ; prepare for part removal
         M104 S0; turn off extruder
         M140 S0 ; turn off bed
         G1 X0 Y180 F1000 ; prepare for part removal
         M84 ; disable motors
         M106 S0 ; turn off fan
      machine_max_acceleration_e:
      - 5000.0
      - 5000.0
      machine_max_acceleration_extruding:
      - 10000.0
      - 20000.0
      machine_max_acceleration_retracting:
      - 5000.0
      - 5000.0
      machine_max_acceleration_travel:
      - 20000.0
      - 20000.0
      machine_max_acceleration_x:
      - 10000.0
      - 20000.0
      machine_max_acceleration_y:
      - 10000.0
      - 20000.0
      machine_max_acceleration_z:
      - 500.0
      - 200.0
      machine_max_jerk_e:
      - 2.5
      - 2.5
      machine_max_jerk_x:
      - 9.0
      - 9.0
      machine_max_jerk_y:
      - 9.0
      - 9.0
      machine_max_jerk_z:
      - 0.2
      - 0.4
      machine_max_junction_deviation:
      - 0.01
      machine_max_feedrate_e:
      - 100.0
      - 25.0
      machine_max_feedrate_x:
      - 500.0
      - 200.0
      machine_max_feedrate_y:
      - 500.0
      - 200.0
      machine_max_feedrate_z:
      - 12.0
      - 12.0
      machine_min_extruding_rate:
      - 0.0
      - 0.0
      machine_min_travel_rate:
      - 0.0
      - 0.0
      pause_print_gcode: PAUSE
      start_gcode: "M104 S{first_layer_temperature[0]} ; set final nozzle temp\nM190 S[first_layer_bed_temperature[initial_extruder]]\nM109 S[first_layer_temperature]\nM83\nG28 ; h1ome all axes\nG1 Z0.2                                   ; lift nozzle a bit \nG92 E0 \nG1 Y-3 F2400   \nG1 X50 F2400                                  ; zero the extruded length \nG1 X115  E40 F500                       ; Extrude 25mm of filament in a 5cm line. \nG92 E0                                     ; zero the extruded length again \nG1 E-0.2 F3000                                ; Retract a little \nG1 X180 F4000                              ; Quickly wipe away from the filament line\nM117"
      parking_pos_retraction: 0
      bed_shape:
      - '0x0'
      - 180x0
      - 180x180
      - '0x180'
      max_print_height: 180
      printer_notes: ''
      between_objects_gcode: ''
      single_extruder_multi_material: true
      template_custom_gcode: ''
      use_firmware_retraction: false
      use_relative_e_distances: true
      z_offset: 0
      thumbnails: 100x100/PNG
      custom_parameters_printer: '{"support_air_filtration": true}'
