kind: printer
id: 8sxvpyNofuaXmCb3drx2UA
variants:
- condition: printer.model == "Elegoo Neptune 2D"
  name: Elegoo Neptune 2D
  id: gT4lCYk4WOM3nh6g3cFIXA
  variants:
  - condition: tool.nozzle_diameter == 0.4 and printer.tool_count == 2
    id: AOIQek7VpvGiFXXIRIFvnw
    values:
      bed_custom_model: ''
      bed_custom_texture: ''
      before_layer_gcode: |
        ;BEFORE_LAYER_CHANGE
        ;[layer_z]
        G92 E0
      change_extrusion_role_gcode: ''
      toolchange_gcode: ";If prime tower is not enabled, perform the following refuelling G-Code.\n{if wipe_tower != true} \nM83\nG92 E0\nG1 E-5 Z{layer_z+0.4} F1200\nG1 E-85 F1200\nT[next_extruder]\nG93 E0\nG1 E90 F1200\n;\n{endif}"
      cooling_tube_length: 5
      cooling_tube_retraction: 90
      default_print: 0.20mm Standard
      remaining_times: true
      machine_limits_usage: emit_to_gcode
      enable_filament_ramming: false
      extra_loading_move: -2
      extruder_clearance_height: 34
      extruder_clearance_radius: 68
      extruder_offset:
      - '0x0'
      - '0x0'
      gcode_flavor: marlin
      high_current_on_filament_swap: false
      layer_gcode: |
        ;LAYER:{layer_num+1}
      end_gcode: |-
        {if max_layer_z < max_print_height}G1 Z{z_offset+min(max_layer_z+2, max_print_height)} F600 ; Move print head up{endif}
        G1 X5 Y{print_bed_max[1]*0.8} F{travel_speed*60} ; present print
        ;If prime tower is not enabled, perform the following refuelling G-Code.
        {if wipe_tower != true}G1 E-80 F2000 ; unload filament {endif}
        {if max_layer_z < max_print_height-10}G1 Z{z_offset+min(max_layer_z+70, max_print_height-10)} F600 ; Move print head further up{endif}
        {if max_layer_z < max_print_height*0.6}G1 Z{max_print_height*0.6} F600 ; Move print head further up{endif}
        M140 S0 ; turn off heatbed
        M104 S0 ; turn off temperature
        M107 ; turn off fan
        M84 X Y E ; disable motors
      machine_max_acceleration_e:
      - 1000.0
      - 1000.0
      machine_max_acceleration_extruding:
      - 1000.0
      - 1000.0
      - 1000.0
      - 1000.0
      machine_max_acceleration_retracting:
      - 1000.0
      - 1000.0
      - 1000.0
      - 1000.0
      machine_max_acceleration_travel:
      - 1000.0
      - 1000.0
      - 1000.0
      - 1000.0
      machine_max_acceleration_x:
      - 1000.0
      - 1000.0
      - 1000.0
      - 1000.0
      machine_max_acceleration_y:
      - 1000.0
      - 1000.0
      - 1000.0
      - 1000.0
      machine_max_acceleration_z:
      - 100.0
      - 100.0
      - 100.0
      - 100.0
      machine_max_jerk_e:
      - 5.0
      - 5.0
      - 5.0
      - 5.0
      machine_max_jerk_x:
      - 8.0
      - 8.0
      - 8.0
      - 8.0
      machine_max_jerk_y:
      - 8.0
      - 8.0
      - 8.0
      - 8.0
      machine_max_jerk_z:
      - 0.4
      - 0.4
      - 0.4
      - 0.4
      machine_max_junction_deviation:
      - 0.04
      - 0.0
      machine_max_feedrate_e:
      - 70.0
      - 70.0
      - 70.0
      - 70.0
      machine_max_feedrate_x:
      - 300.0
      - 300.0
      - 300.0
      - 300.0
      machine_max_feedrate_y:
      - 300.0
      - 300.0
      - 300.0
      - 300.0
      machine_max_feedrate_z:
      - 20.0
      - 20.0
      - 20.0
      - 20.0
      machine_min_extruding_rate:
      - 0.0
      - 0.0
      machine_min_travel_rate:
      - 0.0
      - 0.0
      pause_print_gcode: ''
      start_gcode: ";;===== date: 20240520 =====================\nT[initial_tool] ; set active extruder\n;M413 S0 ; disable Power Loss Recovery\n;[printer_model]\n;initial_filament:{filament_type[initial_extruder]}\n;curr_bed_type={sheet_type}\nM220 S100 ;Set the feed speed to 100%\nM221 S100 ;Set the flow rate to 100%\nM104 S140 ; set temporary nozzle temp to prevent oozing during homing and auto bed leveling\nM190 S[first_layer_bed_temperature[initial_extruder]] ; wait for bed temp to stabilize\nG90 \nM83 ; extruder relative mode\nG28 ; home all axis\n;G29 ; auto bed levelling - remove ; at beginning of line to enable\nM420 S1 ; enable mesh - remove ; at beginning of line to enable\n;\nG1 Z10 F300\nG1 X{print_bed_max[0]*0.5-50} Y0.5 F6000\nG1 Z0.4 F300\n;\nG92 E0 ; reset extruder\nG1 E90 F600 ; load filament\nM109 S[first_layer_temperature]\nG92 E0 ;Reset Extruder\n;\nG1 X{print_bed_max[0]*0.5+50} E30 F400 ;Draw the first line\nG1 Z0.6 F120.0 ;Move to side a little\nG1 X{print_bed_max[0]*0.5+47}\
        \ F3000\nG92 E0 ;Reset Extruder\n;LAYER_COUNT:[total_layer_count]\n;LAYER:0\n;"
      parking_pos_retraction: 90
      bed_shape:
      - '0x0'
      - 235x0
      - 235x235
      - '0x235'
      max_print_height: 250
      printer_notes: ''
      between_objects_gcode: ''
      purge_in_prime_tower: false
      single_extruder_multi_material: true
      support_air_filtration: false
      template_custom_gcode: ''
      use_firmware_retraction: false
      use_relative_e_distances: true
      z_offset: 0
      thumbnails: 320x320/PNG, 160x160/PNG
      custom_parameters_printer: '{"parallel_printheads_count": 1}'
