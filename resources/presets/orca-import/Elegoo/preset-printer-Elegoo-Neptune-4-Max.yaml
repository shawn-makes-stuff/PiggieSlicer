kind: printer
id: c/GJWV3iutV8V5Vm5iOCLQ
variants:
- condition: printer.model == "Elegoo Neptune 4 Max"
  name: Elegoo Neptune 4 Max
  id: I1vDEU7ivNpTM7L1L1IkLw
  variants:
  - condition: tool.nozzle_diameter == 0.2
    id: Ksb+2jTcw137YTLfejUrUg
    values:
      bed_custom_model: ''
      bed_custom_texture: ''
      before_layer_gcode: |
        ;BEFORE_LAYER_CHANGE
        ;[layer_z]
        G92 E0
      change_extrusion_role_gcode: ''
      toolchange_gcode: M600
      cooling_tube_length: 5
      cooling_tube_retraction: 90
      default_print: 0.10mm Standard
      remaining_times: true
      machine_limits_usage: time_estimate_only
      enable_filament_ramming: true
      extra_loading_move: -2
      extruder_clearance_height: 34
      extruder_clearance_radius: 47
      extruder_offset:
      - -1.5x2
      gcode_flavor: klipper
      high_current_on_filament_swap: false
      layer_gcode: |
        ;LAYER:{layer_num+1}
      end_gcode: |-
        ;PRINT_END
        G90 ;Absolute positionning
        M83 ; extruder relative mode
        G92 E0 ; zero the extruder
        G1 E-1.5 F1800
        G2 I1 J0 Z{max_layer_z+0.5} F3000 ; lower z a little
        G90
        G1 X10 Y{print_bed_max[1]*0.8} Z{min(max_layer_z+50, max_print_height)} E-5 F{travel_speed*60} ; Move print head up
        M106 S0 ;Turn-off fan
        M104 S0 ;Turn-off hotend
        M140 S0 ;Turn-off bed
        M84 X Y E ;Disable all steppers but Z
      machine_max_acceleration_e:
      - 5000.0
      - 5000.0
      machine_max_acceleration_extruding:
      - 5000.0
      - 5000.0
      machine_max_acceleration_retracting:
      - 5000.0
      - 5000.0
      machine_max_acceleration_travel:
      - 5000.0
      - 5000.0
      machine_max_acceleration_x:
      - 5000.0
      - 5000.0
      machine_max_acceleration_y:
      - 5000.0
      - 5000.0
      machine_max_acceleration_z:
      - 300.0
      - 300.0
      machine_max_jerk_e:
      - 2.5
      - 2.5
      machine_max_jerk_x:
      - 9.0
      - 9.0
      machine_max_jerk_y:
      - 9.0
      - 9.0
      machine_max_jerk_z:
      - 3.0
      - 3.0
      machine_max_junction_deviation:
      - 0.01
      machine_max_feedrate_e:
      - 60.0
      - 60.0
      machine_max_feedrate_x:
      - 500.0
      - 500.0
      machine_max_feedrate_y:
      - 500.0
      - 500.0
      machine_max_feedrate_z:
      - 20.0
      - 20.0
      machine_min_extruding_rate:
      - 0.0
      - 0.0
      machine_min_travel_rate:
      - 0.0
      - 0.0
      pause_print_gcode: M600
      start_gcode: |
        ;;===== date: 20240520 =====================
        M400 ; wait for buffer to clear
        ;[printer_model]
        ;initial_filament:{filament_type[initial_extruder]}
        ;curr_bed_type={sheet_type}
        M220 S100 ;Set the feed speed to 100%
        M221 S100 ;Set the flow rate to 100%
        M104 S140
        M190 S[first_layer_bed_temperature[initial_extruder]]
        G90
        G28 ;home
        G1 Z10 F300
        G1 X{print_bed_max[0]*0.5-50} Y0.5 F6000
        G1 Z0.4 F300
        M109 S[first_layer_temperature]
        G92 E0 ;Reset Extruder
        G1 X{print_bed_max[0]*0.5+50} E30 F400 ;Draw the first line
        G1 Z0.6 F120.0 ;Move to side a little
        G1 X{print_bed_max[0]*0.5+47} F3000
        G92 E0 ;Reset Extruder
        ;LAYER_COUNT:[total_layer_count]
        ;LAYER:0
      parking_pos_retraction: 90
      bed_shape:
      - '0x0'
      - 426x0
      - 426x426
      - '0x426'
      max_print_height: 480
      printer_notes: ''
      between_objects_gcode: ''
      purge_in_prime_tower: false
      single_extruder_multi_material: true
      support_air_filtration: false
      template_custom_gcode: ''
      use_firmware_retraction: false
      use_relative_e_distances: true
      z_offset: 0
      thumbnails: 160x160/PNG
      custom_parameters_printer: '{"parallel_printheads_count": 1}'
