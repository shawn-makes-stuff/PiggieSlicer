        {if ((first_layer_print_max[1])) > 402.5}
        M140 T2 S[first_layer_bed_temperature[initial_extruder]]
        {endif}
        {endif}

        ;Case 4
        {if (min(print_bed_max[0], first_layer_print_min[0] + 32) - 32) > 405 && (max(0, first_layer_print_min[1])) > 402.5}
        M140 T2 S[first_layer_bed_temperature[initial_extruder]]
        {endif}
        {endif}

