        M140 T0 S[first_layer_bed_temperature[initial_extruder]]
        M140 T1 S[first_layer_bed_temperature[initial_extruder]]
        M140 T2 S[first_layer_bed_temperature[initial_extruder]]
        M140 T3 S[first_layer_bed_temperature[initial_extruder]]
        {endif}

        G90
        G28 ;home
        G1 Z10 F300

        {if custom_parameter_printer_parallel_printheads_count == 1}
        G1 X{print_bed_max[0]*0.75-50} Y0.5 F6000
        {endif}

        {if custom_parameter_printer_parallel_printheads_count == 2}
        G1 X{print_bed_max[0]*0.25-50} Y0.5 F6000
        {endif}

        {if custom_parameter_printer_parallel_printheads_count > 2}
        G1 X{print_bed_max[0]*0.125-50} Y0.5 F6000
        {endif}

        ;
        ;Giga zoned hot bed control
        {if custom_parameter_printer_parallel_printheads_count == 1}
        ;Case 1
        {if (min(print_bed_max[0], first_layer_print_min[0] + 32) - 32) < 405 && (max(0, first_layer_print_min[1])) < 402.5}
        M190 T0 S[first_layer_bed_temperature[initial_extruder]]
        {if ((min(print_bed_max[0], max(first_layer_print_min[0] + 32, first_layer_print_max[0])))) > 405}
        M190 T1 S[first_layer_bed_temperature[initial_extruder]]
        {endif}
        {if ((first_layer_print_max[1])) > 402.5}
        M190 T3 S[first_layer_bed_temperature[initial_extruder]]
        {endif}
        {if ((min(print_bed_max[0], max(first_layer_print_min[0] + 32, first_layer_print_max[0])))) > 405 && ((first_layer_print_max[1])) > 402.5}
        M190 T2 S[first_layer_bed_temperature[initial_extruder]]
        {endif}
        {endif}

        ;Case 2
        {if (min(print_bed_max[0], first_layer_print_min[0] + 32) - 32) < 405 && (max(0, first_layer_print_min[1])) > 402.5}
        M190 T3 S[first_layer_bed_temperature[initial_extruder]]
        {if ((min(print_bed_max[0], max(first_layer_print_min[0] + 32, first_layer_print_max[0])))) > 405}
        M190 T2 S[first_layer_bed_temperature[initial_extruder]]
        {endif}
        {endif}

        ;Case 3
        {if (min(print_bed_max[0], first_layer_print_min[0] + 32) - 32) > 405 && (max(0, first_layer_print_min[1])) < 402.5}
        M190 T1 S[first_layer_bed_temperature[initial_extruder]]
        {if ((first_layer_print_max[1])) > 402.5}
        M190 T2 S[first_layer_bed_temperature[initial_extruder]]
        {endif}
        {endif}

        ;Case 4
        {if (min(print_bed_max[0], first_layer_print_min[0] + 32) - 32) > 405 && (max(0, first_layer_print_min[1])) > 402.5}
        M190 T2 S[first_layer_bed_temperature[initial_extruder]]
        {endif}
        {endif}

        {if custom_parameter_printer_parallel_printheads_count > 1}
        ;Wait for all 4 bed zones to reach temperature
        M190 T0 S[first_layer_bed_temperature[initial_extruder]]
        M190 T1 S[first_layer_bed_temperature[initial_extruder]]
        M190 T2 S[first_layer_bed_temperature[initial_extruder]]
        M190 T3 S[first_layer_bed_temperature[initial_extruder]]
        {endif}
        G1 Z0.4 F300
        M109 S[first_layer_temperature]
        G92 E0 ;Reset Extruder

        {if custom_parameter_printer_parallel_printheads_count == 1}
        G1 X{print_bed_max[0]*0.75+50} E30 F400 ;Draw the first line
        G1 Z0.6 F120.0 ;Move to side a little
        G1 X{print_bed_max[0]*0.75+47} F3000
        {endif}

        {if custom_parameter_printer_parallel_printheads_count == 2}
        G1 X{print_bed_max[0]*0.25+50} E30 F400 ;Draw the first line
        G1 Z0.6 F120.0 ;Move to side a little
        G1 X{print_bed_max[0]*0.25+47} F3000
        {endif}

        {if custom_parameter_printer_parallel_printheads_count > 2}
        G1 X{print_bed_max[0]*0.125+50} E30 F400 ;Draw the first line
        G1 Z0.6 F120.0 ;Move to side a little
        G1 X{print_bed_max[0]*0.125+47} F3000
        {endif}

        G92 E0 ;Reset Extruder
        ;LAYER_COUNT:[total_layer_count]
