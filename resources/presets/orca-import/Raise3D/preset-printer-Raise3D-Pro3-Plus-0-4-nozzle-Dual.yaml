kind: printer
id: Tt6ikBPNU2Jg1P87eztm+Q
variants:
- condition: printer.model == "Raise3D Pro3 Plus 0.4 nozzle (Dual)"
  name: Raise3D Pro3 Plus 0.4 nozzle (Dual)
  id: wPcwdx/aN5m9FW46KXuilw
  variants:
  - condition: tool.nozzle_diameter == 0.4 and printer.tool_count == 2
    id: EpgkbY5ngH7v3YZtQZKLkw
    values:
      bed_custom_model: ''
      bed_custom_texture: ''
      before_layer_gcode: |-
        ; before layer [layer_num] change
        {if layer_z <= first_layer_height + layer_height * 2}
        M140 S{max(first_layer_bed_temperature[initial_extruder], first_layer_bed_temperature[initial_extruder])}
        {else}
        M140 S{max(bed_temperature[0], bed_temperature[1])}
        {endif}
        {if (filament_type[0] =="PLA" or filament_type[0] =="PETG")}
        {if layer_z >= first_layer_height + layer_height * 2}
        M106 P2 S150
        {elsif layer_z >= first_layer_height + layer_height * 1}
        M106 P2 S100
        {else}
        M106 P2 S0
        {endif}
        {endif}
      toolchange_gcode: ''
      cooling_tube_length: 5
      cooling_tube_retraction: 91.5
      default_print: 0.20mm Standard @Raise3D Pro3Plus
      remaining_times: true
      machine_limits_usage: emit_to_gcode
      extra_loading_move: -2
      extruder_clearance_height: 36
      extruder_clearance_radius: 65
      extruder_offset:
      - '0x0'
      - '0x0'
      gcode_flavor: marlin
      high_current_on_filament_swap: false
      layer_gcode: |-
        ;AFTER_LAYER_CHANGE
        ;[layer_z]
        G92 E0
      end_gcode: |-
        M221 T0 S100
        M104 S0
        M140 S0
        M107
        M106 P2 S0
        G91
        G1 E-1 F300
        G1 Z+0.5 E-5 X-20 Y-20 F9000.00
        G28 X0 Y0
        M84
        G90
      machine_max_acceleration_e:
      - 3000.0
      - 3000.0
      - 3000.0
      - 3000.0
      machine_max_acceleration_extruding:
      - 1000.0
      - 300.0
      - 1000.0
      - 300.0
      machine_max_acceleration_retracting:
      - 3000.0
      - 1500.0
      - 3000.0
      - 1500.0
      machine_max_acceleration_travel:
      - 1500.0
      - 500.0
      - 1500.0
      - 500.0
      machine_max_acceleration_x:
      - 1000.0
      - 1000.0
      - 1000.0
      - 1000.0
      machine_max_acceleration_y:
      - 1000.0
      - 1000.0
      - 1000.0
      - 1000.0
      machine_max_acceleration_z:
      - 100.0
      - 100.0
      - 100.0
      - 100.0
      machine_max_jerk_e:
      - 5.0
      - 5.0
      - 5.0
      - 5.0
      machine_max_jerk_x:
      - 5.0
      - 5.0
      - 5.0
      - 5.0
      machine_max_jerk_y:
      - 5.0
      - 5.0
      - 5.0
      - 5.0
      machine_max_jerk_z:
      - 0.4
      - 0.4
      - 0.4
      - 0.4
      machine_max_junction_deviation:
      - 0.01
      machine_max_feedrate_e:
      - 120.0
      - 120.0
      - 120.0
      - 120.0
      machine_max_feedrate_x:
      - 500.0
      - 200.0
      - 500.0
      - 200.0
      machine_max_feedrate_y:
      - 500.0
      - 200.0
      - 500.0
      - 200.0
      machine_max_feedrate_z:
      - 12.0
      - 12.0
      - 12.0
      - 12.0
      machine_min_extruding_rate:
      - 0.0
      machine_min_travel_rate:
      - 0.0
      pause_print_gcode: |-
        ; pause print
        M2000
      start_gcode: |-
        ;Bounding Box: {digits(first_layer_print_min[0],0,2)} {if(first_layer_print_max[0]>300)}{300}{else}{digits(first_layer_print_max[0],0,2)}{endif} {digits(first_layer_print_min[1],0,2)} {if(first_layer_print_max[1]>300)}{300}{else}{digits(first_layer_print_max[1],0,2)}{endif}

        M104 T0 S{first_layer_temperature[0] - 30} ; raise extruder one temp
        M104 T1 S{first_layer_temperature[1] - 30} ; raise extruder two temp
        M190 S{max(first_layer_bed_temperature[initial_extruder], first_layer_bed_temperature[initial_extruder])} ; wait for bed temp
        M109 T1 S{first_layer_temperature[1]} ; wait for extruder two temp
        T1
        G21
        G90
        M82
        M107
        M106 P2 S0
        G1 Z0.3 F500
        G92 E0
        G1 Z0.3 F400
        G1 X60 Y{random(2,8)} F1000
        G1 X110 Y{random(2,8)} E30 F200
        G1 Z0.3 E15 F200
        G92 E0
        G1 Z10 F2000 ; move up from purge line
        G1 X170 F2000 ; move away from purge line
        M104 T1 S{first_layer_temperature[1] - 30} ; lower extruder two temp
        M109 T0 S{first_layer_temperature[0]} ; wait for extruder one temp
        T0
        G1 Z0.3 F400
        G1 X220 Y{random(2,8)} F1000
        G1 X270 Y{random(2,8)} E18 F200
        G1 Z5 E15 F200
        G92 E0
        G1 Z10 F2000 ; move up from purge line
        G1 Y30 F2000 ; move away from purge line
        M104 T0 S{first_layer_temperature[1] - 30} ; lower extruder one temp
        G92 E0
        G1 X{(first_layer_print_max[0] + first_layer_print_min[0])/2} Y{(first_layer_print_max[1] + first_layer_print_min[1])/2} Z{first_layer_height} ; move to center of print
        M117 Printing...
      parking_pos_retraction: 92
      bed_shape:
      - '0x0'
      - 255x0
      - 255x300
      - '0x300'
      max_print_height: 605
      printer_notes: ''
      between_objects_gcode: ''
      single_extruder_multi_material: true
      template_custom_gcode: ''
      use_firmware_retraction: false
      use_relative_e_distances: true
      z_offset: 0
      thumbnails: 48x48/PNG, 300x300/PNG
      custom_parameters_printer: '{"support_air_filtration": true}'
