kind: printer
id: tkEDxITkDkvxGbvNurOnGw
variants:
- condition: printer.model == "RatRig V-Core 4 400"
  name: RatRig V-Core 4 400
  id: suhiog7KsgMTm7OJixt1cQ
  variants:
  - condition: tool.nozzle_diameter == 0.4
    id: HPhlU4V6Q11K5sol6nxSxg
    values:
      bed_custom_model: ''
      bed_custom_texture: ''
      before_layer_gcode: |-
        ;BEFORE_LAYER_CHANGE
        ;[layer_z]
        G92 E0
        _ON_LAYER_CHANGE LAYER={layer_num + 1}
      toolchange_gcode: M600
      cooling_tube_length: 5
      cooling_tube_retraction: 91.5
      default_print: 0.20mm Standard @RatRig
      remaining_times: true
      machine_limits_usage: time_estimate_only
      extra_loading_move: -2
      extruder_clearance_height: 25
      extruder_clearance_radius: 45
      extruder_offset:
      - '0x0'
      gcode_flavor: klipper
      high_current_on_filament_swap: false
      layer_gcode: |-
        ;AFTER_LAYER_CHANGE
        ;[layer_z]
      end_gcode: END_PRINT
      machine_max_acceleration_e:
      - 5000.0
      - 5000.0
      machine_max_acceleration_extruding:
      - 10000.0
      - 10000.0
      machine_max_acceleration_retracting:
      - 10000.0
      - 10000.0
