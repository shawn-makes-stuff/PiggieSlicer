      - 400.0
      machine_max_feedrate_z:
      - 200.0
      - 200.0
      machine_min_extruding_rate:
      - 0.0
      - 0.0
      machine_min_travel_rate:
      - 0.0
      - 0.0
      pause_print_gcode: PAUSE
      start_gcode: START_PRINT EXTRUDER_TEMP=[first_layer_temperature] EXTRUDER_OTHER_LAYER_TEMP=[temperature] BED_TEMP=[first_layer_bed_temperature[initial_extruder]] TOTAL_LAYER_COUNT={total_layer_count} X0={first_layer_print_min[0]} Y0={first_layer_print_min[1]} X1={first_layer_print_max[0]} Y1={first_layer_print_max[1]}
      parking_pos_retraction: 92
      bed_shape:
      - '0x0'
      - 400x0
      - 400x400
      - '0x400'
      max_print_height: 300
      printer_notes: ''
      between_objects_gcode: |-
        ;BETWEEN_OBJECTS
        G92 E0
      single_extruder_multi_material: true
      template_custom_gcode: ''
      use_firmware_retraction: false
      use_relative_e_distances: true
      z_offset: 0
      thumbnails: 64x64/PNG, 400x300/PNG
      custom_parameters_printer: '{"support_air_filtration": true}'
