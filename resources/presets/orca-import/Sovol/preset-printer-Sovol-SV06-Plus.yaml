kind: printer
id: BOnGkxf6M9qTlIHOdxukZQ
variants:
- condition: printer.model == "Sovol SV06 Plus"
  name: Sovol SV06 Plus
  id: U1Tu1U1q0ILm/xvIZkPBmQ
  variants:
  - condition: tool.nozzle_diameter == 0.4
    id: zFcgfohCbj7aG381eKzHCQ
    values:
      bed_custom_model: ''
      bed_custom_texture: ''
      before_layer_gcode: |+
        ;BEFORE_LAYER_CHANGE
        G92 E0.0
        ;[layer_z]

      toolchange_gcode: |-
        M600
        G1 E0.4 F1500 ; prime after color change
      cooling_tube_length: 5
      cooling_tube_retraction: 91.5
      default_print: 0.20mm Standard @Sovol SV06Plus
      remaining_times: true
      machine_limits_usage: emit_to_gcode
      extra_loading_move: -2
      extruder_clearance_height: 36
      extruder_clearance_radius: 65
      extruder_offset:
      - '0x0'
      gcode_flavor: marlin
      high_current_on_filament_swap: false
      layer_gcode: |-
        ;AFTER_LAYER_CHANGE
        ;[layer_z]
      end_gcode: |-
        M117 READY

        G1 E0 F1000 ; reset extruder

        G91 ; relative positioning
        G1 Z2 F1000 ; lift nozzle

        G90 ; absolute positioning
        G27 P2 ; park extruder

        M140 S0 ; turn off heatbed
        M104 S0 ; turn off temperature
        M107 ; turn off fan
        M84 X Y E ; disable motors
      machine_max_acceleration_e:
      - 5000.0
      machine_max_acceleration_extruding:
      - 1000.0
      - 1250.0
      machine_max_acceleration_retracting:
      - 1000.0
      - 1250.0
      machine_max_acceleration_travel:
      - 1500.0
      - 1250.0
      machine_max_acceleration_x:
      - 1500.0
      - 960.0
      machine_max_acceleration_y:
      - 1500.0
      - 960.0
      machine_max_acceleration_z:
      - 200.0
      - 200.0
      machine_max_jerk_e:
      - 10.0
      - 4.5
      machine_max_jerk_x:
      - 8.0
      - 8.0
      machine_max_jerk_y:
      - 8.0
      - 8.0
      machine_max_jerk_z:
      - 2.0
      - 0.4
      machine_max_junction_deviation:
      - 0.06
      - 0.0
      machine_max_feedrate_e:
      - 120.0
      - 120.0
      machine_max_feedrate_x:
      - 140.0
      - 140.0
      machine_max_feedrate_y:
      - 140.0
      - 140.0
      machine_max_feedrate_z:
      - 12.0
      - 12.0
      machine_min_extruding_rate:
      - 0.0
      machine_min_travel_rate:
      - 0.0
      pause_print_gcode: M601
      start_gcode: |
        G90 ; use absoulte coordinates
        M83 ; extruder relative mode

        M104 S150 ; set nozzle temp to 150

        G28 ; home all axes
        M420 S1 ;load mesh

        M140 S[first_layer_bed_temperature[initial_extruder]] ; set bed temp
        M190 S[first_layer_bed_temperature[initial_extruder]] ; wait for bed temp to stabilize
        M104 S[first_layer_temperature] ; set final extruder temp
        M109 S[first_layer_temperature] ; wait for extruder temp

        G1 X0.1 Y10 Z5.0 F1500 ; move to start position
        G1 Z0.26 F150 ; Move lower
        G4 S0.5 ; wait 0.5 seconds

        G1 X0.1 Y150 Z0.3 F1500 E10 ; prime the nozzle
        G1 X0.3 F1500
        G1 X0.4 Y15 Z0.3 F1500 E15 ; prime the nozzle
        G4 S0.1 ; wait 0.1 seconds

        G1 Z0.6 F150 ; lift nozzle
        G92 E0 ; Reset Extruder
        G1 Z2 F150 ; lift nozzle more
      parking_pos_retraction: 92
      bed_shape:
      - '0x0'
      - 300x0
      - 300x300
      - '0x300'
      max_print_height: 340
      printer_notes: ''
      between_objects_gcode: ''
      single_extruder_multi_material: true
      template_custom_gcode: ''
      use_firmware_retraction: false
      use_relative_e_distances: true
      z_offset: 0
      thumbnails: 48x48/PNG, 300x300/PNG
      custom_parameters_printer: '{"support_air_filtration": true}'
