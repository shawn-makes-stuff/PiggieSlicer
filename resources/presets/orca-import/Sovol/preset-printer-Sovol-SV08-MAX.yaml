        PAUSE
      start_gcode: |+
        {local _ow_w = custom_parameter_print_orca_outer_wall_line_width}{if custom_parameter_print_orca_outer_wall_line_width_percent}{_ow_w = _ow_w / 100 * filament_diameter[initial_extruder]}{endif}{if _ow_w == 0}{_ow_w = custom_parameter_print_orca_line_width}{if custom_parameter_print_orca_line_width_percent}{_ow_w = _ow_w / 100 * filament_diameter[initial_extruder]}{endif}{if _ow_w == 0}{_ow_w = filament_diameter[initial_extruder]}{endif}{endif}{local outer_wall_volumetric_speed = min(filament_max_volumetric_speed[initial_extruder], external_perimeter_speed[initial_extruder] * layer_height * (_ow_w - layer_height * (1 - 0.7853981633974483)))}G28
        M140 S[first_layer_bed_temperature[initial_extruder]] ;set bed temp
        M190 S[first_layer_bed_temperature[initial_extruder]] ;wait for bed temp
        START_PRINT
        G90
        G1 X0 Y0 F12000
        G1 Z0.300 F600
        M104 S[first_layer_temperature] ;set extruder temp
        M109 S[first_layer_temperature];wait for extruder temp
        {if first_layer_print_min[0] - 3 > print_bed_min[0]}
        G90
        M83
        G1 E-0.100 F600
        G1 X{first_layer_print_min[0] - 3} Y{first_layer_print_min[1]} F12000
        G1 Z0.3 F600 ;Move to start position
        G1 E0.100 F600
        G1 Y{first_layer_print_min[1] + 5 * 6} E{5 * 0.24 * 6}  F{outer_wall_volumetric_speed * 5 * 30}
        G1 Y{first_layer_print_min[1] + 5 * 6 * 2} E{5 * 0.16 * 6}  F{outer_wall_volumetric_speed * 5 * 30}
        G1 E-0.100 F600
        G1 Z1 F600
        G1 X{first_layer_print_min[0] - 2} Y{first_layer_print_min[1]} F12000
        G1 Z0.3 F600 ;Move to start position
        G1 E0.100 F600
        G1 Y{first_layer_print_min[1] + 5 * 6} E{5 * 0.24 * 6}  F{outer_wall_volumetric_speed * 5 * 30}
        G1 Y{first_layer_print_min[1] + 5 * 6 * 2} E{5 * 0.16 * 6}  F{outer_wall_volumetric_speed * 5 * 30}
        G1 E-0.100 F600
        {else}
        G90
        M83
        G1 E-0.100 Z3 F600
        G1 X-1.5 Y{first_layer_print_min[1]} F{outer_wall_volumetric_speed * 5 * 30}
        G1 Z0.3 F600
        G1 E0.100 F600
        G1 Y{first_layer_print_min[1] + 5 * 6} E{5 * 0.24 * 6}  F{outer_wall_volumetric_speed * 5 * 30}
        G1 Y{first_layer_print_min[1] + 5 * 6 * 2} E{5 * 0.16 * 6}  F{outer_wall_volumetric_speed * 5 * 30}
        G1 X-0.5 Y{first_layer_print_min[1]} F{outer_wall_volumetric_speed * 5 * 30}
        G1 Z0.3 F600
        G1 E0.100 F600
        G1 Y{first_layer_print_min[1] + 5 * 6} E{5 * 0.24 * 6}  F{outer_wall_volumetric_speed * 5 * 30}
        G1 Y{first_layer_print_min[1] + 5 * 6 * 2} E{5 * 0.16 * 6}  F{outer_wall_volumetric_speed * 5 * 30}
        G1 E-0.100 Z3 F600
        M400
        {endif}
        SET_PRINT_STATS_INFO TOTAL_LAYER=[total_layer_count]

      parking_pos_retraction: 92
      bed_shape:
      - '0x0'
      - 500x0
      - 500x500
      - '0x500'
      max_print_height: 500
