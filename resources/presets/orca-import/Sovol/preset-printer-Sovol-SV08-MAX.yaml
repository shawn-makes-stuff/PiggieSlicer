    values:
      bed_custom_model: ''
      bed_custom_texture: ''
      before_layer_gcode: |
        TIMELAPSE_TAKE_FRAME
        G92 E0
        SET_PRINT_STATS_INFO CURRENT_LAYER=[layer_num]
