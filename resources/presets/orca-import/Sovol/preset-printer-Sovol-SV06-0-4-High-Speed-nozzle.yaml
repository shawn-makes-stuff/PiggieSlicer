kind: printer
id: qzltzmR9kS501uq3algOlQ
variants:
- condition: printer.model == "Sovol SV06 0.4 High-Speed nozzle"
  name: Sovol SV06 0.4 High-Speed nozzle
  id: OBWwQbCz4+v1nnkyv67IIg
  variants:
