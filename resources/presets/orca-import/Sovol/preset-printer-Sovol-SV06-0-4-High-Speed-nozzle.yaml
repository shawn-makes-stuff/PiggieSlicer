      machine_max_acceleration_travel:
      - 1500.0
      - 1500.0
      machine_max_acceleration_x:
      - 5000.0
      - 5000.0
      machine_max_acceleration_y:
      - 5000.0
      - 5000.0
      machine_max_acceleration_z:
      - 500.0
      - 500.0
      machine_max_jerk_e:
      - 2.5
      - 2.5
      machine_max_jerk_x:
      - 5.0
      - 5.0
      machine_max_jerk_y:
      - 5.0
      - 5.0
      machine_max_jerk_z:
      - 0.4
      - 0.4
      machine_max_junction_deviation:
