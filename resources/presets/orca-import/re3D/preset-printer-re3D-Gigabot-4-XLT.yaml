kind: printer
id: Es3HWE+Kis1Yr9q8D07VxQ
variants:
- condition: printer.model == "re3D Gigabot 4 XLT"
  name: re3D Gigabot 4 XLT
  id: k8P8GbeV455XJ8Vly9f/3w
  variants:
  - condition: tool.nozzle_diameter == 0.4 and printer.tool_count == 2
    id: INAfqBAd78oSFze+kpMcRw
    values:
      bed_custom_model: ''
      bed_custom_texture: ''
      before_layer_gcode: |
        ;BEFORE_LAYER_CHANGE
        ;[layer_z]
        G92 E0
      toolchange_gcode: ''
      cooling_tube_length: 0
      cooling_tube_retraction: 0
      default_print: 0.26 Standard
      remaining_times: true
      machine_limits_usage: time_estimate_only
      extra_loading_move: -2
      extruder_clearance_height: 40
      extruder_clearance_radius: 40
      extruder_offset:
      - '0x0'
      - '0x0'
      gcode_flavor: klipper
      high_current_on_filament_swap: false
      layer_gcode: |-
        ;AFTER_LAYER_CHANGE
        ;[layer_z]
      end_gcode: |-
        G92 E0
        TURN_OFF_HEATERS
        G28 X Y
        M18
        M107
      machine_max_acceleration_e:
      - 5000.0
      - 5000.0
      machine_max_acceleration_extruding:
      - 1500.0
      - 1250.0
      machine_max_acceleration_retracting:
      - 1500.0
      - 1250.0
      machine_max_acceleration_travel:
      - 0.0
      - 0.0
      machine_max_acceleration_x:
      - 1000.0
      - 1000.0
      machine_max_acceleration_y:
      - 1000.0
      - 1000.0
      machine_max_acceleration_z:
      - 500.0
      - 200.0
      machine_max_jerk_e:
      - 2.5
      - 2.5
      machine_max_jerk_x:
      - 10.0
      - 10.0
      machine_max_jerk_y:
      - 10.0
      - 10.0
      machine_max_jerk_z:
      - 0.2
      - 0.4
      machine_max_junction_deviation:
      - 0.01
      machine_max_feedrate_e:
      - 120.0
      - 120.0
      machine_max_feedrate_x:
      - 500.0
      - 200.0
      machine_max_feedrate_y:
      - 500.0
      - 200.0
      machine_max_feedrate_z:
      - 12.0
      - 12.0
      machine_min_extruding_rate:
      - 0.0
      - 0.0
      machine_min_travel_rate:
      - 0.0
      - 0.0
      pause_print_gcode: PAUSE
      start_gcode: |-
        M83  ; Use relative extrusion distances
        G28  ; Home all axes
        M140 S{first_layer_bed_temperature[initial_tool]}  ; Start heating bed
        M190 S{first_layer_bed_temperature[initial_tool]}  ; Wait for bed to reach temperature

        T{initial_tool}


        ; ---------------------------
        ; HEAT THE USED TOOL
        ; ---------------------------
        {if is_extruder_used[initial_tool]}
        M104 T{initial_tool} S{first_layer_temperature[initial_tool]}  ; Preheat active extruder to first layer temperature
        M109 T{initial_tool} S{first_layer_temperature[initial_tool]}  ; Wait for active extruder to reach temperature
        {endif}

        G1 F18000
        G4 S0
        G92 E0
      parking_pos_retraction: 92
      bed_shape:
      - '0x0'
      - 590x0
      - 590x760
      - '0x760'
      max_print_height: 900
      printer_notes: ''
      between_objects_gcode: ''
      single_extruder_multi_material: false
      template_custom_gcode: ''
      use_firmware_retraction: false
      use_relative_e_distances: true
      z_offset: 0
      thumbnails: 48x48/PNG, 300x300/PNG
      custom_parameters_printer: '{"support_air_filtration": false}'
