      machine_min_travel_rate:
      - 0.0
      - 0.0
      pause_print_gcode: M601
      start_gcode: |-
        ;======= SEEMECNC BOSSDELTA 500 0521 START G-CODE =======
        G21              ; Set units to mm
        G90              ; Absolute positioning
        M82              ; Extruder to absolute mode
        G28              ; Home all axes
        G1 Z50 F9000     ; Lift nozzle for safe heating
        ; --- SELECT STARTING TOOL ---
        T[initial_tool]  ; Activate the first assigned filament in OrcaSlicer
        ; --- PREHEAT ---
        M140 S[first_layer_bed_temperature]  ; Start bed heating
        M104 S[first_layer_temperature]      ; Start nozzle heating
        M190 S[first_layer_bed_temperature]  ; Wait for bed to reach temp
        M109 S[first_layer_temperature]      ; Wait for nozzle to reach temp
