        G92 E0
        G1 E160.5 F3000  ; Retract 160mm
        G92 E0
        ; --- PURGE LINE (curved arc near front edge, 500mm bed) ---
        G92 E0
        G1 X-50 Y-234.7 Z0.4 F5000   ; Move to arc start (inside 250mm radius)
        G1 Z0.3 F1000                    ; Drop to prime height
        G3 X50 Y-234.7 R240.0 E40 F600  ; Arc purge, 100mm sweep, heavy extrusion
        G1 E38 F4500                     ; Retract 2mm before wipe (Bowden)
        G1 X65 Y-224.7 Z0.2 F6000     ; Wipe move at Z0.2
        G92 E0                           ; Zero extruder before print
        ;======= END START G-CODE =======
