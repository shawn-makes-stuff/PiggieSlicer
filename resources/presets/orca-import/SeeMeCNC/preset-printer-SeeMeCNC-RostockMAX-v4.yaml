        G1 X-50 Y-124.8 Z0.4 F5000   ; Move to arc start (inside 140mm radius)
        G1 Z0.3 F1000                    ; Drop to prime height
        G3 X50 Y-124.8 R134.4 E40 F600  ; Arc purge, 100mm sweep, heavy extrusion
        G1 E38 F4500                     ; Retract 2mm before wipe (Bowden)
        G1 X65 Y-114.8 Z0.2 F6000     ; Wipe move at Z0.2
        G92 E0                           ; Zero extruder before print
        ;======= END START G-CODE =======
