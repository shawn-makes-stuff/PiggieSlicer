      start_gcode: |-
        ;======= SEEMECNC ROSTOCKMAX V3.2 START G-CODE =======
        G21              ; Set units to mm
        G90              ; Absolute positioning
        M82              ; Extruder to absolute mode
        G28              ; Home all axes
        G1 Z50 F9000     ; Lift nozzle for safe heating
        ; --- SELECT STARTING TOOL ---
        T[initial_tool]  ; Activate the first assigned filament in OrcaSlicer
        ; --- PREHEAT ---
        M140 S[first_layer_bed_temperature]  ; Start bed heating
        M104 S[first_layer_temperature]      ; Start nozzle heating
        M190 S[first_layer_bed_temperature]  ; Wait for bed to reach temp
        M109 S[first_layer_temperature]      ; Wait for nozzle to reach temp
        ; --- RE-PRIME BOWDEN TUBE ---
        G92 E0
        G1 E160.5 F3000  ; Retract 160mm
        G92 E0
        ; --- PURGE LINE (curved arc near front edge, 270mm bed) ---
        G92 E0
        G1 X-50 Y-119.6 Z0.4 F5000   ; Move to arc start (inside 135mm radius)
        G1 Z0.3 F1000                    ; Drop to prime height
        G3 X50 Y-119.6 R129.6 E40 F600  ; Arc purge, 100mm sweep, heavy extrusion
        G1 E38 F4500                     ; Retract 2mm before wipe (Bowden)
        G1 X65 Y-109.6 Z0.2 F6000     ; Wipe move at Z0.2
        G92 E0                           ; Zero extruder before print
        ;======= END START G-CODE =======
