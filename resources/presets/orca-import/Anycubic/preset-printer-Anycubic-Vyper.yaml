kind: printer
id: 7aA9Q067UGiyiDGK1Boaiw
variants:
- condition: printer.model == "Anycubic Vyper"
  name: Anycubic Vyper
  id: MSJsZt6GM9HqhIbFxQd+KQ
  variants:
  - condition: tool.nozzle_diameter == 0.4
    id: ncO8S325v35bmAGuTenZfA
    values:
      bed_custom_model: ''
      bed_custom_texture: ''
      before_layer_gcode: |-
        ;BEFORE_LAYER_CHANGE
        ;[layer_z]
      change_extrusion_role_gcode: ''
      toolchange_gcode: M600
      cooling_tube_length: 5
      cooling_tube_retraction: 91.5
      default_print: 0.20mm Standard
      remaining_times: true
      machine_limits_usage: emit_to_gcode
      enable_filament_ramming: true
      extra_loading_move: -2
      extruder_clearance_height: 36
      extruder_clearance_radius: 65
      extruder_offset:
      - '0x0'
      gcode_flavor: marlin
      high_current_on_filament_swap: false
      layer_gcode: |-
        ;AFTER_LAYER_CHANGE
        ;[layer_z]
        G92 E0
      end_gcode: |-
        G4 ; wait
        G92 E0
        G1{if max_layer_z < max_print_height} Z{z_offset+min(max_layer_z+30, max_print_height)}{endif} ; move print head up
        M104 S0 ; turn off temperature
        M140 S0 ; turn off heatbed
        M107 ; turn off fan
        G1 X0 Y200 F3000 ; home X axis
        M84 ; disable motors
      machine_max_acceleration_e:
      - 5000.0
      - 5000.0
      machine_max_acceleration_extruding:
      - 1250.0
      - 1250.0
      machine_max_acceleration_retracting:
      - 1250.0
      - 1250.0
      machine_max_acceleration_travel:
      - 1000.0
      - 1000.0
      machine_max_acceleration_x:
      - 1000.0
      - 1000.0
      machine_max_acceleration_y:
      - 1000.0
      - 1000.0
      machine_max_acceleration_z:
      - 200.0
      - 200.0
      machine_max_jerk_e:
      - 5.0
      - 5.0
      machine_max_jerk_x:
      - 8.0
      - 8.0
      machine_max_jerk_y:
      - 8.0
      - 8.0
      machine_max_jerk_z:
      - 0.4
      - 0.4
      machine_max_junction_deviation:
      - 0.013
      - 0.0
      machine_max_feedrate_e:
      - 60.0
      - 60.0
      machine_max_feedrate_x:
      - 200.0
      - 200.0
      machine_max_feedrate_y:
      - 200.0
      - 200.0
      machine_max_feedrate_z:
      - 10.0
      - 10.0
      machine_min_extruding_rate:
      - 0.0
      - 0.0
      machine_min_travel_rate:
      - 0.0
      - 0.0
      pause_print_gcode: M601
      start_gcode: |-
        G21 ;metric values
        G90 ;absolute positioning
        M82 ;set extruder to absolute mode
        M107 ;start with the fan off
        G28 X0 Y0 ;move X/Y to min endstops
        G28 Z0 ;move Z to min endstops
        G0 Z0.2 F1800 ; move nozzle to print position
        G92 E0 ; specify current extruder position as zero
        M109 S[first_layer_temperature] ; wait for nozzle temp to stabilize
        G1 Y10 X180 E50 F1200 ; extrude a line in front of the printer
        G92 E0 ; specify current extruder position as zero
        G0 Z20 F6000 ; move head up
        G1 E-7 F2400 ; retract
        G04 S2 ; wait 2s
        G0 X0 F6000 ; wipe from oozed filament
        G1 E-1 F2400 ; undo some of the retraction to avoid oozing
        G1 F6000 ; set travel speed to move to start printing point
        M117
      parking_pos_retraction: 92
      bed_shape:
      - '0x0'
      - 250x0
      - 250x255
      - '0x255'
      max_print_height: 265
      printer_notes: ''
      between_objects_gcode: ''
      purge_in_prime_tower: true
      single_extruder_multi_material: true
      support_air_filtration: true
      template_custom_gcode: ''
      use_firmware_retraction: false
      use_relative_e_distances: true
      z_offset: 0
      thumbnails: 48x48/PNG, 300x300/PNG
