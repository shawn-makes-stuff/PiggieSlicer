      extruder_clearance_height: 30
      extruder_clearance_radius: 130
      extruder_offset:
      - '0x0'
      gcode_flavor: klipper
      high_current_on_filament_swap: false
      layer_gcode: ; AFTER_LAYER_CHANGE [layer_num] @ [layer_z]mm
      end_gcode: |-
        G92 E0
        G1 E-2 F3600
        {if max_layer_z < max_print_height-1}G1 Z{max_layer_z+2} F900 ; Move print head further up{endif}
        G1 X250 Y220 F12000 ; present print
        M140 S0 ; turn off heatbed
        M104 S0 ; turn off temperature
        M107;turn off fan
        M84; disable stepper motors
      machine_max_acceleration_e:
      - 20000.0
