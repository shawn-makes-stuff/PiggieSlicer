kind: printer
id: X5rOV7NETxMSA4jmRTzyNg
variants:
- condition: printer.model == "Anycubic Kobra Max"
  name: Anycubic Kobra Max
  id: jyuGTKpITWr2hnauJtWUqg
  variants:
  - condition: tool.nozzle_diameter == 0.4
    id: vF2yEZ2mK6IITijangF4nQ
    values:
      bed_custom_model: ''
      bed_custom_texture: ''
      before_layer_gcode: |+
        ;BEFORE_LAYER_CHANGE
        ;G92 E0.0
        ;[layer_z]

      change_extrusion_role_gcode: ''
      toolchange_gcode: M600
      cooling_tube_length: 5
      cooling_tube_retraction: 91.5
      default_print: 0.20mm Standard
      remaining_times: true
      machine_limits_usage: emit_to_gcode
      enable_filament_ramming: true
      extra_loading_move: -2
      extruder_clearance_height: 36
      extruder_clearance_radius: 65
      extruder_offset:
      - '0x0'
      gcode_flavor: marlin
      high_current_on_filament_swap: false
      layer_gcode: |-
        ;AFTER_LAYER_CHANGE
        ;[layer_z]
        G92 E0
      end_gcode: |-
        M104 S0;extruder heater off
        M140 S0;heated bed heater off (if you have it)
        G91;relative positioning
        G1 Z+10 F3600 ;move Z up a bit
        G90;absolute positioning
        G1 X10 F3000; get the head off the bed
        G1 F3000 Y400 ;kick the bed out
        M84;steppers off
        M355 S0;turn off the case light
      machine_max_acceleration_e:
      - 3000.0
      - 5000.0
      machine_max_acceleration_extruding:
      - 4000.0
      - 1250.0
      machine_max_acceleration_retracting:
      - 1000.0
      - 1250.0
      machine_max_acceleration_travel:
      - 4000.0
      - 1250.0
      machine_max_acceleration_x:
      - 700.0
      - 960.0
      machine_max_acceleration_y:
      - 600.0
      - 960.0
      machine_max_acceleration_z:
      - 100.0
      - 200.0
      machine_max_jerk_e:
      - 5.0
      - 4.5
      machine_max_jerk_x:
      - 20.0
      - 8.0
      machine_max_jerk_y:
      - 20.0
      - 8.0
      machine_max_jerk_z:
      - 0.3
      - 0.4
      machine_max_junction_deviation:
      - 0.01
      machine_max_feedrate_e:
      - 60.0
      - 120.0
      machine_max_feedrate_x:
      - 300.0
      - 100.0
      machine_max_feedrate_y:
      - 300.0
      - 100.0
      machine_max_feedrate_z:
      - 40.0
      - 12.0
      machine_min_extruding_rate:
      - 0.0
      - 0.0
      machine_min_travel_rate:
      - 0.0
      - 0.0
      pause_print_gcode: M601
      start_gcode: |-
        M104 S140;start the nozzle preheat and don't wait
        G21;metric values
        G90;absolute positioning
        M82;set extruder to absolute mode
        M107;start with the fan off
        G28;home all
        M190 S[first_layer_bed_temperature[initial_extruder]] ; set wait for bed temp
        M355 S1;turn on the case light
        M109 S[first_layer_temperature]; wait for extruder temp
        G1 Z15.0 F1000 ;move the nozzle up 15mm
        G92 E0;zero the extruded length
        G1 F100 E60;extrude 60mm of feed stock
        G92 E0;zero the extruded length again
      parking_pos_retraction: 92
      bed_shape:
      - '0x0'
      - 400x0
      - 400x400
      - '0x400'
      max_print_height: 450
      printer_notes: ''
      between_objects_gcode: ''
      purge_in_prime_tower: true
      single_extruder_multi_material: true
      support_air_filtration: true
      template_custom_gcode: ''
      use_firmware_retraction: false
      use_relative_e_distances: true
      z_offset: 0
      thumbnails: 48x48/PNG, 300x300/PNG
