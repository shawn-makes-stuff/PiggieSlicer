kind: printer
id: xiRuhzsoYh0ZUrv31/MeIg
variants:
- condition: printer.model == "Anycubic Kobra 2"
  name: Anycubic Kobra 2
  id: TjBodOuRcWrciVKlmUfmXA
  variants:
  - condition: tool.nozzle_diameter == 0.4
    id: 06HCyGG6BTtkaCb+8LMSSw
    values:
      bed_custom_model: ''
      bed_custom_texture: ''
      before_layer_gcode: |-
        ;BEFORE_LAYER_CHANGE
        [layer_num] @ [layer_z]mm
        G92 E0
      change_extrusion_role_gcode: ''
      toolchange_gcode: M600
      cooling_tube_length: 5
      cooling_tube_retraction: 91.5
      default_print: 0.20mm Standard
      remaining_times: true
      machine_limits_usage: emit_to_gcode
      enable_filament_ramming: true
      extra_loading_move: -2
      extruder_clearance_height: 36
      extruder_clearance_radius: 65
      extruder_offset:
      - '0x0'
      gcode_flavor: marlin
      high_current_on_filament_swap: false
      layer_gcode: |-
        ;AFTER_LAYER_CHANGE
        [layer_num] @ [layer_z]mm
      end_gcode: |-
        M104 S0 ;Extruder off
        M140 S0 ;Heatbed off
        M107 ;Fan off
        G91 ;Relative positioning
        G1 E-5 F3000 ;Retract filament
        G1 Z+0.3 F3000 ;Lift print head
        G28 X0 F3000 ;Home X axis
        M84 ;Disable stepper motors
      machine_max_acceleration_e:
      - 5000.0
      - 5000.0
      machine_max_acceleration_extruding:
      - 2500.0
      - 2500.0
      machine_max_acceleration_retracting:
      - 2500.0
      - 2500.0
      machine_max_acceleration_travel:
      - 3000.0
      - 1250.0
      machine_max_acceleration_x:
      - 2500.0
      - 2500.0
      machine_max_acceleration_y:
      - 2500.0
      - 2500.0
      machine_max_acceleration_z:
      - 800.0
      - 800.0
      machine_max_jerk_e:
      - 10.0
      - 10.0
      machine_max_jerk_x:
      - 15.0
      - 15.0
      machine_max_jerk_y:
      - 10.0
      - 10.0
      machine_max_jerk_z:
      - 2.0
      - 2.0
      machine_max_junction_deviation:
      - 0.01
      machine_max_feedrate_e:
      - 80.0
      - 80.0
      machine_max_feedrate_x:
      - 300.0
      - 300.0
      machine_max_feedrate_y:
      - 250.0
      - 250.0
      machine_max_feedrate_z:
      - 8.0
      - 8.0
      machine_min_extruding_rate:
      - 0.0
      - 0.0
      machine_min_travel_rate:
      - 0.0
      - 0.0
      pause_print_gcode: M601
      start_gcode: |-
        G90 ;Use absolute coordinates
        M83 ;Extruder relative mode
        M104 S[first_layer_temperature] ;Set extruder temp
        M140 S[first_layer_bed_temperature] ;Set bed temp
        M190 S[first_layer_bed_temperature] ;Wait for bed temp
        M109 S[first_layer_temperature] ;Wait for extruder temp
        G28 ;Move X/Y/Z to min endstops
        G1 Z0.28 ;Lift nozzle a bit
        G92 E0 ;Specify current extruder position as zero
        G1 Y3 F1800 ;Move Y to purge point
        G1 X60 E25 F500 ;Extrude 25mm of filament in a 5cm line
        G92 E0 ;Zero the extruded length again
        G1 E-2 F500 ;Retract a little
        G1 X70 F4000 ;Quickly wipe away from the filament line
        M117
      parking_pos_retraction: 92
      bed_shape:
      - '0x0'
      - 220x0
      - 220x220
      - '0x220'
      max_print_height: 250
      printer_notes: ''
      between_objects_gcode: ''
      purge_in_prime_tower: true
      single_extruder_multi_material: true
      support_air_filtration: true
      template_custom_gcode: ''
      use_firmware_retraction: false
      use_relative_e_distances: true
      z_offset: 0
      thumbnails: 48x48/PNG, 300x300/PNG
