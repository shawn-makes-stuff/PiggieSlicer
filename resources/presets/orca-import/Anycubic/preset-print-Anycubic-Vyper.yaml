  gap_fill_enabled: false
  gap_fill_speed: 30
  gcode_comments: false
  infill_anchor: 400%
  infill_anchor_max: 20
  automatic_infill_combination: false
  automatic_infill_combination_max_layer_height: 100%
  fill_angle: 45
  infill_overlap: 10%
  first_layer_acceleration: 1000
  first_layer_solid_infill_speed: 35
  first_layer_infill_speed: 35
  first_layer_extrusion_width: 0.4
  first_layer_height: 0.2
  first_layer_speed: 45
  initial_layer_travel_speed: 100%
  perimeter_acceleration: 0
  inner_wall_flow_ratio: 1
  perimeter_extrusion_width: 0.4
  perimeter_speed: 40
  interface_shells: false
  interlocking_beam: false
  interlocking_beam_layer_count: 2
  interlocking_beam_width: 0.8
