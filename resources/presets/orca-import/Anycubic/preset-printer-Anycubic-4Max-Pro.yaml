kind: printer
id: gsW00YbiQuybQpFeSXYBlA
variants:
- condition: printer.model == "Anycubic 4Max Pro"
  name: Anycubic 4Max Pro
  id: UP83LsRuHzalQVRgXo3V9g
  variants:
  - condition: tool.nozzle_diameter == 0.4
    id: E7bFkZHsmmqn5f+v6If/kw
    values:
      bed_custom_model: ''
      bed_custom_texture: ''
      before_layer_gcode: |
        ;BEFORE_LAYER_CHANGE
        ;[layer_z]
        G92 E0
      change_extrusion_role_gcode: ''
      toolchange_gcode: ''
      cooling_tube_length: 5
      cooling_tube_retraction: 91.5
      default_print: 0.20mm Standard
      remaining_times: true
      machine_limits_usage: emit_to_gcode
      enable_filament_ramming: true
      extra_loading_move: -2
      extruder_clearance_height: 36
      extruder_clearance_radius: 65
      extruder_offset:
      - '0x0'
      gcode_flavor: marlin
      high_current_on_filament_swap: false
      layer_gcode: ''
      end_gcode: PRINT_END
      machine_max_acceleration_e:
      - 5000.0
      - 5000.0
      machine_max_acceleration_extruding:
      - 2000.0
      - 2000.0
      machine_max_acceleration_retracting:
      - 5000.0
      - 5000.0
      machine_max_acceleration_travel:
      - 3000.0
      - 3000.0
      machine_max_acceleration_x:
      - 2000.0
      - 2000.0
      machine_max_acceleration_y:
      - 2000.0
      - 2000.0
      machine_max_acceleration_z:
      - 300.0
      - 200.0
      machine_max_jerk_e:
      - 2.5
      - 2.5
      machine_max_jerk_x:
      - 9.0
      - 9.0
      machine_max_jerk_y:
      - 9.0
      - 9.0
      machine_max_jerk_z:
      - 0.2
      - 0.4
      machine_max_junction_deviation:
      - 0.01
      machine_max_feedrate_e:
      - 25.0
      - 25.0
      machine_max_feedrate_x:
      - 300.0
      - 200.0
      machine_max_feedrate_y:
      - 300.0
      - 200.0
      machine_max_feedrate_z:
      - 12.0
      - 12.0
      machine_min_extruding_rate:
      - 0.0
      - 0.0
      machine_min_travel_rate:
      - 0.0
      - 0.0
      pause_print_gcode: |
        M400 U1
      start_gcode: |-
        M190 S[first_layer_bed_temperature[initial_extruder]]
        M109 S[first_layer_temperature]
        PRINT_START EXTRUDER=[first_layer_temperature] BED=[first_layer_bed_temperature[initial_extruder]]
