        ; PRINT_START EXTRUDER=[first_layer_temperature] BED=[first_layer_bed_temperature[initial_extruder]] Chamber=[chamber_temperature] PRINT_MIN={first_layer_print_min[0]},{first_layer_print_min[1]} PRINT_MAX={first_layer_print_max[0]},{first_layer_print_max[1]}
      parking_pos_retraction: 92
      bed_shape:
      - '0x0'
      - 270x0
      - 270x205
      - '0x205'
      max_print_height: 200
      printer_notes: ''
      between_objects_gcode: ''
      purge_in_prime_tower: true
      single_extruder_multi_material: true
      support_air_filtration: true
      template_custom_gcode: ''
      use_firmware_retraction: false
      use_relative_e_distances: true
      z_offset: 0
      thumbnails: 48x48/PNG, 300x300/PNG
