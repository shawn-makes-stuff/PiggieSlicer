kind: printer
id: 021cNNbnntj9Z7eMyU9Kmg
variants:
- condition: printer.model == "Anycubic Kobra 2 Pro"
  name: Anycubic Kobra 2 Pro
  id: vfmd4LDCye4CSd6q0oyGNw
  variants:
  - condition: tool.nozzle_diameter == 0.4
    id: OHrM38NzqWAXFlbrVEy9LA
    values:
      bed_custom_model: ''
      bed_custom_texture: ''
      before_layer_gcode: ''
      change_extrusion_role_gcode: ''
      toolchange_gcode: ''
      cooling_tube_length: 0
      cooling_tube_retraction: 0
      default_print: 0.16mm Optimal
      remaining_times: false
      machine_limits_usage: time_estimate_only
      enable_filament_ramming: false
      extra_loading_move: 0
      extruder_clearance_height: 25
      extruder_clearance_radius: 73
      extruder_offset:
      - '0x0'
      gcode_flavor: klipper
      high_current_on_filament_swap: false
      layer_gcode: |-
        ; layer num/total_layer_count: {layer_num+1}/[total_layer_count]
        ; update layer progress
        M73 L{layer_num+1}
        M991 S0 P{layer_num} ;notify layer change
      end_gcode: |-
        {if max_layer_z < max_print_height}G1 Z{z_offset+min(max_layer_z+2, max_print_height)} F600 ; Move print head up{endif}
        G1 X5 Y{print_bed_max[1]*0.95} F{travel_speed*60} ; present print
        {if max_layer_z < max_print_height-10}G1 Z{z_offset+min(max_layer_z+70, max_print_height-10)} F600 ; Move print head further up{endif}
        {if max_layer_z < max_print_height*0.6}G1 Z{max_print_height*0.6} F600 ; Move print head further up{endif}
        M140 S0 ; turn off heatbed
        M104 S0 ; turn off temperature
        M84; disable stepper motors
      machine_max_acceleration_e:
      - 20000.0
      - 20000.0
      machine_max_acceleration_extruding:
      - 20000.0
      - 20000.0
      machine_max_acceleration_retracting:
      - 20000.0
      - 20000.0
      machine_max_acceleration_travel:
      - 9000.0
      - 9000.0
      machine_max_acceleration_x:
      - 20000.0
      - 20000.0
      machine_max_acceleration_y:
      - 20000.0
      - 20000.0
      machine_max_acceleration_z:
      - 5000.0
      - 5000.0
      machine_max_jerk_e:
      - 20.0
      - 20.0
      machine_max_jerk_x:
      - 20.0
      - 20.0
      machine_max_jerk_y:
      - 20.0
      - 20.0
      machine_max_jerk_z:
      - 8.0
      - 8.0
      machine_max_junction_deviation:
      - 0.01
      machine_max_feedrate_e:
      - 80.0
      - 80.0
      machine_max_feedrate_x:
      - 500.0
      - 500.0
      machine_max_feedrate_y:
      - 500.0
      - 500.0
      machine_max_feedrate_z:
      - 16.0
      - 16.0
      machine_min_extruding_rate:
      - 0.0
      - 0.0
      machine_min_travel_rate:
      - 0.0
      - 0.0
      pause_print_gcode: M601
      start_gcode: |-
        G90 ;Use absolute coordinates
        M83 ;Extruder relative mode
        M140 S[first_layer_bed_temperature] ;Set bed temp
        M190 S[first_layer_bed_temperature] ;Wait for bed temp
        M104 S[first_layer_temperature] ;Set extruder temp
        M109 S[first_layer_temperature] ;Wait for extruder temp
        G28 ;Move X/Y/Z to min endstops
        G1 Z0.28 ;Lift nozzle a bit
        G92 E0 ;Specify current extruder position as zero
        G1 Y226 F1800 ;Move Y to purge point
        G1 X180 E25 F500 ;Extrude 25mm of filament in a 5cm line
        G92 E0 ;Zero the extruded length again
        G1 E-0.2 F500 ;Retract a little
        G1 X181 F4000 ;Quickly wipe away from the filament line
        M117
        M900 K0.07
      parking_pos_retraction: 0
      bed_shape:
      - '0x0'
      - 220x0
      - 220x220
      - '0x220'
      max_print_height: 250
      printer_notes: ''
      between_objects_gcode: ''
      purge_in_prime_tower: false
      single_extruder_multi_material: true
      support_air_filtration: false
      template_custom_gcode: ''
      use_firmware_retraction: false
      use_relative_e_distances: false
      z_offset: 0
      thumbnails: 230x110/PNG
