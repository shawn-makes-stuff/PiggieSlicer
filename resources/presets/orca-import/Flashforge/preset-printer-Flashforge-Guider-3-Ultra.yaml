kind: printer
id: bkfOFHcMHerg+L/ej2ZCfg
variants:
- condition: printer.model == "Flashforge Guider 3 Ultra"
  name: Flashforge Guider 3 Ultra
  id: R02P3N9LKlg7BrhIGLJH0g
  variants:
  - condition: tool.nozzle_diameter == 0.4
    id: yqCAsZcXvM0V95sUb0oWrw
    values:
      bed_custom_model: ''
      bed_custom_texture: ''
      before_layer_gcode: |-
        ;BEFORE_LAYER_CHANGE
        ;[layer_z]
        G92 E0
      toolchange_gcode: |
        ; change filament start
        {if total_toolchanges == 0 and current_extruder == 1}
        M104 S0 T0
        {elsif total_toolchanges > 0 and current_extruder == 0}
        M104 S{temperature[0]}
        {if layer_z == first_layer_height}
        T1
        M109 S{first_layer_temperature[1]} T1
        {else}
        T1
        M109 S{temperature[1]} T1
        {endif}
        {elsif total_toolchanges > 0 and current_extruder == 1}
        M104 S{temperature[1]}
        {if layer_z == first_layer_height}
        T0
        M109 S{first_layer_temperature[0]} T0
        {else}
        T0
        M109 S{temperature[0]} T0
        {endif}
        {endif}
      cooling_tube_length: 0
      cooling_tube_retraction: 0
      default_print: 0.20mm Standard @Flashforge G3U 0.4 Nozzle
      remaining_times: true
      machine_limits_usage: time_estimate_only
      extra_loading_move: 0
      extruder_clearance_height: 50
      extruder_clearance_radius: 57
      extruder_offset:
      - '0x0'
      gcode_flavor: klipper
      high_current_on_filament_swap: false
      layer_gcode: |-
        ;AFTER_LAYER_CHANGE
        ;[layer_z]
      end_gcode: |-
        G1 E-3 F3600
        G0 X50 Y50 F30000
        M104 S0 T0
        M104 S0 T1
      machine_max_acceleration_e:
      - 5000.0
      - 5000.0
      machine_max_acceleration_extruding:
      - 20000.0
      - 20000.0
      machine_max_acceleration_retracting:
      - 5000.0
      - 5000.0
      machine_max_acceleration_travel:
      - 20000.0
      - 20000.0
      machine_max_acceleration_x:
      - 20000.0
      - 20000.0
      machine_max_acceleration_y:
      - 20000.0
      - 20000.0
      machine_max_acceleration_z:
      - 500.0
      - 500.0
      machine_max_jerk_e:
      - 2.5
      - 2.5
      machine_max_jerk_x:
      - 9.0
      - 9.0
      machine_max_jerk_y:
      - 9.0
      - 9.0
      machine_max_jerk_z:
      - 3.0
      - 3.0
      machine_max_junction_deviation:
      - 0.01
      machine_max_feedrate_e:
      - 30.0
      - 30.0
      machine_max_feedrate_x:
      - 600.0
      - 600.0
      machine_max_feedrate_y:
      - 600.0
      - 600.0
      machine_max_feedrate_z:
      - 20.0
      - 20.0
      machine_min_extruding_rate:
      - 0.0
      - 0.0
      machine_min_travel_rate:
      - 0.0
      - 0.0
      pause_print_gcode: M25
      start_gcode: |+
        M190 S[first_layer_bed_temperature[initial_extruder]]
        {if total_toolchanges < 1}
        M109 S[first_layer_temperature] T[initial_extruder]
        T[initial_extruder]
        G21
        G90
        M83
        G1 Z0.3 F400
        G1 X-145 Y{random(-160,-152)} F4800
        G1 X-95 Y{random(-160,-152)} E30 F400
        G92 E0
        G1 Z10 F2000 ; move up from purge line
        G1 X-80 F4800 ; move away from purge line
        {else}
        M109 S{first_layer_temperature[0] - 30} T0
        M109 S{first_layer_temperature[1] - 30} T1
        {if initial_extruder==0}
        M109 S{first_layer_temperature[1]} T1
        T1
        G21
        G90
        M83
        G1 Z0.3 F400
        G1 X-145 Y{random(-160,-152)} F4800
        G1 X-95 Y{random(-160,-152)} E30 F400
        G1 E-15 F1800
        G92 E0
        G1 Z10 F2000 ; move up from purge line
        G1 X-80 F4800 ; move away from purge line
        M104 S{first_layer_temperature[1]-30} T1
        M109 S{first_layer_temperature[0]} T0
        T0
        G1 Z0.3 F400
        G1 X145 Y{random(-160,-152)} F4800
        G1 X95 Y{random(-160,-152)} E30 F400
        G1 E-0.8 F1800
        G92 E0
        G1 Z10 F2000 ; move up from purge line
        G1 X80 F4800 ; move away from purge line
        G92 E0
        {elsif current_extruder == 1}
        M109 S{first_layer_temperature[0]} T0
        T0
        G21
        G90
        M83
        G1 Z0.3 F400
        G1 X-145 Y{random(-160,-152)} F4800
        G1 X-95 Y{random(-160,-152)} E30 F400
        G1 E-15 F1800
        G92 E0
        G1 Z10 F2000 ; move up from purge line
        G1 X-80 F4800 ; move away from purge line
        M104 S{first_layer_temperature[0]-30} T0
        M109 S{first_layer_temperature[1]} T1
        T1
        G1 Z0.3 F400
        G1 X145 Y{random(-160,-152)} F4800
        G1 X95 Y{random(-160,-152)} E30 F400
        G1 E-0.8 F1800
        G92 E0
        G1 Z10 F2000 ; move up from purge line
        G1 X80 F4800 ; move away from purge line
        G92 E0
        {endif}
        {endif}

      parking_pos_retraction: 0
      bed_shape:
      - -150x-165
      - 150x-165
      - 150x165
      - -150x165
      max_print_height: 600
      printer_notes: ''
      between_objects_gcode: ''
      single_extruder_multi_material: true
      template_custom_gcode: ''
      use_firmware_retraction: false
      use_relative_e_distances: true
      z_offset: 0
      thumbnails: 140x110/PNG
      custom_parameters_printer: '{"support_air_filtration": true}'
