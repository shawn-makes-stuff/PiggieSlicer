kind: printer
id: mfwXnVatb5vcabXIEPLZjw
variants:
- condition: printer.model == "BIQU B1"
  name: BIQU B1
  id: HahtLmitP5ERuB81JPmRIQ
  variants:
  - condition: tool.nozzle_diameter == 0.4
    id: nMhih4m7j4wa1GfxKVuljA
    values:
      bed_custom_model: ''
      bed_custom_texture: ''
      before_layer_gcode: |
        ;BEFORE_LAYER_CHANGE
        ;[layer_z]
        G92 E0
      toolchange_gcode: ''
      cooling_tube_length: 5
      cooling_tube_retraction: 91.5
      default_print: 0.20mm Standard @BIQU B1 (0.4 nozzle)
      remaining_times: true
      machine_limits_usage: emit_to_gcode
      extra_loading_move: -2
      extruder_clearance_height: 34
      extruder_clearance_radius: 47
      extruder_offset:
      - '0x0'
      gcode_flavor: marlin
      high_current_on_filament_swap: false
      layer_gcode: ''
      end_gcode: |-
        ;BIQU B1 Default End Gcode
        G91;Relative positioning
        G1 E-2 F2700;Retract a bit
        G1 E-2 Z0.2 F2400;Retract a bit more and raise Z
        G1 X5 Y5 F3000;Wipe out
        G1 Z10;Raise Z by 10mm
        G90;Return to absolute positioning
        G1 X0 Y{print_bed_max[1]};
        M106 S0;Turn-off fan
        M104 S0;Turn-off hotend
        M140 S0;Turn-off bed
        M84 X Y E;Disable all steppers but Z
      machine_max_acceleration_e:
      - 10000.0
      - 10000.0
      machine_max_acceleration_extruding:
      - 1000.0
      - 1000.0
      machine_max_acceleration_retracting:
      - 1000.0
      - 1000.0
      machine_max_acceleration_travel:
      - 500.0
      - 500.0
      machine_max_acceleration_x:
      - 1000.0
      - 1000.0
      machine_max_acceleration_y:
      - 1000.0
      - 1000.0
      machine_max_acceleration_z:
      - 100.0
      - 100.0
      machine_max_jerk_e:
      - 5.0
      - 5.0
      machine_max_jerk_x:
      - 10.0
      - 10.0
      machine_max_jerk_y:
      - 10.0
      - 10.0
      machine_max_jerk_z:
      - 0.3
      - 0.3
      machine_max_junction_deviation:
      - 0.08
      - 0.0
      machine_max_feedrate_e:
      - 60.0
      - 60.0
      machine_max_feedrate_x:
      - 500.0
      - 500.0
      machine_max_feedrate_y:
      - 500.0
      - 500.0
      machine_max_feedrate_z:
      - 10.0
      - 10.0
      machine_min_extruding_rate:
      - 0.0
      - 0.0
      machine_min_travel_rate:
      - 0.0
      - 0.0
      pause_print_gcode: M25 ;pause print
      start_gcode: |-
        ; BIQU B1 Start G-code
        M117 Getting the bed up to temp!
        M140 S[first_layer_bed_temperature]; Set Heat Bed temperature
        M190 S[first_layer_bed_temperature]; Wait for Heat Bed temperature
        M117 Getting the extruder up to temp!
        M104 S[first_layer_temperature]; Set Extruder temperature
        G92 E0; Reset Extruder
        M117 Homing axes
        G28; Home all axes
        M109 S[first_layer_temperature]; Wait for Extruder temperature
        G1 Z2.0 F3000; Move Z Axis up little to prevent scratching of Heat Bed
        G1 X4.1 Y20 Z0.3 F5000.0; Move to start position
        M117 Purging
        G1 X4.1 Y200.0 Z0.3 F1500.0 E15; Draw the first line
        G1 X4.4 Y200.0 Z0.3 F5000.0; Move to side a little
        G1 X4.4 Y20 Z0.3 F1500.0 E30; Draw the second line
        G92 E0; Reset Extruder
        M117 Lets make
        G1 Z2.0 F3000; Move Z Axis up little to prevent scratching of Heat Bed
        G1 X5 Y20 Z0.3 F5000.0; Move over to prevent blob squish
      parking_pos_retraction: 92
      bed_shape:
      - '0x0'
      - 235x0
      - 235x235
      - '0x235'
      max_print_height: 270
      printer_notes: ''
      between_objects_gcode: ''
      single_extruder_multi_material: true
      template_custom_gcode: ''
      use_firmware_retraction: false
      use_relative_e_distances: true
      z_offset: 0
      thumbnails: 48x48/PNG, 300x300/PNG
      custom_parameters_printer: '{"support_air_filtration": true}'
