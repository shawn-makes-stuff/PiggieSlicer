kind: printer
id: LbvnIvzZyEb+jca4ME4eIA
variants:
- condition: printer.model == "FLSun QQ-S Pro"
  name: FLSun QQ-S Pro
  id: tp6gpwCzomLeQ5u2XygVng
  variants:
  - condition: tool.nozzle_diameter == 0.4
    id: XLJ98abCySeBqhpu1ibMIQ
    values:
      bed_custom_model: ''
      bed_custom_texture: ''
      before_layer_gcode: |
        ;BEFORE_LAYER_CHANGE
        ;[layer_z]
        G92 E0
      toolchange_gcode: ''
      cooling_tube_length: 5
      cooling_tube_retraction: 91.5
      default_print: 0.20mm Standard @FLSun QQSPro
      remaining_times: true
      machine_limits_usage: emit_to_gcode
      extra_loading_move: -2
      extruder_clearance_height: 36
      extruder_clearance_radius: 65
      extruder_offset:
      - '0x0'
      gcode_flavor: marlin
      high_current_on_filament_swap: false
      layer_gcode: |-
        ;AFTER_LAYER_CHANGE
        ;[layer_z]
      end_gcode: |-
        ; printing object ENDGCODE
        G92 E0.0 ; prepare to retract
        G1 E-6 F3000; retract to avoid stringing
        ; Anti-stringing end wiggle
        {if layer_z < max_print_height}G1 Z{min(layer_z+100, max_print_height)}{endif} F4000 ; Move print head up
        G1 X0 Y120 F3000 ; present print
        ; Reset print setting overrides
        G92 E0
        M200 D0 ; disable volumetric e
        M220 S100 ; reset speed factor to 100%
        M221 S100 ; reset extruder factor to 100%
        ;M900 K0 ; reset linear acceleration(Marlin)
        ; Shut down printer
        M104 S0 ; turn off temperature
        M140 S0 ; turn off heatbed
        M107 ; turn off fan
        M18 S180 ;disable motors after 180s
        M300 S40 P10 ; Bip
        M117 Print finish.
      machine_max_acceleration_e:
      - 3000.0
      - 800.0
      machine_max_acceleration_extruding:
      - 1500.0
      - 800.0
      machine_max_acceleration_retracting:
      - 2000.0
      - 800.0
      machine_max_acceleration_travel:
      - 1500.0
      - 800.0
      machine_max_acceleration_x:
      - 1500.0
      - 800.0
      machine_max_acceleration_y:
      - 1500.0
      - 800.0
      machine_max_acceleration_z:
      - 1500.0
      - 800.0
      machine_max_jerk_e:
      - 5.0
      - 5.0
      machine_max_jerk_x:
      - 5.0
      - 10.0
      machine_max_jerk_y:
      - 5.0
      - 10.0
      machine_max_jerk_z:
      - 5.0
      - 10.0
      machine_max_junction_deviation:
      - 0.01
      machine_max_feedrate_e:
      - 60.0
      - 30.0
      machine_max_feedrate_x:
      - 200.0
      - 150.0
      machine_max_feedrate_y:
      - 200.0
      - 150.0
      machine_max_feedrate_z:
      - 200.0
      - 150.0
      machine_min_extruding_rate:
      - 0.0
      - 0.0
      machine_min_travel_rate:
      - 0.0
      - 0.0
      pause_print_gcode: |
        M400 U1
      start_gcode: |-
        ;STARTGCODE
        M117 Initializing
        ; Set coordinate modes
        G90 ; use absolute coordinates
        M83 ; extruder relative mode
        ; Reset speed and extrusion rates
        M200 D0 ; disable volumetric E
        M220 S100 ; reset speed
        ; Set initial warmup temps
        M117 Nozzle preheat
        M104 S100 ; preheat extruder to no ooze temp
        M140 S[first_layer_bed_temperature[initial_extruder]] ; set bed temp
        M190 S[first_layer_bed_temperature[initial_extruder]] ; wait for bed final temp
        M300 S40 P10 ; Bip
        ; Home
        M117 Homing
        G28 ; home all with default mesh bed level
        ; For ABL users put G29 for a leveling request
        ; Final warmup routine
        M117 Final warmup
        M104 S[first_layer_temperature] ; set extruder final temp
        M109 S[first_layer_temperature] ; wait for extruder final temp
        M190 S[first_layer_bed_temperature[initial_extruder]] ; wait for bed final temp
        M300 S440 P200; 1st beep for printer ready and allow some time to clean nozzle
        M300 S0 P250; wait between dual beep
        M300 S440 P200; 2nd beep for printer ready
        G4 S10; wait to clean the nozzle
        M300 S440 P200; 3rd beep for ready to start printing
        ; Prime line routine
        M117 Printing prime line
        ;M900 K0; Disable Linear Advance (Marlin) for prime line
        G92 E0.0; reset extrusion distance
        G1 X-54.672 Y-95.203 Z0.3 F4000; go outside print area
        G92 E0.0; reset extrusion distance
        G1 E2 F1000 ; de-retract and push ooze
        G3 X38.904 Y-102.668 I54.672 J95.105 E20.999
        G3 X54.671 Y-95.203 I-38.815 J102.373 E5.45800
        G92 E0.0
        G1 E-5 F3000 ; retract 5mm
        G1 X52.931 Y-96.185 F1000 ; wipe
        G1 X50.985 Y-97.231 F1000 ; wipe
        G1 X49.018 Y-98.238 F1000 ; wipe
        G1 X0 Y-109.798 F1000
        G1 E4.8 F1500; de-retract
        G92 E0.0 ; reset extrusion distance
        ; Final print adjustments
        M117 Preparing to print
        ;M82 ; extruder absolute mode
        M221 S{if layer_height<0.075}100{else}95{endif}
        M300 S40 P10 ; chirp
        M117 Print [input_filename_base]; Display: Printing started...
      parking_pos_retraction: 92
      bed_shape:
