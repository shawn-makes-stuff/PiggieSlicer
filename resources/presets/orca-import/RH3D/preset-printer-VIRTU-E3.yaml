      - 230x0
      - 230x232
      - '0x232'
      max_print_height: 232
      printer_notes: Design by RH3D
      between_objects_gcode: ''
      single_extruder_multi_material: false
      template_custom_gcode: ''
      use_firmware_retraction: true
      use_relative_e_distances: true
      z_offset: 0
      thumbnails: 16x16/QOI, 313x173/QOI, 440x240/QOI, 480x240/QOI, 32x32/PNG, 320x240/PNG, 640x480/PNG
      custom_parameters_printer: '{"support_air_filtration": true}'
