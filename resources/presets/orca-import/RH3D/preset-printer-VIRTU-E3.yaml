        PAUSE
      start_gcode: |-
        M104 S0 ; Stops OrcaSlicer from sending temp waits separately
        M140 S0
        PRINT_START EXTRUDER=[first_layer_temperature] BED=[first_layer_bed_temperature] CHAMBER=[chamber_temperature] PROFILE=[notes]
        ; Start of actual GCode for the print
