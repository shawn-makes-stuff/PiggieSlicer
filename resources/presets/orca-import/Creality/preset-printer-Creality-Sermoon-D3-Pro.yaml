kind: printer
id: mN1f3Okl7MzSp4i/JEVvJg
variants:
- condition: printer.model == "Creality Sermoon D3 Pro"
  name: Creality Sermoon D3 Pro
  id: W6uYGjGrEsvibRHAK4ExiA
  variants:
  - condition: tool.nozzle_diameter == 0.4 and printer.tool_count == 2
    id: M2xuuxNZ7g+T/gW9qXi+ig
    values:
      bed_custom_model: ''
      bed_custom_texture: ''
      before_layer_gcode: |
        ;BEFORE_LAYER_CHANGE
        ;[layer_z]
        G92 E0
      toolchange_gcode: |
        ;switch//////////////////////////////////////////
        ; Change Tool[previous_extruder] -> Tool[next_extruder] (layer [layer_num])
        G1 F800 E-[new_retract_length]
        G1 F21000
        ;P0 S1 L2 D0
        T[next_extruder]
        M109 S[new_filament_temp]
        ;T0 S1 L0 D0
        ;switch//////////////////////////////////////////
      cooling_tube_length: 0
      cooling_tube_retraction: 0
      default_print: 0.20mm Standard @Creality Sermoon D3 Pro 0.4 nozzle
      remaining_times: false
      machine_limits_usage: emit_to_gcode
      extra_loading_move: 0
      extruder_clearance_height: 45
      extruder_clearance_radius: 45
      extruder_offset:
      - '0x0'
      - '0x0'
      gcode_flavor: marlin
      high_current_on_filament_swap: false
      layer_gcode: |-
        ;AFTER_LAYER_CHANGE
        ;[layer_z]
      end_gcode: |-
        G91 ;Relative positionning
        G1 E-2 F2700 ;Retract a bit
        G1 E-2 Z0.2 F2400 ;Retract and raise Z
        G1 X5 Y5 F3000 ;Wipe out
        ;G1 Z10 ;Raise Z more
        G90 ;Absolute positionning

        G1 X0 Y0 ;Present print
        M106 S0 ;Turn-off fan
        M104 S0 ;Turn-off hotend
        M140 S0 ;Turn-off bed

        M84 X Y E ;Disable all steppers but Z
      machine_max_acceleration_e:
      - 5000.0
      - 5000.0
      machine_max_acceleration_extruding:
      - 5000.0
      - 5000.0
      machine_max_acceleration_retracting:
      - 5000.0
      - 5000.0
      machine_max_acceleration_travel:
      - 20000.0
      - 20000.0
      machine_max_acceleration_x:
      - 3000.0
      - 3000.0
      machine_max_acceleration_y:
      - 3000.0
      - 3000.0
      machine_max_acceleration_z:
      - 100.0
      - 100.0
      machine_max_jerk_e:
      - 5.0
      - 5.0
      machine_max_jerk_x:
      - 10.0
      - 10.0
      machine_max_jerk_y:
      - 10.0
      - 10.0
      machine_max_jerk_z:
      - 0.4
      - 0.4
      machine_max_junction_deviation:
      - 0.01
      machine_max_feedrate_e:
      - 50.0
      - 50.0
      machine_max_feedrate_x:
      - 500.0
      - 500.0
      machine_max_feedrate_y:
      - 500.0
      - 500.0
      machine_max_feedrate_z:
      - 10.0
      - 10.0
      machine_min_extruding_rate:
      - 0.0
      - 0.0
      machine_min_travel_rate:
      - 0.0
      - 0.0
      pause_print_gcode: M25
      start_gcode: |-
        M900 T0 K0.03
        M900 T1 K0.05
        M593 X F35
        M593 Y F37.5
        M205 B20000.00 S0.00 T0.00 J0.05
        G21
        G90
        M83
        M107
        M220 S100 ;Reset Feedrate
        M221 S100 ;Reset Flowrate
        T[initial_extruder]
        M109 S[first_layer_temperature] T[initial_extruder]
        G28 ;Home

        G92 E0 ;Reset Extruder
        G1 Z2.0 F3000 ;Move Z Axis up
        G1 X10.1 Y20 Z0.28 F5000.0 ;Move to start position
        G1 X10.1 Y145.0 Z0.28 F1500.0 E15 ;Draw the first line
        G1 X10.4 Y145.0 Z0.28 F5000.0 ;Move to side a little
        G1 X10.4 Y20 Z0.28 F1500.0 E30 ;Draw the second line
        G92 E0  ;Reset Extruder
        G1 E-1.0000 F1800 ;Retract a bit
        G1 Z2.0 F3000 ;Move Z Axis up
        G1 E0.0000 F1800
      parking_pos_retraction: 0
      bed_shape:
      - '0x0'
      - 290x0
      - 290x220
      - '0x220'
      max_print_height: 300
      printer_notes: ''
      between_objects_gcode: ''
      single_extruder_multi_material: false
      template_custom_gcode: ''
      use_firmware_retraction: false
      use_relative_e_distances: true
      z_offset: 0
      thumbnails: 96x96/PNG, 300x300/PNG
      custom_parameters_printer: '{"long_retractions_when_cut__0": false, "long_retractions_when_cut__1": false, "retraction_distances_when_cut__0": 18.0, "retraction_distances_when_cut__1": 18.0, "support_air_filtration": true}'
