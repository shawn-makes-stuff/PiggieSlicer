kind: printer
id: fHfSL5qtfyb0KA8VHV7OXA
variants:
- condition: printer.model == "Creality CR-M4"
  name: Creality CR-M4
  id: odRfk6pbO2/iPlAm/cxyBQ
  variants:
  - condition: tool.nozzle_diameter == 0.4
    id: WMmU/X1/mXPa16FJ17NaZQ
    values:
      bed_custom_model: ''
      bed_custom_texture: ''
      before_layer_gcode: |
        ;BEFORE_LAYER_CHANGE
        ;[layer_z]
        G92 E0
      toolchange_gcode: ''
      cooling_tube_length: 5
      cooling_tube_retraction: 91.5
      default_print: 0.20mm Standard @Creality CR-M4
      remaining_times: true
      machine_limits_usage: emit_to_gcode
      extra_loading_move: -2
      extruder_clearance_height: 34
      extruder_clearance_radius: 47
      extruder_offset:
      - '0x0'
      gcode_flavor: marlin
      high_current_on_filament_swap: false
      layer_gcode: ''
      end_gcode: |-
        G91 ;Relative positionning
        G1 E-2 F2700 ;Retract a bit
        G1 E-2 Z0.2 F2400 ;Retract and raise Z
        G1 X5 Y5 F3000 ;Wipe out
        G1 Z10 ;Raise Z more
        G90 ;Absolute positionning
        G1 X0 Y0 ;Present print
        M106 S0 ;Turn-off fan
        M104 S0 ;Turn-off hotend
        M140 S0 ;Turn-off bed
        M84 X Y E ;Disable all steppers but Z
      machine_max_acceleration_e:
      - 5000.0
      - 5000.0
      machine_max_acceleration_extruding:
      - 700.0
      - 700.0
      machine_max_acceleration_retracting:
      - 1000.0
      - 1000.0
      machine_max_acceleration_travel:
      - 500.0
      - 500.0
      machine_max_acceleration_x:
      - 500.0
      - 500.0
      machine_max_acceleration_y:
      - 500.0
      - 500.0
      machine_max_acceleration_z:
      - 100.0
      - 100.0
      machine_max_jerk_e:
      - 5.0
      - 5.0
      machine_max_jerk_x:
      - 10.0
      - 10.0
      machine_max_jerk_y:
      - 10.0
      - 10.0
      machine_max_jerk_z:
      - 0.4
      - 0.4
      machine_max_junction_deviation:
      - 0.01
      machine_max_feedrate_e:
      - 50.0
      - 50.0
      machine_max_feedrate_x:
      - 500.0
      - 500.0
      machine_max_feedrate_y:
      - 500.0
      - 500.0
      machine_max_feedrate_z:
      - 10.0
      - 10.0
      machine_min_extruding_rate:
      - 0.0
      - 0.0
      machine_min_travel_rate:
      - 0.0
      - 0.0
      pause_print_gcode: M25 ;pause print
      start_gcode: |-
        M220 S100 ;Reset Feedrate
        M221 S100 ;Reset Flowrate
        M140 S[first_layer_bed_temperature[initial_extruder]] ; set final bed temp
        G28 ;Home
        G92 E0 ;Reset Extruder
        G1 Z2.0 F3000 ;Move Z Axis up
        G1 X10.1 Y20 Z0.28 F5000.0 ;Move to start position
        M104 S[first_layer_temperature] ; set final nozzle temp
        M190 S[first_layer_bed_temperature[initial_extruder]] ; wait for bed temp to stabilize
        M109 S[first_layer_temperature] ; wait for nozzle temp to stabilize
        G1 X10.1 Y145.0 Z0.28 F1500.0 E15 ;Draw the first line
        G1 X10.4 Y145.0 Z0.28 F5000.0 ;Move to side a little
        G1 X10.4 Y20 Z0.28 F1500.0 E30 ;Draw the second line
        G92 E0 ;Reset Extruder
        G1 E-1.0000 F1800 ;Retract a bit
        G1 Z2.0 F3000 ;Move Z Axis up
        G1 E0.0000 F1800
      parking_pos_retraction: 92
      bed_shape:
      - '0x0'
      - 450x0
      - 450x450
      - '0x450'
      max_print_height: 470
      printer_notes: ''
      between_objects_gcode: ''
      single_extruder_multi_material: true
      template_custom_gcode: ''
      use_firmware_retraction: false
      use_relative_e_distances: true
      z_offset: 0
      thumbnails: 48x48/PNG, 300x300/PNG
      custom_parameters_printer: '{"long_retractions_when_cut__0": false, "long_retractions_when_cut__1": false, "retraction_distances_when_cut__0": 18.0, "retraction_distances_when_cut__1": 18.0, "support_air_filtration": false}'
