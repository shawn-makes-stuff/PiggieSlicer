      start_gcode: "M220 S100 ;Reset Feedrate\nM221 S100 ;Reset Flowrate\n\nM140 S[first_layer_bed_temperature[initial_extruder]] ;Set final bed temp  \nG28 ;Home\n\nG92 E0 ;Reset Extruder\nG1 Z2.0 F3000 ;Move Z Axis up\nM104 S[first_layer_temperature] ;Set final nozzle temp  \nG1 X10.1 Y20 Z0.28 F5000.0 ;Move to start position\nM190 S[first_layer_bed_temperature[initial_extruder]] ;Wait for bed temp to stabilize  \nM109 S[first_layer_temperature] ;Wait for nozzle temp to stabilize  \nG1 X10.1 Y145.0 Z0.28 F1500.0 E15 ;Draw the first line\nG1 X10.4 Y145.0 Z0.28 F5000.0 ;Move to side a little\nG1 X10.4 Y20 Z0.28 F1500.0 E30 ;Draw the second line\nG92 E0  ;Reset Extruder\nG1 E-1.0000 F1800 ;Retract a bit\nG1 Z2.0 F3000 ;Move Z Axis up\nG1 E0.0000 F1800"
