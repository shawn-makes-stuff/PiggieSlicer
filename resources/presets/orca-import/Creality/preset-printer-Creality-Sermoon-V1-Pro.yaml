    values:
      bed_custom_model: ''
      bed_custom_texture: ''
      before_layer_gcode: |
        ;BEFORE_LAYER_CHANGE
        ;[layer_z]
        G92 E0
      toolchange_gcode: |-
        G2 Z{z_after_toolchange + 0.4} I0.86 J0.86 P1 F10000 ; spiral lift a little from second lift
        G1 X42 Y180 F30000
        G1 Z{z_after_toolchange} F600
      cooling_tube_length: 0
      cooling_tube_retraction: 0
