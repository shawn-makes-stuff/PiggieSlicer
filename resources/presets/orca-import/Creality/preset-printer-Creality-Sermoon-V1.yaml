kind: printer
id: esIdiBnFsNaCBUyz8HYEPg
variants:
- condition: printer.model == "Creality Sermoon V1"
  name: Creality Sermoon V1
  id: Rde88+D9o6zSNOEtT8tQGA
  variants:
  - condition: tool.nozzle_diameter == 0.4
    id: XZ8ctIQ3DnmzSM9y1QAaew
    values:
      bed_custom_model: ''
      bed_custom_texture: ''
      before_layer_gcode: |
        ;BEFORE_LAYER_CHANGE
        ;[layer_z]
        G92 E0
      toolchange_gcode: |-
        ; S1 Pause For Filament change
        M125
      cooling_tube_length: 5
      cooling_tube_retraction: 91.5
      default_print: 0.20mm Standard @Creality Sermoon V1
      remaining_times: true
      machine_limits_usage: emit_to_gcode
      extra_loading_move: -2
      extruder_clearance_height: 40
      extruder_clearance_radius: 50
      extruder_offset:
      - '0x0'
      gcode_flavor: marlin
      high_current_on_filament_swap: false
      layer_gcode: |-
        SET_PRINT_STATS_INFO CURRENT_LAYER={layer_num + 1}
        ;AFTER_LAYER_CHANGE
        ;Z>[layer_z]
      end_gcode: |-
        M140 S0                                ; Turn-off bed
        M107                                   ; Turn off cooling fan
        G91                                    ; Relative positioning
        G1 E-1 F2700                           ; Retract
        G1 E-2 Z0.2 F2400                      ; Retract and raise Z
        G1 X5 Y5 F3000                         ; Wipe
        G1 Z0.95                               ; Raise Z more
        G90                                    ; Absolute positioning
        G1 X10 Y160                            ; Eject print
        M106 S0                                ; Turn off fan
        M104 S0                                ; Turn-off hot end
        M140 S0                                ; Turn-off bed
        { if max_layer_z < max_print_height-10 }G1 Z{min(max_layer_z+70,max_print_height-10)}; move print up {endif}; Eject print z (conditional)
        M84 X Y E                              ; Disable steppers except Z
        G92 E0                                 ; Reset Extruder
        M82;abs extrusion
        END_PRINT
      machine_max_acceleration_e:
      - 5000.0
      - 5000.0
      machine_max_acceleration_extruding:
      - 7000.0
      - 500.0
      machine_max_acceleration_retracting:
      - 7000.0
      - 1000.0
      machine_max_acceleration_travel:
      - 500.0
      - 500.0
      machine_max_acceleration_x:
      - 7000.0
      - 500.0
      machine_max_acceleration_y:
      - 7000.0
      - 500.0
      machine_max_acceleration_z:
      - 500.0
      - 500.0
      machine_max_jerk_e:
      - 5.0
      - 5.0
      machine_max_jerk_x:
      - 8.0
      - 8.0
      machine_max_jerk_y:
      - 8.0
      - 8.0
      machine_max_jerk_z:
      - 0.4
      - 0.4
      machine_max_junction_deviation:
      - 0.01
      machine_max_feedrate_e:
      - 60.0
      - 60.0
      machine_max_feedrate_x:
      - 7000.0
      - 500.0
      machine_max_feedrate_y:
      - 7000.0
      - 500.0
      machine_max_feedrate_z:
      - 10.0
      - 10.0
      machine_min_extruding_rate:
      - 0.0
      - 0.0
      machine_min_travel_rate:
      - 0.0
      - 0.0
      pause_print_gcode: |
        M25 ;pause print
        ; Sermoon V1 Marlin buffers commands, so flush with these G4 P10 commands
        G4 P10
        G4 P10
        G4 P10
        G4 P10
        G4 P10
        G4 P10
        G4 P10
        G4 P10
        G4 P10
        G4 P10
      start_gcode: |-
        ;generated by SuperSlicer 1.5.0 on 2023-06-07 at 17:32:332
        G90 ; use absolute coordinates
        SET_PRINT_STATS_INFO TOTAL_LAYER=[total_layer_count]
        M140 S[first_layer_bed_temperature]                       ; Set bed temp
        M104 S170 ; set temporary nozzle temp to prevent oozing during homing
        G28                                    ; Home
        M105                                   ; Report Temps
        M190 S[first_layer_bed_temperature]                        ; Wait for bed to reach target
        M104 S[first_layer_temperature]                           ; Set hot end temp
        M105                                   ; Report Temps
        M109 S[first_layer_temperature]                           ; Wait for hot end to reach target
        M105                                   ; Report Temps
        M82                                    ; Absolute extrusion mode
        #G28                                    ; Home
        G92 E0                                 ; Reset Extruder
        G1 Z2.0 F3000                          ; Move Z Axis up
        G1 X173.0 Y10 Z0.28 F5000.0             ; Move to start position
        G1 X173.0 Y170.0 Z0.28 F1500.0 E15      ; Draw the first line
        G1 X173.4 Y170.0 Z0.28 F5000.0          ; Move to side a little
        G1 X173.4 Y40 Z0.28 F1500.0 E30         ; Draw the second line
        G92 E0                                 ; Reset Extruder
        G1 Z2.0 F3000                          ; Move Z Axis up
        G92 E0
        START_PRINT
      parking_pos_retraction: 92
      bed_shape:
      - '0x0'
      - 175x0
      - 175x175
      - '0x175'
      max_print_height: 165
      printer_notes: ''
      between_objects_gcode: ''
      single_extruder_multi_material: true
      template_custom_gcode: ''
      use_firmware_retraction: false
      use_relative_e_distances: true
      z_offset: 0
      thumbnails: 64x64/PNG, 400x400/PNG
      custom_parameters_printer: '{"long_retractions_when_cut__0": false, "long_retractions_when_cut__1": false, "retraction_distances_when_cut__0": 18.0, "retraction_distances_when_cut__1": 18.0, "support_air_filtration": false}'
