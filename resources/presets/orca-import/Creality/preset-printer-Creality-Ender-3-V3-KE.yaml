kind: printer
id: 5zk02OJosgmGEpxlTK/gmA
variants:
- condition: printer.model == "Creality Ender-3 V3 KE"
  name: Creality Ender-3 V3 KE
  id: pLHusvIR96DK2KlUk0CLhg
  variants:
  - condition: tool.nozzle_diameter == 0.2
    id: /jpR7jH0fwwFwUpzJb6rTA
    values:
      bed_custom_model: ''
      bed_custom_texture: ''
      before_layer_gcode: |
        ;BEFORE_LAYER_CHANGE
        ;[layer_z]
        G92 E0
      toolchange_gcode: M600
      cooling_tube_length: 5
      cooling_tube_retraction: 91.5
      default_print: 0.20mm Standard @Creality Ender3V3KE
      remaining_times: true
      machine_limits_usage: time_estimate_only
      extra_loading_move: -2
      extruder_clearance_height: 47
      extruder_clearance_radius: 90
      extruder_offset:
      - '0x0'
      gcode_flavor: klipper
      high_current_on_filament_swap: false
      layer_gcode: ''
      end_gcode: |-
        G92 E0 ;Reset Extruder
        G1 E-1.2 Z{max_layer_z + 0.5} F1800 ;Retract and raise Z
        {if max_layer_z < 50}
        G1 Z{max_layer_z + 25} F900 ;Raise Z more
        {endif}

        G1 X2 Y218 F3000 ;Present print
        M106 S0 ;Turn-off fan
        M104 S0 ;Turn-off hotend
        M140 S0 ;Turn-off bed

        M84 X Y E ;Disable all steppers but Z
      machine_max_acceleration_e:
      - 5000.0
      - 5000.0
      machine_max_acceleration_extruding:
      - 8000.0
      - 8000.0
      machine_max_acceleration_retracting:
      - 5000.0
      - 5000.0
      machine_max_acceleration_travel:
      - 8000.0
      - 8000.0
      machine_max_acceleration_x:
      - 8000.0
      - 8000.0
      machine_max_acceleration_y:
      - 8000.0
      - 8000.0
      machine_max_acceleration_z:
      - 300.0
      - 300.0
      machine_max_jerk_e:
      - 5.0
      - 5.0
      machine_max_jerk_x:
      - 7.0
      - 7.0
      machine_max_jerk_y:
      - 7.0
      - 7.0
      machine_max_jerk_z:
      - 0.4
      - 0.4
      machine_max_junction_deviation:
      - 0.01
      machine_max_feedrate_e:
      - 40.0
      - 40.0
      machine_max_feedrate_x:
      - 500.0
      - 500.0
      machine_max_feedrate_y:
      - 500.0
      - 500.0
      machine_max_feedrate_z:
      - 30.0
      - 30.0
      machine_min_extruding_rate:
      - 0.0
      - 0.0
      machine_min_travel_rate:
      - 0.0
      - 0.0
      pause_print_gcode: PAUSE
      start_gcode: |-
        SET_GCODE_VARIABLE MACRO=PRINTER_PARAM VARIABLE=fan0_min VALUE=30 ;compensate for fan speed
        SET_VELOCITY_LIMIT ACCEL_TO_DECEL=2500 ;revert accel_to_decel back to 2500
        M220 S100 ;Reset Feedrate
        M221 S100 ;Reset Flowrate

        M140 S[first_layer_bed_temperature[initial_extruder]] ;Set bed temp
        G28 X Y ;Home XY axes
        M190 S[first_layer_bed_temperature[initial_extruder]] ;Wait for bed temp to stabilize
        G28 Z ;Home Z axis & load bed mesh
        BED_MESH_CALIBRATE PROBE_COUNT=5,5 ;Auto bed level

        M104 S[first_layer_temperature] ;Set nozzle temp
        G92 E0 ;Reset Extruder
        G1 X-2.0 Y20 Z0.3 F5000.0 ;Move to start position
        M109 S[first_layer_temperature] ;Wait for nozzle temp to stabilize
        G1 Z0.2 ;Lower nozzle to printing height
        G1 Y145.0 F1500.0 E15 ;Draw the first line
        G1 X-1.7 F5000.0 ;Move to side a little
        G1 Y30 F1500.0 E15 ;Draw the second line
        G92 E0 ;Reset Extruder
      parking_pos_retraction: 92
      bed_shape:
      - '0x0'
      - 220x0
      - 220x220
      - '0x220'
      max_print_height: 245
      printer_notes: ''
      between_objects_gcode: ''
      single_extruder_multi_material: true
      template_custom_gcode: ''
      use_firmware_retraction: false
      use_relative_e_distances: true
      z_offset: 0
      thumbnails: 96x96/PNG, 300x300/PNG
      custom_parameters_printer: '{"long_retractions_when_cut__0": false, "long_retractions_when_cut__1": false, "retraction_distances_when_cut__0": 18.0, "retraction_distances_when_cut__1": 18.0, "support_air_filtration": false}'
