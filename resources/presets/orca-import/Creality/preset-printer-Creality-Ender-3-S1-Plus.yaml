kind: printer
id: e27dKBP7QPZCBCta3BH/Ew
variants:
- condition: printer.model == "Creality Ender-3 S1 Plus"
  name: Creality Ender-3 S1 Plus
  id: DNnn02zbLi9aX2cbQWI1KA
  variants:
  - condition: tool.nozzle_diameter == 0.2
    id: AgX3LNNkdUMl1tsv0QfNoA
    values:
      bed_custom_model: ''
      bed_custom_texture: ''
      before_layer_gcode: |
        ;BEFORE_LAYER_CHANGE
        ;[layer_z]
        G92 E0
      toolchange_gcode: M600
      cooling_tube_length: 5
      cooling_tube_retraction: 91.5
      default_print: 0.20mm Standard @Creality Ender3S1Plus 0.2
      remaining_times: true
      machine_limits_usage: emit_to_gcode
      extra_loading_move: -2
      extruder_clearance_height: 34
      extruder_clearance_radius: 47
      extruder_offset:
      - '0x0'
      gcode_flavor: marlin
      high_current_on_filament_swap: false
      layer_gcode: ''
      end_gcode: |-
        {if max_layer_z < max_print_height}G1 Z{z_offset+min(max_layer_z+2, max_print_height)} F600 ; Move print head up{endif}
        G1 X5 Y{print_bed_max[1]*0.8} F{travel_speed*60} ; present print
        {if max_layer_z < max_print_height-10}G1 Z{z_offset+min(max_layer_z+70, max_print_height-10)} F600 ; Move print head further up{endif}
        {if max_layer_z < max_print_height*0.6}G1 Z{max_print_height*0.6} F600 ; Move print head further up{endif}
        M140 S0 ; turn off heatbed
        M104 S0 ; turn off temperature
        M107 ; turn off fan
        M84 X Y E ; disable motors
      machine_max_acceleration_e:
      - 5000.0
      - 5000.0
      machine_max_acceleration_extruding:
      - 500.0
      - 500.0
      machine_max_acceleration_retracting:
      - 1000.0
      - 1000.0
      machine_max_acceleration_travel:
      - 5000.0
      - 5000.0
      machine_max_acceleration_x:
      - 500.0
      - 500.0
      machine_max_acceleration_y:
      - 500.0
      - 500.0
      machine_max_acceleration_z:
      - 100.0
      - 100.0
      machine_max_jerk_e:
      - 5.0
      - 5.0
      machine_max_jerk_x:
      - 8.0
      - 8.0
      machine_max_jerk_y:
      - 8.0
      - 8.0
      machine_max_jerk_z:
      - 0.4
      - 0.4
      machine_max_junction_deviation:
      - 0.013
      - 0.0
      machine_max_feedrate_e:
      - 60.0
      - 60.0
      machine_max_feedrate_x:
      - 500.0
      - 500.0
      machine_max_feedrate_y:
      - 500.0
      - 500.0
      machine_max_feedrate_z:
      - 10.0
      - 10.0
      machine_min_extruding_rate:
      - 0.0
      - 0.0
      machine_min_travel_rate:
      - 0.0
      - 0.0
      pause_print_gcode: M25
      start_gcode: "G90 ; use absolute coordinates\nM83 ; extruder relative mode\nM104 S150 ; set temporary nozzle temp to prevent oozing during homing\nM140 S[first_layer_bed_temperature[initial_extruder]] ; set final bed temp\nG4 S30 ; allow partial nozzle warmup\nG28 ; home all axis and restore leveling \nM420 S1; Enable mesh leveling\nG1 Z50 F240\nG1 X2.0 Y10 F3000\nM104 S[first_layer_temperature] ; set final nozzle temp\nM190 S[first_layer_bed_temperature[initial_extruder]] ; wait for bed temp to stabilize\nM109 S[first_layer_temperature] ; wait for nozzle temp to stabilize\nG1 Z0.28 F240\nG92 E0\nG1 X2.0 Y140 E10 F1500 ; prime the nozzle\nG1 X2.3 Y140 F5000\nG92 E0\nG1 X2.3 Y10 E10 F1200 ; prime the nozzle\nG92 E0"
      parking_pos_retraction: 92
      bed_shape:
      - '0x0'
      - 300x0
      - 300x300
      - '0x300'
      max_print_height: 300
      printer_notes: ''
      between_objects_gcode: ''
      single_extruder_multi_material: true
      template_custom_gcode: ''
