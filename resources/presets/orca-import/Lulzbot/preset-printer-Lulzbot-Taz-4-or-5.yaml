kind: printer
id: Q36SnDnoUpxYc7DFK87BWA
variants:
- condition: printer.model == "Lulzbot Taz 4 or 5"
  name: Lulzbot Taz 4 or 5
  id: o1fJKMOLkHeo3OyBVPUOTA
  variants:
  - condition: tool.nozzle_diameter == 0.5
    id: MlBuAmjXdcIWs8abMj49Hg
    values:
      bed_custom_model: ''
      bed_custom_texture: ''
      before_layer_gcode: G92 E0; reset relative extrusion
      toolchange_gcode: |-
        M400
        M600 B10 X115 Y-10 Z10
        M190 S{bed_temperature[0]}
        M109 S{temperature[0]}
      cooling_tube_length: 5
      cooling_tube_retraction: 91.5
      default_print: 0.25mm Standard @Lulzbot Taz 4 or 5
      remaining_times: true
      machine_limits_usage: time_estimate_only
      extra_loading_move: -2
      extruder_clearance_height: 36
      extruder_clearance_radius: 65
      extruder_offset:
      - '0x0'
      gcode_flavor: marlin2
      high_current_on_filament_swap: false
      layer_gcode: |-
        ; LAYER:{layer_num}
        M117 Layer: {layer_num +1} / [total_layer_count]
      end_gcode: |-
        ;End G-Code Begin
        M400; wait for moves to finish
        M140 S0; disable hotend
        M104 S0; disable bed heater
        M107; disable fans
        G91; relative positioning
        G1 E-1 F300; filament retraction to release pressure
        G1 Z0.5 E-5 X-20 Y-20 F3000; lift up and retract even more filament
        M77;stopGLCD timer
        G90;absolute positioning
        G1 X0 Y250;move to cooling position
        M84;disable steppers
        M117 Print Complete.;print complete message
      machine_max_acceleration_e:
      - 5000.0
      machine_max_acceleration_extruding:
      - 500.0
      - 500.0
      machine_max_acceleration_retracting:
      - 1000.0
      - 1000.0
      machine_max_acceleration_travel:
      - 1250.0
      - 1250.0
      machine_max_acceleration_x:
      - 500.0
      - 500.0
      machine_max_acceleration_y:
      - 500.0
      - 500.0
      machine_max_acceleration_z:
      - 100.0
      - 100.0
      machine_max_jerk_e:
      - 5.0
      - 5.0
      machine_max_jerk_x:
      - 8.0
      - 8.0
      machine_max_jerk_y:
      - 8.0
      - 8.0
      machine_max_jerk_z:
      - 0.4
      - 0.4
      machine_max_junction_deviation:
      - 0.051
      - 0.0
      machine_max_feedrate_e:
      - 60.0
      - 60.0
      machine_max_feedrate_x:
      - 500.0
      - 500.0
      machine_max_feedrate_y:
      - 500.0
      - 500.0
      machine_max_feedrate_z:
      - 10.0
      - 10.0
      machine_min_extruding_rate:
      - 0.0
      machine_min_travel_rate:
      - 0.0
      pause_print_gcode: M600 B10
      start_gcode: |-
        ;This G-Code has been generated specifically for the Lulzbot Taz 4 and 5 - translated from CuraLE 4.13.10 by Wrathernaut
        M73 P0; clear GLCD progress bar
        M75; start GLCD timer
        M140 S{first_layer_bed_temperature[0]}; start bed heating up
        G90; absolute positioning
        M107; disable fans
        M82; set extruder to absolute mode
        G28 X0 Y0; home X and Y
        G28 Z0; home Z
        G1 Z15.0 F175; move extruder up
        M117 Heating...; progress indicator message on LCD
        M109 R{first_layer_temperature[0]}; wait for extruder to reach printing temp
        M190 R{first_layer_bed_temperature[0]}; wait for bed to reach printing temp
        G92 E0; set extruder position to 0
        G1 F200 E0; prime the nozzle with filament
        G92 E0; re-set extruder position to 0
        G1 F175; set travel speed
        M203 X192 Y208 Z3; set limits on travel speed
        M117 TAZ Printing...; progress indicator message on LCD
        ;Start G-Code End
      parking_pos_retraction: 92
      bed_shape:
      - '0x0'
      - 280x0
      - 280x280
      - '0x280'
      max_print_height: 250
      printer_notes: ''
      between_objects_gcode: ''
      single_extruder_multi_material: true
      template_custom_gcode: ''
      use_firmware_retraction: false
      use_relative_e_distances: true
      z_offset: 0
      thumbnails: 48x48/PNG, 300x300/PNG
      custom_parameters_printer: '{"support_air_filtration": true}'
