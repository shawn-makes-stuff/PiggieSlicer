kind: printer
id: JLhxbmqqQKEC6kAlArJ8lg
variants:
- condition: printer.model == "Lulzbot Mini 1"
  name: Lulzbot Mini 1
  id: GKebeySTysQYIiBnRXskOA
  variants:
  - condition: tool.nozzle_diameter == 0.5
    id: C9dAUe2QF9UArNEnNwK/7g
    values:
      bed_custom_model: ''
      bed_custom_texture: ''
      before_layer_gcode: G92 E0; reset relative extrusion
      toolchange_gcode: ''
      cooling_tube_length: 5
      cooling_tube_retraction: 91.5
      default_print: 0.25mm Standard @Lulzbot Mini 1
      remaining_times: true
      machine_limits_usage: time_estimate_only
      extra_loading_move: -2
      extruder_clearance_height: 36
      extruder_clearance_radius: 65
      extruder_offset:
      - '0x0'
      gcode_flavor: marlin2
      high_current_on_filament_swap: false
      layer_gcode: |-
        ; LAYER:{layer_num}
        M117 Layer: {layer_num +1} / [total_layer_count]
      end_gcode: |-
        ;End G-Code Begin
        M400; wait for moves to finish
        M104 S0; disable hotend
        M140 S0; start bed cooling
        M107; disable fans
        G92 E5; set extruder to 5mm for retract on print end
        G1 X5 Y5 Z158 E0 F10000; move to cooling position, retracting on the way
        G1 E5; re-prime extruder
        M77; stop GLCD timer
        G1 X145 F1000; move extruder out of the way
        G1 Y175 F1000; present finished print
        M84; disable steppers
        G90; absolute positioning
        M117 Print Complete.; print complete message
        ;End G-Code End
      machine_max_acceleration_e:
      - 5000.0
      machine_max_acceleration_extruding:
      - 2000.0
      - 2000.0
      machine_max_acceleration_retracting:
      - 1000.0
      - 1000.0
      machine_max_acceleration_travel:
      - 2000.0
      - 2000.0
      machine_max_acceleration_x:
      - 2000.0
      - 2000.0
      machine_max_acceleration_y:
      - 2000.0
      - 2000.0
      machine_max_acceleration_z:
      - 100.0
      - 100.0
      machine_max_jerk_e:
      - 5.0
      - 5.0
      machine_max_jerk_x:
      - 8.0
      - 8.0
      machine_max_jerk_y:
      - 8.0
      - 8.0
      machine_max_jerk_z:
      - 0.4
      - 0.4
      machine_max_junction_deviation:
      - 0.01
      machine_max_feedrate_e:
      - 40.0
      - 40.0
      machine_max_feedrate_x:
      - 500.0
      - 500.0
      machine_max_feedrate_y:
      - 500.0
      - 500.0
      machine_max_feedrate_z:
      - 3.0
      - 3.0
      machine_min_extruding_rate:
      - 0.0
      machine_min_travel_rate:
      - 0.0
      pause_print_gcode: ''
      start_gcode: |-
