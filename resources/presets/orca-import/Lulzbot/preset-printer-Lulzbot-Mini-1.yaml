        {elsif filament_type[0] == "PVA"}R160
        {elsif filament_type[0] == "PVB"}R160
        {elsif filament_type[0] == "SBS"}R180
        {elsif filament_type[0] == "TPU"}R160
        {elsif filament_type[0] == "FLEX"}R160
