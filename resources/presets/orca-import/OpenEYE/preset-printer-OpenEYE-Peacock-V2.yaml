  - condition: tool.nozzle_diameter == 0.2
    id: 79A4RJEeToAbm0bAVyFDkQ
    values:
      bed_custom_model: ''
      bed_custom_texture: ''
      before_layer_gcode: |-
        ;BEFORE_LAYER_CHANGE
        ;[layer_z]
        G92 E0
        TIMELAPSE_TAKE_FRAME
      toolchange_gcode: ''
      cooling_tube_length: 0
      cooling_tube_retraction: 0
      default_print: 0.10mm Standard @OpenEYE Peacock V2 0.2 nozzle
      remaining_times: true
      machine_limits_usage: time_estimate_only
      extra_loading_move: 0
      extruder_clearance_height: 34
      extruder_clearance_radius: 47
      extruder_offset:
      - '0x0'
      gcode_flavor: klipper
      high_current_on_filament_swap: false
      layer_gcode: |-
        SET_PRINT_STATS_INFO CURRENT_LAYER={layer_num + 1}
        _MMU_UPDATE_HEIGHT
      end_gcode: |-
        MMU_END
        END_PRINT
      machine_max_acceleration_e:
      - 5000.0
      - 5000.0
      machine_max_acceleration_extruding:
      - 20000.0
      - 20000.0
      machine_max_acceleration_retracting:
      - 5000.0
      - 5000.0
      machine_max_acceleration_travel:
      - 9000.0
      - 9000.0
      machine_max_acceleration_x:
      - 20000.0
      - 20000.0
      machine_max_acceleration_y:
      - 20000.0
      - 20000.0
      machine_max_acceleration_z:
      - 500.0
      - 500.0
      machine_max_jerk_e:
      - 2.5
      - 2.5
      machine_max_jerk_x:
      - 9.0
      - 9.0
      machine_max_jerk_y:
      - 9.0
      - 9.0
      machine_max_jerk_z:
      - 3.0
      - 3.0
      machine_max_junction_deviation:
      - 0.0
      - 0.0
      machine_max_feedrate_e:
      - 60.0
      - 60.0
      machine_max_feedrate_x:
      - 500.0
      - 500.0
      machine_max_feedrate_y:
      - 500.0
      - 500.0
      machine_max_feedrate_z:
      - 30.0
      - 30.0
      machine_min_extruding_rate:
      - 0.0
      - 0.0
      machine_min_travel_rate:
      - 0.0
      - 0.0
      pause_print_gcode: PAUSE
      start_gcode: |-
        {local adaptive_bed_mesh_min = (max(1.5, first_layer_print_min[0] - 10), max(7, first_layer_print_min[1] - 10))}{local adaptive_bed_mesh_max = (min(211, first_layer_print_max[0] + 10), min(211, first_layer_print_max[1] + 10))}{local bed_mesh_probe_count = (max(3, int(ceil((adaptive_bed_mesh_max[0] - adaptive_bed_mesh_min[0]) / 50)) + 1), max(3, int(ceil((adaptive_bed_mesh_max[1] - adaptive_bed_mesh_min[1]) / 50)) + 1))}{local bed_mesh_algo = "bicubic"}{if bed_mesh_probe_count[0] * bed_mesh_probe_count[1] <= 6}{bed_mesh_algo = "lagrange"}{else}{bed_mesh_probe_count = (max(bed_mesh_probe_count[0], 4), max(bed_mesh_probe_count[1], 4))}{endif}SET_PRINT_STATS_INFO TOTAL_LAYER=[total_layer_count]
        MMU_START_SETUP INITIAL_TOOL={initial_tool} TOTAL_TOOLCHANGES=!total_toolchanges! REFERENCED_TOOLS=!referenced_tools! TOOL_COLORS=!colors! TOOL_TEMPS=!temperatures! TOOL_MATERIALS=!materials! FILAMENT_NAMES=!filament_names! PURGE_VOLUMES=!purge_volumes!
        MMU_START_CHECK
        START_PRINT BED_TEMP=[first_layer_bed_temperature] EXTRUDER_TEMP=[first_layer_temperature] BED_TYPE="{sheet_type}" MESH_MIN={adaptive_bed_mesh_min[0]},{adaptive_bed_mesh_min[1]} MESH_MAX={adaptive_bed_mesh_max[0]},{adaptive_bed_mesh_max[1]} ALGORITHM={bed_mesh_algo} PROBE_COUNT={bed_mesh_probe_count[0]},{bed_mesh_probe_count[1]} ADAPTIVE_MARGIN={custom_parameter_printer_adaptive_bed_mesh_margin}
        ; Enter YOUR exist start_print macro call here (minus purging logic because tool may not be loaded yet)
        MMU_START_LOAD_INITIAL_TOOL
        ; Optionally add YOUR additional start logic (like purging) here to run just prior to start
        START_PRINT_SECONDARY
        SET_PRINT_STATS_INFO TOTAL_LAYER={total_layer_count} ; For pause at layer functionality and better print stats
      parking_pos_retraction: 0
      bed_shape:
      - 1.5x7
      - 235x7
      - 235x235
      - 1.5x235
      max_print_height: 200
      printer_notes: ''
      between_objects_gcode: ''
      single_extruder_multi_material: true
      template_custom_gcode: ''
      use_firmware_retraction: false
      use_relative_e_distances: true
      z_offset: 0
      thumbnails: 48x48/PNG, 300x300/PNG
      custom_parameters_printer: '{"adaptive_bed_mesh_margin": 10.0, "support_air_filtration": false}'
