kind: printer
id: TR3iLwp/FOZDFn+/PKBLXA
variants:
- condition: printer.model == "Meltingplot CHX 350"
  name: Meltingplot CHX 350
  id: lrLPGQJ/BM4TWU/pC4hP+w
  variants:
  - condition: tool.nozzle_diameter == 0.4
    id: +R+1Cr9pTtRAkUXnxgCYvg
    values:
      bed_custom_model: ''
      bed_custom_texture: ''
      before_layer_gcode: |
        ;BEFORE_LAYER_CHANGE
        ;[layer_z]
      toolchange_gcode: ''
      cooling_tube_length: 5
      cooling_tube_retraction: 91.5
      default_print: 0.18mm Fine 0.4 nozzle @Meltingplot CHX 350
      remaining_times: false
      machine_limits_usage: time_estimate_only
      extra_loading_move: -2
      extruder_clearance_height: 20
      extruder_clearance_radius: 65
      extruder_offset:
      - '0x0'
      gcode_flavor: reprapfirmware
      high_current_on_filament_swap: false
      layer_gcode: |-
        ;AFTER_LAYER_CHANGE
        ;[layer_z]
      end_gcode: |-
        G90
        G1 Z{min(max_layer_z + 5, max_print_height)} F600
        M98 P"0:/sys/meltingplot/print_end"
      machine_max_acceleration_e:
      - 3000.0
      machine_max_acceleration_extruding:
      - 6000.0
      machine_max_acceleration_retracting:
      - 3000.0
      machine_max_acceleration_travel:
      - 6000.0
      machine_max_acceleration_x:
      - 6000.0
      machine_max_acceleration_y:
      - 6000.0
      machine_max_acceleration_z:
      - 400.0
      machine_max_jerk_e:
      - 33.33
      machine_max_jerk_x:
      - 12.0
      machine_max_jerk_y:
      - 12.0
      machine_max_jerk_z:
      - 1.2
      machine_max_junction_deviation:
      - 0.01
      machine_max_feedrate_e:
      - 60.0
      machine_max_feedrate_x:
      - 833.33
      machine_max_feedrate_y:
      - 1000.0
      machine_max_feedrate_z:
      - 30.0
      machine_min_extruding_rate:
      - 0.0
      machine_min_travel_rate:
      - 0.0
      pause_print_gcode: M226
      start_gcode: |-
        M140 P0 S{first_layer_bed_temperature[0]} ; set bed temp
        G10 P0 S{first_layer_temperature[0]}
        M568 P0 R{first_layer_temperature[0] + standby_temperature_delta} S{first_layer_temperature[0]} A2

        M83 ; use relative distances for extrusion
        G90 ; use absolute coordinates

        M98 P"0:/sys/meltingplot/print_start"
      parking_pos_retraction: 92
      bed_shape:
      - '0x0'
      - 880x0
      - 880x422
      - '0x422'
      max_print_height: 943
      printer_notes: ''
      between_objects_gcode: ''
      single_extruder_multi_material: false
      template_custom_gcode: ''
      use_firmware_retraction: true
      use_relative_e_distances: true
      z_offset: 0
      thumbnails: 48x48/PNG, 300x300/PNG
      custom_parameters_printer: '{"support_air_filtration": true}'
