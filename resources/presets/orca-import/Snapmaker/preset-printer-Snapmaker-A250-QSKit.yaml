kind: printer
id: 3hxIGJGXcFWtouoLOrWGjg
variants:
- condition: printer.model == "Snapmaker A250 QSKit"
  name: Snapmaker A250 QSKit
  id: g9Z/aJMUXuDEOE6mCAvWxg
  variants:
  - condition: tool.nozzle_diameter == 0.2
    id: EpTB7XwxB/E+4qjUGiLlnA
    values:
      bed_custom_model: ''
      bed_custom_texture: ''
      before_layer_gcode: |-
        ; layer_num: [layer_num]
        G92 E0
      toolchange_gcode: ''
      cooling_tube_length: 0
      cooling_tube_retraction: 0
      default_print: 0.14 Standard @Snapmaker (0.2 nozzle)
      remaining_times: true
      machine_limits_usage: emit_to_gcode
      extra_loading_move: -2
      extruder_clearance_height: 35
      extruder_clearance_radius: 75
      extruder_offset:
      - '0x0'
      gcode_flavor: marlin2
      high_current_on_filament_swap: false
      layer_gcode: ''
      end_gcode: |-
        G92 E0

        G0 Z{max_layer_z + 2.0} F600
        ; retract the filament to make it easier to replace
        G0 E-5 F200
        G28

          M104 S0
        M140 S0
        M107
        M220 S100
        M84

        ;
        ; DON'T REMOVE these lines if you're using the smfix (https://github.com/macdylan/SMFix)
        ; min_x = {first_layer_print_min[0]}
        ; min_y = {first_layer_print_min[1]}
        ; max_x = {first_layer_print_max[0]}
        ; max_y = {first_layer_print_max[1]}
        ; max_z = [max_layer_z]
        ; total_layer_number = [layer_num]
        ;
      machine_max_acceleration_e:
      - 3000.0
      machine_max_acceleration_extruding:
      - 1100.0
      machine_max_acceleration_retracting:
      - 1100.0
      machine_max_acceleration_travel:
      - 1100.0
      machine_max_acceleration_x:
      - 1100.0
      machine_max_acceleration_y:
      - 1000.0
      machine_max_acceleration_z:
      - 500.0
      machine_max_jerk_e:
      - 3.0
      machine_max_jerk_x:
      - 5.0
      machine_max_jerk_y:
      - 1.0
      machine_max_jerk_z:
      - 1.0
      machine_max_junction_deviation:
      - 0.01
      machine_max_feedrate_e:
      - 45.0
      machine_max_feedrate_x:
      - 150.0
      machine_max_feedrate_y:
      - 150.0
      machine_max_feedrate_z:
      - 40.0
      machine_min_extruding_rate:
      - 0.0
      - 0.0
      machine_min_travel_rate:
      - 0.0
      - 0.0
      pause_print_gcode: ''
      start_gcode: "; Model: Snapmaker A250\n; Update: 20240922\n; Maintained by https://github.com/macdylan/3dp-configs\n; Printer : [printer_settings_id]\n; Profile : [print_settings_id]\n; Plate   : [bed_name]\n\nT[initial_extruder]\n\nM140 S{first_layer_bed_temperature[initial_extruder]}\n\n; you can clean the nozzle\nM104 S165\nM204 S100\nG28\nG0 Z153 F960.0\nG0 Y125.0 F3420.0\nG0 X115.0\n\nM190 R{first_layer_bed_temperature[initial_extruder]}\n\nG28\n{if 0==1} ; boundary check(for dual/quick swap kit), not recommanded if there are any clamps \n  G0 X0\n  G0 Z0.2 F960.0\n  G0 Y0 F3420.0\n  G0 X230\n  G0 Y250\n  G0 X0\n  G0 Y0\n{endif}\n\nM83\n{if 1==1 && max(custom_parameter_filament_hot_plate_temp_initial_layer[initial_extruder], custom_parameter_filament_hot_plate_temp[initial_extruder]) >= 90}\nG0 Z0.06\nG92 Z0 ;reset z\n{endif}\n\n; flush initial nozzle\nT[initial_extruder]\nM104 S{max(250, min(290, first_layer_temperature[(initial_extruder % 2 == 0 ? min(initial_extruder + initial_extruder,\
        \ 63) : max(initial_extruder - (1-initial_extruder), 0))] + 15))}; common flush temp\nG0 Z1.6 F960.0\nG0 X{( initial_extruder % 2 == 0 ? 100.0 : 130.0 )} F3420.0\nG0 Y0 F3420.0\n\nM109 S{max(250, min(290, first_layer_temperature[(initial_extruder % 2 == 0 ? min(initial_extruder + initial_extruder, 63) : max(initial_extruder - (1-initial_extruder), 0))] + 15))} C2 W1\nG1 E15 F80.0\nG92 E0\n\nM106 S{min(255, (max_fan_speed[(initial_extruder % 2 == 0 ? min(initial_extruder + initial_extruder, 63) : max(initial_extruder - (1-initial_extruder), 0))] + 10) * 2.55)}\n\nM104 S{first_layer_temperature[(initial_extruder % 2 == 0 ? min(initial_extruder + initial_extruder, 63) : max(initial_extruder - (1-initial_extruder), 0))] + 5}\n\nG1 E9.0 F200\nG92 E0\nG1 E6.0 Z4.6 F200\nG92 E0\n\nG0 Z5.6 F200\nM107\n\nG0 X{( initial_extruder % 2 == 0 ? 55.0 : 175.0 )} F3420.0\nG0 Z0.3 F960.0\nM109 S{first_layer_temperature[(initial_extruder % 2 == 0 ? min(initial_extruder + initial_extruder, 63) : max(initial_extruder\
        \ - (1-initial_extruder), 0))]} C3 W1\nG1 E3 F200\nG92 E0\nG1 X{( initial_extruder % 2 == 0 ? 0 : 230 )} E3.42995 F3420.0\nG92 E0\n\nG1 E-{retract_length[initial_extruder]} F200\nG92 E0\nG0 Y20 F3420.0\n\n; ready [bed_name]"
      parking_pos_retraction: 0
      bed_shape:
      - '0x0'
      - 230x0
      - 230x250
      - '0x250'
      max_print_height: 215
      printer_notes: |
        PRINTER_MODEL_SNAPMAKER_A250
        PRINTER_MODEL_SNAPMAKER_A250_QUICKSWAPKIT
      between_objects_gcode: ''
      single_extruder_multi_material: false
      template_custom_gcode: ''
      use_firmware_retraction: false
      use_relative_e_distances: true
      z_offset: 0
      thumbnails: 300x150/PNG
      custom_parameters_printer: '{"support_air_filtration": true}'
