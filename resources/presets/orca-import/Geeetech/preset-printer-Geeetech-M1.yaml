kind: printer
id: k0YBvurLlGSvrkDF1yge+g
variants:
- condition: printer.model == "Geeetech M1"
  name: Geeetech M1
  id: HgrNtS5Es4B9s6V2/2F8SQ
  variants:
  - condition: tool.nozzle_diameter == 0.2
    id: +oni37njlqpFDHKFztVFqA
    values:
      bed_custom_model: ''
      bed_custom_texture: ''
      before_layer_gcode: G92 E0
      toolchange_gcode: ''
      cooling_tube_length: 5
      cooling_tube_retraction: 91.5
      default_print: 0.10mm Standard @Geeetech M1 0.2 nozzle
      remaining_times: true
      machine_limits_usage: emit_to_gcode
      extra_loading_move: -2
      extruder_clearance_height: 34
      extruder_clearance_radius: 47
      extruder_offset:
      - '0x0'
      gcode_flavor: marlin
      high_current_on_filament_swap: false
      layer_gcode: |-
        ;------------------------------------
        ;layer No: [layer_num] ———>Print Height: [layer_z] mm
        ;------------------------------------
      end_gcode: |-
        {if max_layer_z < max_print_height}G1 Z{z_offset+min(max_layer_z+2, max_print_height)} F600 ; Move print head up{endif}
        G1 X5 Y{print_bed_max[1]*0.8} F{travel_speed*60} ; present print
        {if max_layer_z < max_print_height-10}G1 Z{z_offset+min(max_layer_z+70, max_print_height-10)} F600 ; Move print head further up{endif}
        {if max_layer_z < max_print_height*0.6}G1 Z{max_print_height*0.6} F600 ; Move print head further up{endif}
        M140 S0 ; turn off heatbed
        M104 S0 ; turn off temperature
        M107 ; turn off fan
        M84 X Y E ; disable motors
        M221 S100;Slicer Flow recovery 100%
        M220 S100 ;Set Feedrate recovery 100%
        M204 P3000.00 R3000.00 T3000.00
      machine_max_acceleration_e:
      - 3000.0
      - 3000.0
      machine_max_acceleration_extruding:
      - 3000.0
      - 3000.0
      machine_max_acceleration_retracting:
      - 3000.0
      - 3000.0
      machine_max_acceleration_travel:
      - 3000.0
      - 3000.0
      machine_max_acceleration_x:
      - 3000.0
      - 3000.0
      machine_max_acceleration_y:
      - 3000.0
      - 3000.0
      machine_max_acceleration_z:
      - 500.0
      - 500.0
      machine_max_jerk_e:
      - 10.0
      - 10.0
      machine_max_jerk_x:
      - 10.0
      - 10.0
      machine_max_jerk_y:
      - 10.0
      - 10.0
      machine_max_jerk_z:
      - 3.0
      - 3.0
      machine_max_junction_deviation:
      - 0.01
      machine_max_feedrate_e:
      - 60.0
      - 60.0
      machine_max_feedrate_x:
      - 300.0
      - 300.0
      machine_max_feedrate_y:
      - 300.0
      - 300.0
      machine_max_feedrate_z:
      - 25.0
      - 25.0
      machine_min_extruding_rate:
      - 0.0
      - 0.0
      machine_min_travel_rate:
      - 0.0
      - 0.0
      pause_print_gcode: M25 ;pause print
      start_gcode: ";Geeetech M1 official wiki URL: https://www.geeetech.com/wiki/index.php/Geeetech_M1_3D_printer \nM104 S[first_layer_temperature] ; Set Hotend Temperature\nM140 S[first_layer_bed_temperature] ; set Bed Temperature\nM190 S[first_layer_bed_temperature] ; Wait for Bed Temperature\nM109 S[first_layer_temperature] ; wait for Hotend Temperature\nM220 S100 ;Reset Feedrate\nM221 S100 ;Reset Flowrate\nG92 E0 ; Reset Extruder\nG28 ; Home all axes\nM107 ;Off Main Fan\nM300 S2500 P1000 ;Play a short tune\nG1 Z0.28 ;Move Z Axis up little to prevent scratching of Heat Bed\nG92 E0 ;Reset Extruder\nG1 Y3 F2400 ;Move to start position\nG1 X75 E40 F500 ;Draw a filament line\nG92 E0 ;Reset Extruder\n;G1 E-0.2 F3000 ;Retract a little\nG1 Z2.0 F3000 ;Move Z Axis up little to prevent scratching of Heat Bed\nG1 X70 Y3 Z0.27 F3000 ;Quickly wipe away from the filament line\nG92 E0 ;Reset Extruder"
      parking_pos_retraction: 92
      bed_shape:
      - '0x0'
      - 105x0
      - 105x105
      - '0x105'
      max_print_height: 95
      printer_notes: ''
      between_objects_gcode: ''
      single_extruder_multi_material: true
      template_custom_gcode: ''
      use_firmware_retraction: false
      use_relative_e_distances: true
      z_offset: 0
      thumbnails: 48x48/PNG, 300x300/PNG
      custom_parameters_printer: '{"support_air_filtration": true}'
