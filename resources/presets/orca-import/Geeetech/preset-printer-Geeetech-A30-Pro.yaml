kind: printer
id: tmvGFA0AAG6oh2g1Or7T9g
variants:
- condition: printer.model == "Geeetech A30 Pro"
  name: Geeetech A30 Pro
  id: kIETqsDs+R7H3MZdPk8GdA
  variants:
  - condition: tool.nozzle_diameter == 0.2
    id: xihyEcMW2J9uxpWl73/eHQ
    values:
      bed_custom_model: ''
      bed_custom_texture: ''
      before_layer_gcode: G92 E0
      toolchange_gcode: ''
      cooling_tube_length: 5
      cooling_tube_retraction: 91.5
      default_print: 0.10mm Standard @Geeetech common 0.2 nozzle
      remaining_times: true
      machine_limits_usage: emit_to_gcode
      extra_loading_move: -2
      extruder_clearance_height: 34
      extruder_clearance_radius: 47
      extruder_offset:
      - '0x0'
      gcode_flavor: marlin
      high_current_on_filament_swap: false
      layer_gcode: |-
        ;------------------------------------
        ;layer No: [layer_num] ———>Print Height: [layer_z] mm
        ;------------------------------------
      end_gcode: |-
        G1 E-2.5 F2100 ; Retract filament
        G92 E0.0
        G1{if max_layer_z < max_print_height} Z{z_offset+min(max_layer_z+30, max_print_height+0.2)}{endif} E-1.5 F720 ; Retract and raise Z
        G4 ; wait
        M104 S0 ; Cooldown hotend
        M140 S0 ; Cooldown bed
        M107 ; off fan
        G1 X0 Y100 F3000 ; park print head
        M84 ; disable motors
      machine_max_acceleration_e:
      - 5000.0
      - 5000.0
      machine_max_acceleration_extruding:
      - 1000.0
      - 1000.0
      machine_max_acceleration_retracting:
      - 1000.0
      - 1000.0
      machine_max_acceleration_travel:
      - 500.0
      - 500.0
      machine_max_acceleration_x:
      - 500.0
      - 500.0
      machine_max_acceleration_y:
      - 500.0
      - 500.0
      machine_max_acceleration_z:
      - 500.0
      - 500.0
      machine_max_jerk_e:
      - 5.0
      - 5.0
      machine_max_jerk_x:
      - 8.0
      - 8.0
      machine_max_jerk_y:
      - 8.0
      - 8.0
      machine_max_jerk_z:
      - 0.4
      - 0.4
      machine_max_junction_deviation:
      - 0.01
      machine_max_feedrate_e:
      - 60.0
      - 60.0
      machine_max_feedrate_x:
      - 200.0
      - 200.0
      machine_max_feedrate_y:
      - 200.0
      - 200.0
      machine_max_feedrate_z:
      - 10.0
      - 10.0
      machine_min_extruding_rate:
      - 0.0
      - 0.0
      machine_min_travel_rate:
      - 0.0
      - 0.0
      pause_print_gcode: M25 ;pause print
      start_gcode: ";Geeetech official wiki homepage for A30: https://www.geeetech.com/wiki/index.php/Geeetech_A30_3D_Printer \nM104 S[first_layer_temperature] ; set extruder temp\nM140 S[first_layer_bed_temperature] ; set bed temp\nM190 S[first_layer_bed_temperature] ; wait for bed temp\nM109 S[first_layer_temperature] ; wait for extruder temp\nM220 S100 ;Reset Feedrate\nM221 S100 ;Reset Flowrate\nG92 E0 ; Reset Extruder\nG28 ; Home all axes\nM107 ;Off Fan\nG1 Z5.0 F3000 ;Move Z Axis up little to prevent scratching of Heat Bed\nG1 X0.1 Y20 Z1.4 F6000 ; Move to start position\nG1 X0.1 Y80.0 Z1.4 F1000 E25 ; Draw the first line\nG92 E0 ; Reset Extruder\nG1 X0.4 Y80.0 Z1.4 F6000 ; Move to side a little\nG1 X1.4 Y20 Z1.4 F1000 E20 ; Draw the second line\nG92 E0 ; Reset Extruder\nG1 Z2.0 F3000 ; Move Z Axis up little to prevent scratching of Heat Bed\nG1 X5 Y20 Z0.28 F3000.0 ; Move over to prevent blob squish\nG92 E0"
      parking_pos_retraction: 92
      bed_shape:
      - '0x0'
      - 320x0
      - 320x320
      - '0x320'
      max_print_height: 420
      printer_notes: ''
      between_objects_gcode: ''
      single_extruder_multi_material: true
      template_custom_gcode: ''
      use_firmware_retraction: false
      use_relative_e_distances: true
      z_offset: 0
      thumbnails: 48x48/PNG, 300x300/PNG
      custom_parameters_printer: '{"support_air_filtration": true}'
