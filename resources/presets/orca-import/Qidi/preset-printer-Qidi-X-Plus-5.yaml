variants:
- condition: printer.model == "Qidi X-Plus 5"
  name: Qidi X-Plus 5
  id: GmYg8Yx2dcDWKfHXIKVCuQ
  variants:
  - condition: tool.nozzle_diameter == 0.2
    id: sl8DLBYMrEs9tC0rNOOKLQ
    values:
      bed_custom_model: ''
      bed_custom_texture: ''
      before_layer_gcode: ''
      toolchange_gcode: |-
        {local long_retractions_when_cut = (custom_parameter_printer_long_retractions_when_cut__0, custom_parameter_printer_long_retractions_when_cut__1)}{local retraction_distances_when_cut = (custom_parameter_printer_retraction_distances_when_cut__0, custom_parameter_printer_retraction_distances_when_cut__1)}{if current_extruder != next_extruder}
        {if max_layer_z + 3 > max_print_height}
        G0 Z{max_print_height} F1200
        {else}
        G0 Z{max_layer_z + 3} F1200
        {endif}
        TOOL_CHANGE_START F=[current_extruder] T=[next_extruder]
        DISABLE_ALL_SENSOR
        M104 S{old_filament_temp - 10}
        M106 S255
        {if long_retractions_when_cut[previous_extruder]}
        G1 E-{retraction_distances_when_cut[previous_extruder]} F{old_filament_e_feedrate}
        {else}
        G1 E-5 F{old_filament_e_feedrate}
        {endif}
        M400
        CUT_FILAMENT T=[current_extruder]
        MOVE_TO_TRASH
        M106 P2 S0
        UNLOAD_T[current_extruder]
        T[next_extruder]
        M106 S0
        {if custom_parameter_filament_nozzle_temperature_range_high[current_extruder] >= custom_parameter_filament_nozzle_temperature_range_high[next_extruder]}
        M104 S{custom_parameter_filament_nozzle_temperature_range_high[current_extruder]}
        M109.0 S{(custom_parameter_filament_nozzle_temperature_range_high[current_extruder])-25}
        {else}
        M104 S{custom_parameter_filament_nozzle_temperature_range_high[next_extruder]}
        M109.0 S{(custom_parameter_filament_nozzle_temperature_range_high[next_extruder])-25}
        {endif}
        {if long_retractions_when_cut[previous_extruder]}
        G1 E{retraction_distances_when_cut[previous_extruder]} F{old_filament_e_feedrate}
        {endif}
        {if flush_length_1 > 1}
        ; FLUSH_START
        G1 E{flush_length_1} F{old_filament_e_feedrate * 0.5}
        ; FLUSH_END
        {endif}
        {if flush_length_2 > 1}
        ; FLUSH_START
        G1 E{flush_length_2} F{new_filament_e_feedrate * 0.5}
        ; FLUSH_END
        {endif}
        {if flush_length_3 > 1}
        ; FLUSH_START
        G1 E{flush_length_3} F{new_filament_e_feedrate * 0.5}
        ; FLUSH_END
        {endif}
        {if flush_length_4 > 1}
        ; FLUSH_START
        G1 E{flush_length_4} F{new_filament_e_feedrate * 0.5}
        ; FLUSH_END
        {endif}
        M400
        M106 S180
        M104 S{new_filament_temp - 10}
        G1 E1 F10
        M109.1 S{new_filament_temp - 10}
        G1 E-4 F1000
        G4 P2000
        M204 S5000
        G1 X109 F8000
        G1 X95 F5000
        G1 X109 F8000
        G1 X95 F5000
        G1 X140 F10000
        G1 Y319
        G1 X110
        G4 P2000
        G1 Y339 F2000
        G1 X123 F6000
        G1 X110
        G1 X123
        G1 X110
        G1 X123
        G1 X110
        G1 X123
        G1 X95
        G1 Y319 F10000
        M104 S[new_filament_temp]
        TOOL_CHANGE_END
        G1 E{new_retract_length_toolchange} F{new_filament_e_feedrate}
        ENABLE_ALL_SENSOR
        {endif}
      cooling_tube_length: 5
      cooling_tube_retraction: 91.5
      default_print: 0.10mm Standard @X-Plus 5 0.2 nozzle
      remaining_times: true
      machine_limits_usage: time_estimate_only
      extra_loading_move: -2
      extruder_clearance_height: 42
      extruder_clearance_radius: 75
      extruder_offset:
      - '0x0'
      gcode_flavor: klipper
      high_current_on_filament_swap: false
      layer_gcode: |-
        {if custom_parameter_print_timelapse_type == 1} ; timelapse with wipe tower
        G92 E0
        G1 E-[retract_length] F1800
        {if layer_z + 0.4 > max_print_height}
        G2 Z{max_print_height} I0.86 J0.86 P1 F20000 ; spiral lift a little
        {else}
        G2 Z{layer_z + 0.4} I0.86 J0.86 P1 F20000 ; spiral lift a little
        {endif}
        MOVE_TO_TRASH
        {if layer_z <=25}
        G1 Z25
        {endif}
        G92 E0
        M400
        TIMELAPSE_TAKE_FRAME
        G1 E[retract_length] F300
        G1 X140 F8000
        G1 Y319
        {if layer_z <=25}
        G1 Z[layer_z]
        {endif}
        {elsif custom_parameter_print_timelapse_type == 0} ; timelapse without wipe tower
        TIMELAPSE_TAKE_FRAME
        {endif}
        G92 E0
        SET_PRINT_STATS_INFO CURRENT_LAYER={layer_num + 1}
      end_gcode: |-
        SET_PRINT_MAIN_STATUS MAIN_STATUS=print_end
        DISABLE_BOX_HEATER
        M141 S0
        M140 S0
        DISABLE_ALL_SENSOR
        G1 E-3 F1800
        {if max_layer_z + 3 > max_print_height}
        G0 Z{max_print_height} F600
        {else}
        G0 Z{max_layer_z + 3} F600
        {endif}
        UNLOAD_FILAMENT T=[current_extruder]
        G0 Y320 F12000
        G0 X105 Y320 F12000
        {if max_layer_z < max_print_height / 2}G1 Z{max_print_height / 2 + 10} F600{else}G1 Z{min(max_print_height, max_layer_z + 3)}{endif}
        M104 S0
        PRINT_END
      machine_max_acceleration_e:
      - 5000.0
      machine_max_acceleration_extruding:
      - 20000.0
      - 20000.0
      machine_max_acceleration_retracting:
      - 5000.0
      - 5000.0
      machine_max_acceleration_travel:
      - 9000.0
      - 9000.0
      machine_max_acceleration_x:
      - 20000.0
      - 20000.0
      machine_max_acceleration_y:
      - 20000.0
      - 20000.0
      machine_max_acceleration_z:
      - 500.0
      machine_max_jerk_e:
      - 4.0
      - 4.0
      machine_max_jerk_x:
      - 9.0
      - 9.0
      machine_max_jerk_y:
      - 9.0
      - 9.0
      machine_max_jerk_z:
      - 4.0
      - 4.0
      machine_max_junction_deviation:
      - 0.01
      machine_max_feedrate_e:
      - 30.0
      machine_max_feedrate_x:
      - 600.0
      - 600.0
      machine_max_feedrate_y:
      - 600.0
      - 600.0
      machine_max_feedrate_z:
      - 20.0
