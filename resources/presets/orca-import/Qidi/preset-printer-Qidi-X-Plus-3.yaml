kind: printer
id: zE55R4NtP0waCIITPwefRg
variants:
- condition: printer.model == "Qidi X-Plus 3"
  name: Qidi X-Plus 3
  id: TfdZam+gy1HWwtXUnAxo6Q
  variants:
  - condition: tool.nozzle_diameter == 0.2
    id: tFOTR6l4utYsQ7J+SSq2WQ
    values:
      bed_custom_model: ''
      bed_custom_texture: ''
      before_layer_gcode: |
        ;BEFORE_LAYER_CHANGE
        ;[layer_z]
        G92 E0
      toolchange_gcode: ''
      cooling_tube_length: 5
      cooling_tube_retraction: 91.5
      default_print: 0.10mm Standard @Qidi XPlus3 0.2 nozzle
      remaining_times: true
      machine_limits_usage: time_estimate_only
      extra_loading_move: -2
      extruder_clearance_height: 36
      extruder_clearance_radius: 65
      extruder_offset:
      - '0x0'
      gcode_flavor: klipper
      high_current_on_filament_swap: false
      layer_gcode: ''
      end_gcode: |-
        M141 S0
        M104 S0
        M140 S0
        G1 E-3 F1800
        G0 Z{min(max_print_height, max_layer_z + 3)} F600
        G0 X0 Y0 F12000
        {if max_layer_z < max_print_height / 2}G1 Z{max_print_height / 2 + 10} F600{else}G1 Z{min(max_print_height, max_layer_z + 3)}{endif}
      machine_max_acceleration_e:
      - 5000.0
      machine_max_acceleration_extruding:
      - 20000.0
      machine_max_acceleration_retracting:
      - 5000.0
      machine_max_acceleration_travel:
      - 0.0
      - 0.0
      machine_max_acceleration_x:
      - 20000.0
      machine_max_acceleration_y:
      - 20000.0
      machine_max_acceleration_z:
      - 500.0
      machine_max_jerk_e:
      - 2.0
      machine_max_jerk_x:
      - 9.0
      machine_max_jerk_y:
      - 9.0
      machine_max_jerk_z:
      - 3.0
      machine_max_junction_deviation:
      - 0.01
      machine_max_feedrate_e:
      - 30.0
      machine_max_feedrate_x:
      - 600.0
      machine_max_feedrate_y:
      - 600.0
      machine_max_feedrate_z:
      - 10.0
      machine_min_extruding_rate:
      - 0.0
      machine_min_travel_rate:
      - 0.0
      pause_print_gcode: PAUSE
      start_gcode: |
        {local overall_chamber_temperature = 0}{if is_extruder_used[0]}{overall_chamber_temperature = max(overall_chamber_temperature, chamber_temperature[0])}{endif}PRINT_START
        G28
        M141 S0
        G0 Z50 F600
        M190 S[first_layer_bed_temperature[initial_extruder]]
        G28 Z
        G29; mesh bed leveling ,comment this code to close it
        G0 X0 Y0 Z50 F6000
        M141 S{overall_chamber_temperature}
        M109 S[first_layer_temperature]
        M106 P3 S255
        M83
        G4 P3000
        G0 X{max((min(print_bed_max[0], first_layer_print_min[0] + 80) - 85),0)} Y{max((min(print_bed_max[1], first_layer_print_min[1] + 80) - 85),0)} Z5 F6000
        G0 Z[first_layer_height] F600
        G1 E3 F1800
        G1 X{(min(print_bed_max[0], first_layer_print_min[0] + 80))} E{85 * 0.5 * first_layer_height * nozzle_diameter[0]} F3000
        G1 Y{max((min(print_bed_max[1], first_layer_print_min[1] + 80) - 85),0) + 2} E{2 * 0.5 * first_layer_height * nozzle_diameter[0]} F3000
        G1 X{max((min(print_bed_max[0], first_layer_print_min[0] + 80) - 85),0)} E{85 * 0.5 * first_layer_height * nozzle_diameter[0]} F3000
        G1 Y{max((min(print_bed_max[1], first_layer_print_min[1] + 80) - 85),0) + 85} E{83 * 0.5 * first_layer_height * nozzle_diameter[0]} F3000
        G1 X{max((min(print_bed_max[0], first_layer_print_min[0] + 80) - 85),0) + 2} E{2 * 0.5 * first_layer_height * nozzle_diameter[0]} F3000
        G1 Y{max((min(print_bed_max[1], first_layer_print_min[1] + 80) - 85),0) + 3} E{82 * 0.5 * first_layer_height * nozzle_diameter[0]} F3000
        G1 X{max((min(print_bed_max[0], first_layer_print_min[0] + 80) - 85),0) + 12} E{-10 * 0.5 * first_layer_height * nozzle_diameter[0]} F3000
        G1 E{10 * 0.5 * first_layer_height * nozzle_diameter[0]} F3000
      parking_pos_retraction: 92
      bed_shape:
      - '0x0'
      - 280x0
      - 280x280
      - '0x280'
      max_print_height: 270
      printer_notes: ''
      between_objects_gcode: ''
      single_extruder_multi_material: true
      template_custom_gcode: ''
      use_firmware_retraction: false
      use_relative_e_distances: true
      z_offset: 0
      thumbnails: 110x110/PNG
      custom_parameters_printer: '{"long_retractions_when_cut__0": false, "long_retractions_when_cut__1": false, "retraction_distances_when_cut__0": 18.0, "retraction_distances_when_cut__1": 18.0, "support_air_filtration": true}'
