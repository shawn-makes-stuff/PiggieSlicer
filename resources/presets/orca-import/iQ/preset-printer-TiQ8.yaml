kind: printer
id: mxaViDOIeeZkccbEqK7v1g
variants:
- condition: printer.model == "TiQ8"
  name: TiQ8
  id: ocaQ9i2Jy+K14E3PmsHIiA
  variants:
  - condition: tool.nozzle_diameter == 0.25 and printer.tool_count == 2
    id: pkX3Hjtef6EVE21p28rX9A
    values:
      bed_custom_model: ''
      bed_custom_texture: ''
      before_layer_gcode: |
        ;BEFORE_LAYER_CHANGE
        ;[layer_z]
        G92 E0
      toolchange_gcode: |-
        G1 Z{layer_z+2} F900 ; safe distance while tool change
        {if next_extruder==0}G1 X30 Y-12 F9000{endif}
        M109 S{temperature[next_extruder]} T[next_extruder] ; set new tool temperature so it can start heating while changing
      cooling_tube_length: 5
      cooling_tube_retraction: 91.5
      default_print: 0.15mm Standard @iQ TiQ8 (0.25 Nozzle)
      remaining_times: false
      machine_limits_usage: time_estimate_only
      extra_loading_move: -2
      extruder_clearance_height: 36
      extruder_clearance_radius: 65
      extruder_offset:
      - '0x0'
      - '0x0'
      gcode_flavor: marlin
      high_current_on_filament_swap: false
      layer_gcode: |-
        ;AFTER_LAYER_CHANGE
        ;[layer_z]
      end_gcode: |
        G1 X10 F3000 ; home X axis
        G1 Y10 F3000 ; home Y axis
        M104 S0 T0 ; turn off extruder
        M104 S0 T1 ; turn off extruder
        M104 S0 T2 ; turn off extruder
        M140 S0 ; turn off bed
        {if first_layer_temperature[current_extruder]>350}M140 S80{endif} ; Keep bed hot for easy part removal from PEI sheet
        M106 S0 ; turn off fan
        M806 S0 ; turn of housing fan
        M84 ; disable motor
      machine_max_acceleration_e:
      - 5000.0
      - 5000.0
      machine_max_acceleration_extruding:
      - 20000.0
      - 20000.0
      machine_max_acceleration_retracting:
      - 5000.0
      - 5000.0
      machine_max_acceleration_travel:
      - 20000.0
      - 20000.0
      machine_max_acceleration_x:
      - 1500.0
      - 1500.0
      - 1500.0
      - 1500.0
      machine_max_acceleration_y:
      - 1500.0
      - 1500.0
      - 1500.0
      - 1500.0
      machine_max_acceleration_z:
      - 500.0
      - 200.0
      machine_max_jerk_e:
      - 2.5
      - 2.5
      machine_max_jerk_x:
      - 9.0
      - 9.0
      machine_max_jerk_y:
      - 9.0
      - 9.0
      machine_max_jerk_z:
      - 0.2
      - 0.4
      machine_max_junction_deviation:
      - 0.01
      machine_max_feedrate_e:
      - 25.0
      - 25.0
      machine_max_feedrate_x:
      - 500.0
      - 500.0
      machine_max_feedrate_y:
      - 500.0
      - 500.0
      machine_max_feedrate_z:
      - 15.0
      - 12.0
      - 15.0
      - 12.0
      machine_min_extruding_rate:
      - 0.0
      - 0.0
      machine_min_travel_rate:
      - 0.0
      - 0.0
      pause_print_gcode: M10710 S0
      start_gcode: |
        T[initial_extruder]
        M109 S{first_layer_temperature[current_extruder]}
      parking_pos_retraction: 92
      bed_shape:
      - '0x0'
      - 500x0
      - 500x400
      - '0x400'
      max_print_height: 450
      printer_notes: Machine file version 1.0 20251106
      between_objects_gcode: ''
      single_extruder_multi_material: false
      template_custom_gcode: ''
      use_firmware_retraction: false
      use_relative_e_distances: true
      z_offset: 0
      custom_parameters_printer: '{"support_air_filtration": true}'
