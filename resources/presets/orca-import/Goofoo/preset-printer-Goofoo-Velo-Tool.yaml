kind: printer
id: TuieZ3eY3HTGjXA5HAqh3A
variants:
- condition: printer.model == "Goofoo Velo+ Tool"
  name: Goofoo Velo+ Tool
  id: o1FspuHU6ZnIl5OFH1crAg
  variants:
  - condition: tool.nozzle_diameter == 0.4 and printer.tool_count == 2
    id: KLgwtEMJS1gjUKJgNB6QeQ
    values:
      bed_custom_model: ''
      bed_custom_texture: ''
      before_layer_gcode: |-
        ;BEFORE_LAYER_CHANGE
        ;[layer_z]
        G92 E0
      toolchange_gcode: |
        T[next_extruder]
        ；M104 S[first_layer_temperature] T[next_extruder]; 正式设置喷嘴温度（与切片设置一致）
        ；M109 S[first_layer_temperature] T[next_extruder] ; 等待喷嘴温度稳定
      cooling_tube_length: 5
      cooling_tube_retraction: 91.5
      default_print: 0.20mm Standard @Goofoo Velo+
      remaining_times: true
      machine_limits_usage: time_estimate_only
      extra_loading_move: -2
      extruder_clearance_height: 60
      extruder_clearance_radius: 50
      extruder_offset:
      - '0x0'
      - '0x0'
      gcode_flavor: klipper
      high_current_on_filament_swap: false
      layer_gcode: |-
        ;AFTER_LAYER_CHANGE
        ;[layer_z]
      end_gcode: |-
        {if max_layer_z < max_print_height}G1 Z{z_offset+min(max_layer_z+2, max_print_height)} F600 ; Move print head up{endif}
        T0
        G1 X5 Y{print_bed_max[1]*0.8} F{travel_speed*60} ; present print
        {if max_layer_z < max_print_height-10}G1 Z{z_offset+min(max_layer_z+70, max_print_height-10)} F600 ; Move print head further up{endif}
        {if max_layer_z < max_print_height*0.6}G1 Z{max_print_height*0.6} F600 ; Move print head further up{endif}
        M140 S0 ; turn off heatbed
        M104 S0 ; turn off temperature
        M107 ; turn off fan
        M84 X Y E ; disable motors
      machine_max_acceleration_e:
      - 20000.0
      - 5000.0
      machine_max_acceleration_extruding:
      - 10000.0
      machine_max_acceleration_retracting:
      - 15000.0
      - 5000.0
      machine_max_acceleration_travel:
      - 10000.0
      - 10000.0
      machine_max_acceleration_x:
      - 10000.0
      machine_max_acceleration_y:
      - 10000.0
      machine_max_acceleration_z:
      - 100.0
      - 200.0
      machine_max_jerk_e:
      - 1.0
      - 2.5
      machine_max_jerk_x:
      - 5.0
      - 9.0
      machine_max_jerk_y:
      - 5.0
      - 9.0
      machine_max_jerk_z:
      - 0.4
      machine_max_junction_deviation:
      - 0.01
      machine_max_feedrate_e:
      - 50.0
      - 25.0
      machine_max_feedrate_x:
      - 730.0
      - 200.0
      machine_max_feedrate_y:
      - 730.0
      - 200.0
      machine_max_feedrate_z:
      - 15.0
      - 12.0
      machine_min_extruding_rate:
      - 0.0
      machine_min_travel_rate:
      - 0.0
      pause_print_gcode: PAUSE
      start_gcode: |-
        G90 ; 绝对坐标模式
        M83 ; 挤出机相对模式
        M140 S[first_layer_bed_temperature] ; 设置热床温度
        M104 S140 T0 ; 临时喷嘴温度=切片首层设定（防止归零渗料）
        M104 S140 T1
        G4 S10 ; 预热等待10秒
        G28 ; 归零所有轴
        G1 Z50 F240 ; Z轴抬升
        G1 X2 Y10 F3000 ; 移动至起始位置
        M104 S[first_layer_temperature] T0 ; 正式设置喷嘴温度（与切片设置一致）
        M104 S[first_layer_temperature] T1 ; 正式设置喷嘴温度（与切片设置一致）
        M190 S[first_layer_bed_temperature[initial_extruder]]  T0; 等待热床温度稳定
        M109 S[first_layer_temperature] T0 ; 等待喷嘴温度稳定
        G1 Z0.28 F240 ; 喷嘴下降至打印高度
        G92 E0 ; 挤出机归零
        G1 Y140 E10 F1500 ; 画第一条 priming 线
        G1 X2.3 F5000 ; X轴微调
        G92 E0 ; 挤出机归零
        G1 Y10 E10 F1200 ; 画第二条 priming 线
        G92 E0 ; 最终挤出机归零
        G1 Z20 F240 ; Z轴抬升
        G1 X280 Y10 F3000 ; 移动至起始位置
        T1
        M104 S[first_layer_temperature] T1 ; 正式设置喷嘴温度（与切片设置一致）
        M190 S[first_layer_bed_temperature[initial_extruder]]  T1; 等待热床温度稳定
        M109 S[first_layer_temperature]  T1; 等待喷嘴温度稳定
        G4 S10 ; 预热等待10秒
        G1 Z0.28 F240 ; 喷嘴下降至打印高度
        G92 E0 ; 挤出机归零
        G1 Y140 E10 F1500 ; 画第一条 priming 线
        G1 X282.3 F5000 ; X轴微调
        G92 E0 ; 挤出机归零
        G1 Y10 E10 F1200 ; 画第二条 priming 线
        G92 E0 ; 最终挤出机归零
      parking_pos_retraction: 92
      bed_shape:
      - '0x0'
      - 300x0
      - 300x300
      - '0x300'
      max_print_height: 600
      printer_notes: ''
      between_objects_gcode: ''
      single_extruder_multi_material: false
      template_custom_gcode: ''
      use_firmware_retraction: false
      use_relative_e_distances: true
      z_offset: 0
      thumbnails: 300x300/PNG
      custom_parameters_printer: '{"support_air_filtration": true}'
