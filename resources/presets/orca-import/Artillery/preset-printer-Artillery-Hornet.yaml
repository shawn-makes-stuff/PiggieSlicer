kind: printer
id: fbFHCdaLPE78Xh4rvSHoJA
variants:
- condition: printer.model == "Artillery Hornet"
  name: Artillery Hornet
  id: U/eeu7Lr5Sc16xk7KVMObA
  variants:
  - condition: tool.nozzle_diameter == 0.4
    id: O3Ewhp6lSLoGRK+J3YdSrg
    values:
      bed_custom_model: ''
      bed_custom_texture: ''
      before_layer_gcode: |+
        ;BEFORE_LAYER_CHANGE
        G92 E0
        ;[layer_z]

      toolchange_gcode: ''
      cooling_tube_length: 5
      cooling_tube_retraction: 91.5
      default_print: 0.20mm Standard @Artillery Hornet
      remaining_times: true
      machine_limits_usage: emit_to_gcode
      extra_loading_move: -2
      extruder_clearance_height: 36
      extruder_clearance_radius: 65
      extruder_offset:
      - '0x0'
      gcode_flavor: marlin
      high_current_on_filament_swap: false
      layer_gcode: |-
        ;AFTER_LAYER_CHANGE
        ;[layer_z]
      end_gcode: |-
        {if max_layer_z < max_print_height}G1 Z{z_offset+min(max_layer_z+2, max_print_height)} F600 ; Move print head up{endif}
        G1 X5 Y{print_bed_max[1]*0.85} F{travel_speed*60} ; present print
        {if max_layer_z < max_print_height-10}G1 Z{z_offset+min(max_layer_z+70, max_print_height-10)} F600 ; Move print head further up{endif}
        {if max_layer_z < max_print_height*0.6}G1 Z{max_print_height*0.6} F600 ; Move print head further up{endif}
        M140 S0 ; turn off heatbed
        M104 S0 ; turn off temperature
        M107 ; turn off fan
        M84 X Y E ; disable motors
      machine_max_acceleration_e:
      - 5000.0
      - 5000.0
      machine_max_acceleration_extruding:
      - 1000.0
      - 1250.0
      machine_max_acceleration_retracting:
      - 1000.0
      - 1250.0
      machine_max_acceleration_travel:
      - 1000.0
      - 1250.0
      machine_max_acceleration_x:
      - 2000.0
      - 1000.0
      machine_max_acceleration_y:
      - 2000.0
      - 1000.0
      machine_max_acceleration_z:
      - 500.0
      - 200.0
      machine_max_jerk_e:
      - 3.0
      - 2.5
      machine_max_jerk_x:
      - 7.0
      - 10.0
      machine_max_jerk_y:
      - 7.0
      - 10.0
      machine_max_jerk_z:
      - 0.2
      - 0.4
      machine_max_junction_deviation:
      - 0.032
      - 0.0
      machine_max_feedrate_e:
      - 120.0
      - 120.0
      machine_max_feedrate_x:
      - 500.0
      - 200.0
      machine_max_feedrate_y:
      - 500.0
      - 200.0
      machine_max_feedrate_z:
      - 12.0
      - 12.0
      machine_min_extruding_rate:
      - 0.0
      - 0.0
      machine_min_travel_rate:
      - 0.0
      - 0.0
      pause_print_gcode: M0
      start_gcode: |-
        G90 ; use absolute coordinates
        M83 ; extruder relative mode
        M104 S150 ; set temporary nozzle temp to prevent oozing during homing and auto bed leveling
        M140 S{custom_parameter_filament_hot_plate_temp_initial_layer[0]} ; set final bed temp
        G4 S30 ; allow partial nozzle warmup
        G28 ; home all axis
        G29 ; auto bed levelling
        G1 Z50 F240
        G1 X2.0 Y10 F3000
        M104 S{first_layer_temperature[0]} ; set final nozzle temp
        M190 S{custom_parameter_filament_hot_plate_temp_initial_layer[0]} ; wait for bed temp to stabilize
        M109 S{first_layer_temperature[0]} ; wait for nozzle temp to stabilize
        G1 Z0.28 F240
        G92 E0
        G1 X2.0 Y140 E10 F1500 ; prime the nozzle
        G1 X2.3 Y140 F5000
        G92 E0
        G1 X2.3 Y10 E10 F1200 ; prime the nozzle
        G92 E0
      parking_pos_retraction: 92
      bed_shape:
      - '0x0'
      - 230x0
      - 230x230
      - '0x230'
      max_print_height: 250
      printer_notes: ''
      between_objects_gcode: ''
      single_extruder_multi_material: true
      template_custom_gcode: ''
      use_firmware_retraction: false
      use_relative_e_distances: true
      z_offset: 0
      thumbnails: 48x48/PNG, 300x300/PNG
      custom_parameters_printer: '{"support_air_filtration": true}'
