kind: printer
id: XvPUXidJL0hFGgiHNb8zBw
variants:
- condition: printer.model == "Artillery Genius Pro"
  name: Artillery Genius Pro
  id: 4Qj+kj8ojYaaYbratjpksg
  variants:
  - condition: tool.nozzle_diameter == 0.4
    id: QZK63ycklGJEDw7rhVVnJg
    values:
      bed_custom_model: ''
      bed_custom_texture: ''
      before_layer_gcode: |
        ;BEFORE_LAYER_CHANGE
        ;[layer_z]
        G92 E0
      toolchange_gcode: ''
      cooling_tube_length: 5
      cooling_tube_retraction: 91.5
      default_print: 0.20mm Standard @Artillery Genius Pro
      remaining_times: true
      machine_limits_usage: emit_to_gcode
      extra_loading_move: -2
      extruder_clearance_height: 36
      extruder_clearance_radius: 65
      extruder_offset:
      - '0x0'
      gcode_flavor: marlin
      high_current_on_filament_swap: false
      layer_gcode: ''
      end_gcode: |-
        G91; Relative positionning
        G1 E-2 Z0.2 F2400; Retract and raise Z
        G1 X5 Y5 F3000; Wipe out
        G1 Z10; Raise Z more
        G90; Absolute positionning
        G1 X0 Y100; Present print
        M106 S0; Turn-off fan
        M104 S0; Turn-off hotend
        M140 S0; Turn-off bed
        M84 X Y E; Disable all steppers but Z
      machine_max_acceleration_e:
      - 5000.0
      - 5000.0
      machine_max_acceleration_extruding:
      - 1000.0
      - 1250.0
      machine_max_acceleration_retracting:
      - 1000.0
      - 1250.0
      machine_max_acceleration_travel:
      - 1000.0
      - 1250.0
      machine_max_acceleration_x:
      - 2000.0
      - 1000.0
      machine_max_acceleration_y:
      - 2000.0
      - 1000.0
      machine_max_acceleration_z:
      - 500.0
      - 200.0
      machine_max_jerk_e:
      - 3.0
      - 2.5
      machine_max_jerk_x:
      - 7.0
      - 10.0
      machine_max_jerk_y:
      - 7.0
      - 10.0
      machine_max_jerk_z:
      - 0.2
      - 0.4
      machine_max_junction_deviation:
      - 0.032
      - 0.0
      machine_max_feedrate_e:
      - 120.0
      - 120.0
      machine_max_feedrate_x:
      - 500.0
      - 200.0
      machine_max_feedrate_y:
      - 500.0
      - 200.0
      machine_max_feedrate_z:
      - 12.0
      - 12.0
      machine_min_extruding_rate:
      - 0.0
      - 0.0
      machine_min_travel_rate:
      - 0.0
      - 0.0
      pause_print_gcode: M0
      start_gcode: |-
        M83; extruder relative mode
        G28; home all axes
        G29 S12000; bed mesh leveling
        M104 S[first_layer_temperature]; set hotend temperature
        M140 S[first_layer_bed_temperature[initial_extruder]]; set heatbed temperature
        G90; Absolute Positioning
        G1 Y0 F5000; Move to front
        G1 X0 F5000; Move to origin
        M190 S[first_layer_bed_temperature[initial_extruder]]; wait for the bed to heat up
        M109 S[first_layer_temperature]; wait for the extruder to heat up
        G92 E0; reset extruder
        G1 X20 Y5 Z0.3 F5000.0; move to start-line position
        G1 Z0.3 F1000; print height
        G1 X200 Y5 F1500.0 E15; draw 1st line
        G1 X200 Y5.3 Z0.3 F5000.0; move to side a little
        G1 X5.3  Y5.3 Z0.3 F1500.0 E30; draw 2nd line
        G1 Z3 F3000; move z up little to prevent scratching of surface
      parking_pos_retraction: 92
      bed_shape:
      - '0x0'
      - 220x0
      - 220x220
      - '0x220'
      max_print_height: 250
      printer_notes: ''
      between_objects_gcode: ''
      single_extruder_multi_material: true
      template_custom_gcode: ''
      use_firmware_retraction: false
      use_relative_e_distances: true
      z_offset: 0
      thumbnails: 48x48/PNG, 300x300/PNG
      custom_parameters_printer: '{"support_air_filtration": true}'
