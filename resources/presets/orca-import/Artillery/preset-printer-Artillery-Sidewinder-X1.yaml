kind: printer
id: NcBPu+nUeHK9WzVjtlUgwQ
variants:
- condition: printer.model == "Artillery Sidewinder X1"
  name: Artillery Sidewinder X1
  id: fsQUkca/xseKHO+hxkWDsw
  variants:
  - condition: tool.nozzle_diameter == 0.4
    id: R727JPMgJg4TluRVCLM/+w
    values:
      bed_custom_model: ''
      bed_custom_texture: ''
      before_layer_gcode: |+
        ;BEFORE_LAYER_CHANGE
        G92 E0
        ;[layer_z]

      toolchange_gcode: ''
      cooling_tube_length: 5
      cooling_tube_retraction: 91.5
      default_print: 0.20mm Standard @Artillery X1
      remaining_times: true
      machine_limits_usage: emit_to_gcode
      extra_loading_move: -2
      extruder_clearance_height: 36
      extruder_clearance_radius: 65
      extruder_offset:
      - '0x0'
      gcode_flavor: marlin
      high_current_on_filament_swap: false
      layer_gcode: |-
        ;AFTER_LAYER_CHANGE
        ;[layer_z]
      end_gcode: |
        G4 ; wait
        G92 E0 ; prepare to retract
        G1 E-0.5 F3000; retract to avoid stringing

        ; Anti-stringing end wiggle
        G91 ; use relative coordinates
        G1 X1 Y1 F1200

        ; Raise nozzle and present bed
        {if layer_z < max_print_height}G1 Z{z_offset+min(layer_z+120, max_print_height)}{endif} ; Move print head up
        G90 ; use absolute coordinates

        ; Reset print setting overrides
        M200 D0 ; disable volumetric e
        M220 S100 ; reset speed factor to 100%
        M221 S100 ; reset extrusion rate to 100%

        ; Shut down printer
        M106 S0 ; turn-off fan
        M104 S0 ; turn-off hotend
        M140 S0 ; turn-off bed
        M150 P0 ; turn off led
        M85 S0 ; deactivate idle timeout
        M84 ; disable motors
      machine_max_acceleration_e:
      - 5000.0
      - 5000.0
      machine_max_acceleration_extruding:
      - 1250.0
      - 1250.0
      machine_max_acceleration_retracting:
      - 1250.0
      - 1250.0
      machine_max_acceleration_travel:
      - 1000.0
      - 1000.0
      machine_max_acceleration_x:
      - 1000.0
      - 960.0
      machine_max_acceleration_y:
      - 1000.0
      - 960.0
      machine_max_acceleration_z:
      - 100.0
      - 100.0
      machine_max_jerk_e:
      - 1.5
      - 1.5
      machine_max_jerk_x:
      - 8.0
      - 8.0
      machine_max_jerk_y:
      - 8.0
      - 8.0
      machine_max_jerk_z:
      - 0.4
      - 0.4
      machine_max_junction_deviation:
      - 0.013
      - 0.0
      machine_max_feedrate_e:
      - 120.0
      - 120.0
      machine_max_feedrate_x:
      - 200.0
      - 100.0
      machine_max_feedrate_y:
      - 200.0
      - 100.0
      machine_max_feedrate_z:
      - 12.0
      - 12.0
      machine_min_extruding_rate:
      - 0.0
      - 0.0
      machine_min_travel_rate:
      - 0.0
      - 0.0
      pause_print_gcode: M0
      start_gcode: |-
        ; Initial setups
        G90 ; use absolute coordinates
        M83 ; extruder relative mode
        M220 S100 ; reset speed factor to 100%
        M221 S100 ; reset extrusion rate to 100%

        ; Set the heating
        M190 S[first_layer_bed_temperature[initial_extruder]] ; wait for bed to heat up
        M104 S[first_layer_temperature] ; start nozzle heating but don't wait

        ; Home
        G1 Z3 F3000 ; move z up little to prevent scratching of surface
        G28 ; home all axes
        G1 X3 Y3 F5000 ; move to corner of the bed to avoid ooze over centre

        ; Wait for final heating
        M109 S[first_layer_temperature] ; wait for the nozzle to heat up
        M190 S[first_layer_bed_temperature[initial_extruder]] ; wait for the bed to heat up

        ; Return to prime position, Prime line routine
        G92 E0 ; Reset Extruder
        G1 Z3 F3000 ; move z up little to prevent scratching of surface
        G1 X10 Y.5 Z0.25 F5000.0 ; Move to start position
        G1 X100 Y.5 Z0.25 F1500.0 E15 ; Draw the first line
        G1 X100 Y.2 Z0.25 F5000.0 ; Move to side a little
        G1 X10 Y.2 Z0.25 F1500.0 E30 ; Draw the second line
        G92 E0 ; Reset Extruder
        M221 S{if layer_height<0.075}100{else}95{endif}
      parking_pos_retraction: 92
      bed_shape:
      - '0x0'
      - 300x0
      - 300x300
      - '0x300'
      max_print_height: 400
      printer_notes: ''
      between_objects_gcode: ''
      single_extruder_multi_material: true
      template_custom_gcode: ''
      use_firmware_retraction: false
      use_relative_e_distances: true
      z_offset: 0
      thumbnails: 48x48/PNG, 300x300/PNG
      custom_parameters_printer: '{"support_air_filtration": true}'
