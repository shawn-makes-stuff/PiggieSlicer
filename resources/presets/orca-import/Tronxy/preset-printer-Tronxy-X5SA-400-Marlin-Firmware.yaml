kind: printer
id: D5XdR5nEkd/OXXi8Xc2u3g
variants:
- condition: printer.model == "Tronxy X5SA 400 Marlin Firmware"
  name: Tronxy X5SA 400 Marlin Firmware
  id: tzSh1weqKBPy6FQBpmHstg
  variants:
  - condition: tool.nozzle_diameter == 0.4
    id: eMVyGXr9jwgTrd+B9Lg7cg
    values:
      bed_custom_model: ''
      bed_custom_texture: ''
      before_layer_gcode: |
        ;BEFORE_LAYER_CHANGE
        ;[layer_z]
        G92 E0
      toolchange_gcode: ''
      cooling_tube_length: 5
      cooling_tube_retraction: 91.5
      default_print: 0.20mm Standard @Tronxy
      remaining_times: true
      machine_limits_usage: emit_to_gcode
      extra_loading_move: -2
      extruder_clearance_height: 36
      extruder_clearance_radius: 65
      extruder_offset:
      - '0x0'
      gcode_flavor: marlin
      high_current_on_filament_swap: false
      layer_gcode: ''
      end_gcode: "M400 ; wait for buffer to clear\nG92 E0 ; zero the extruder\nG1 E-4.0 F3600; retract \nG91\nG1 Z3;\nM104 S0 ; turn off hotend\nM140 S0 ; turn off bed\nM106 S0 ; turn off fan\nG90 \nG0 X110 Y200 F3600 \nprint_end"
      machine_max_acceleration_e:
      - 5000.0
      machine_max_acceleration_extruding:
      - 10000.0
      machine_max_acceleration_retracting:
      - 1000.0
      machine_max_acceleration_travel:
      - 0.0
      - 0.0
      machine_max_acceleration_x:
      - 10000.0
      machine_max_acceleration_y:
      - 10000.0
      machine_max_acceleration_z:
      - 100.0
      machine_max_jerk_e:
      - 5.0
      machine_max_jerk_x:
      - 8.0
      machine_max_jerk_y:
      - 8.0
      machine_max_jerk_z:
      - 0.4
      machine_max_junction_deviation:
      - 0.01
      machine_max_feedrate_e:
      - 60.0
      machine_max_feedrate_x:
      - 500.0
      machine_max_feedrate_y:
      - 500.0
      machine_max_feedrate_z:
      - 10.0
      machine_min_extruding_rate:
      - 0.0
      machine_min_travel_rate:
      - 0.0
      pause_print_gcode: ''
      start_gcode: |-
        M104 S[first_layer_temperature] ; start heat nozzle
        M140 S[first_layer_bed_temperature] ; start heat bed
        G90 ; abs coords
        M83 ; extrude relative
        G28 ; home
        M190 S[first_layer_bed_temperature] ; wait for bed temp
        M109 S[first_layer_temperature] ; wait for nozzle temp
        G1 X10.1 Y20 Z0.28 F5000.0 ; purge line
        G1 X10.1 Y200.0 Z0.28 F1500.0 E15
        G1 X10.4 Y200.0 Z0.28 F5000.0
        G1 X10.4 Y20 Z0.28 F1500.0 E15
        G1 Z5.0 F3000 ; move Z up
      parking_pos_retraction: 92
      bed_shape:
      - '0x0'
      - 400x0
      - 400x400
      - '0x400'
      max_print_height: 400
      printer_notes: ''
      between_objects_gcode: ''
      single_extruder_multi_material: true
      template_custom_gcode: ''
      use_firmware_retraction: false
      use_relative_e_distances: true
      z_offset: 0
      thumbnails: 48x48/PNG, 300x300/PNG
      custom_parameters_printer: '{"support_air_filtration": true}'
