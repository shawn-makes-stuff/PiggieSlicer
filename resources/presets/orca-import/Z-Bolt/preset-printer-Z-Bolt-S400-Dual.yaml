kind: printer
id: 3vpDiPggsaeRYStPXxpMkQ
variants:
- condition: printer.model == "Z-Bolt S400 Dual"
  name: Z-Bolt S400 Dual
  id: t91TwFzawtcuU/Ka06V7xA
  variants:
  - condition: tool.nozzle_diameter == 0.4 and printer.tool_count == 2
    id: ay8CsY0AnbwsHXEJzQBwxA
    values:
      bed_custom_model: ''
      bed_custom_texture: ''
      before_layer_gcode: |-
        ;BEFORE_LAYER_CHANGE
        ;[layer_z]
        G92 E0
        _BEFORE_LAYER_CHANGE
      toolchange_gcode: |-
        G91
        G1 Z{retract_lift[0]} F1000
        G90
      cooling_tube_length: 5
      cooling_tube_retraction: 91.5
      default_print: 0.20mm Standard @Z-Bolt S400
      remaining_times: true
      machine_limits_usage: time_estimate_only
      extra_loading_move: -2
      extruder_clearance_height: 70
      extruder_clearance_radius: 65
      extruder_offset:
      - '0x0'
      - '0x0'
      gcode_flavor: klipper
      high_current_on_filament_swap: false
      layer_gcode: _AFTER_LAYER_CHANGE Z={layer_z}
      end_gcode: END_PRINT T_BED=[bed_temperature] T_CHAMBER=[chamber_temperature] COOLDOWN_TIME=120
      machine_max_acceleration_e:
      - 5000.0
      - 5000.0
      machine_max_acceleration_extruding:
      - 20000.0
      - 20000.0
      machine_max_acceleration_retracting:
      - 5000.0
      - 5000.0
      machine_max_acceleration_travel:
      - 9000.0
      - 9000.0
      machine_max_acceleration_x:
      - 20000.0
      - 20000.0
      machine_max_acceleration_y:
      - 20000.0
      - 20000.0
      machine_max_acceleration_z:
      - 50.0
      - 50.0
      machine_max_jerk_e:
      - 2.5
      - 2.5
      machine_max_jerk_x:
      - 9.0
      - 9.0
      machine_max_jerk_y:
      - 9.0
      - 9.0
      machine_max_jerk_z:
      - 3.0
      - 3.0
      machine_max_junction_deviation:
      - 0.01
      machine_max_feedrate_e:
      - 30.0
      - 30.0
      machine_max_feedrate_x:
      - 500.0
      - 200.0
      machine_max_feedrate_y:
      - 500.0
      - 200.0
      machine_max_feedrate_z:
      - 20.0
      - 20.0
      machine_min_extruding_rate:
      - 0.0
      - 0.0
      machine_min_travel_rate:
      - 0.0
      - 0.0
      pause_print_gcode: PAUSE
      start_gcode: START_PRINT TOOL_NR=[initial_tool] T_BED=[first_layer_bed_temperature] T_EXTRUDER=[first_layer_temperature[initial_tool]] T_CHAMBER=[chamber_temperature] {if is_extruder_used[0]}T0_TEMP={first_layer_temperature[0]}{endif} {if is_extruder_used[1]}T1_TEMP={first_layer_temperature[1]}{endif}
      parking_pos_retraction: 92
      bed_shape:
      - '0x0'
      - 400x0
      - 400x400
      - '0x400'
      max_print_height: 700
      printer_notes: ''
      between_objects_gcode: ''
      single_extruder_multi_material: false
      template_custom_gcode: ''
      use_firmware_retraction: false
      use_relative_e_distances: true
      z_offset: 0
      thumbnails: 48x48/PNG, 300x300/PNG
      custom_parameters_printer: '{"support_air_filtration": true}'
