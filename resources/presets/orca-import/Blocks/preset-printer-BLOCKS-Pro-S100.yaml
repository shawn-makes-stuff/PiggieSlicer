  - condition: tool.nozzle_diameter == 0.4
    id: nmopfXYKG4OOH9Jqh7bmOg
    values:
      bed_custom_model: ''
      bed_custom_texture: ''
      before_layer_gcode: |
        ;BEFORE_LAYER_CHANGE
        ;[layer_z]
        G92 E0
      toolchange_gcode: CHANGE_FILAMENT
      cooling_tube_length: 5
      cooling_tube_retraction: 91.5
      default_print: 0.20mm Standard 0.4 nozzle @Blocks_Pro_S100
      remaining_times: true
      machine_limits_usage: time_estimate_only
      extra_loading_move: -2
      extruder_clearance_height: 40
      extruder_clearance_radius: 74
      extruder_offset:
      - '0x0'
      gcode_flavor: klipper
      high_current_on_filament_swap: false
      layer_gcode: |
        ;AFTER_LAYER_CHANGE
        ;[layer_z]
      end_gcode: |-
        M400
        PRINT_END
      machine_max_acceleration_e:
      - 5000.0
      - 5000.0
      machine_max_acceleration_extruding:
      - 20000.0
