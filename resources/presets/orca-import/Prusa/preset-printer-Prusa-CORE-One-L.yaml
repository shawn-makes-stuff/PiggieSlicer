  variants:
  - condition: tool.nozzle_diameter == 0.4
    id: prZt++hJFPCIJVYiMaCWcg
    values:
      bed_custom_model: ''
      bed_custom_texture: ''
      before_layer_gcode: |
        ;BEFORE_LAYER_CHANGE
        G92 E0.0
        ;[layer_z]
        {if layer_z > 150}
        M201 X{interpolate_table(layer_z, (0,6000), (150,6000), (200,4000), (331,2000))} Y{interpolate_table(layer_z, (0,6000), (150,6000), (200,4000), (331,2000))}
        {endif}
      toolchange_gcode: |-
        M600
        G1 E0.3 F1500 ; prime after color change
      cooling_tube_length: 5
      cooling_tube_retraction: 91.5
      default_print: 0.20mm SPEED @CORE One L 0.4
      remaining_times: true
      machine_limits_usage: emit_to_gcode
      extra_loading_move: -2
      extruder_clearance_height: 33
      extruder_clearance_radius: 75
      extruder_offset:
      - '0x0'
      gcode_flavor: marlin2
      high_current_on_filament_swap: false
      layer_gcode: |-
        ;AFTER_LAYER_CHANGE
        ;[layer_z]
      end_gcode: |-
        {if layer_z < max_print_height}G1 Z{z_offset+min(max_layer_z+1, max_print_height)} F720 ; Move print head up{endif}
        M104 S0 ; turn off temperature
        M140 S0 ; turn off heatbed
        M141 S0 ; disable chamber control
        M107 ; turn off fan
        M107 P3
        M107 P5
        G1 X242 Y211 F10200 ; park
        G4 ; wait
        M572 S0 ; reset PA
        M84 X Y E ; disable motors
        ; max_layer_z = [max_layer_z]
      machine_max_acceleration_e:
      - 5000.0
      - 2500.0
      machine_max_acceleration_extruding:
      - 7000.0
      - 2500.0
      machine_max_acceleration_retracting:
      - 2500.0
      - 1200.0
      machine_max_acceleration_travel:
      - 6000.0
      - 2500.0
      machine_max_acceleration_x:
      - 10000.0
      - 2500.0
      machine_max_acceleration_y:
      - 10000.0
      - 2500.0
      machine_max_acceleration_z:
      - 400.0
      - 200.0
      machine_max_jerk_e:
      - 10.0
      - 10.0
      machine_max_jerk_x:
      - 10.0
      - 8.0
      machine_max_jerk_y:
      - 10.0
      - 8.0
      machine_max_jerk_z:
      - 2.0
      - 2.0
      machine_max_junction_deviation:
      - 0.01
      machine_max_feedrate_e:
      - 100.0
      - 100.0
      machine_max_feedrate_x:
      - 350.0
      - 160.0
      machine_max_feedrate_y:
      - 350.0
      - 160.0
      machine_max_feedrate_z:
      - 12.0
      - 12.0
      machine_min_extruding_rate:
      - 0.0
      - 0.0
      machine_min_travel_rate:
      - 0.0
      - 0.0
      pause_print_gcode: M601
      start_gcode: "M17 ; enable steppers\nM862.1 P[nozzle_diameter] A{(printer_notes=~/.*ABRASIVE_NOZZLE.*/ ? 1 : 0)} F{(printer_notes=~/.*HF_NOZZLE.*/ ? 1 : 0)} ; nozzle check\nM862.3 P \"COREONEL\" ; printer model check\nM862.5 P2 ; g-code level check\nM862.6 P\"Input shaper\" ; FW feature check\nM115 U6.3.0+10073\n\nM555 X{(min(print_bed_max[0], first_layer_print_min[0] + 32) - 32)} Y{(max(0, first_layer_print_min[1]) - 4)} W{((min(print_bed_max[0], max(first_layer_print_min[0] + 32, first_layer_print_max[0])))) - ((min(print_bed_max[0], first_layer_print_min[0] + 32) - 32))} H{((first_layer_print_max[1])) - ((max(0, first_layer_print_min[1]) - 4))}\n\nG90 ; use absolute coordinates\nM83 ; extruder relative mode\n\nM140 S[first_layer_bed_temperature] ; set bed temp\n{if chamber_temperature[initial_tool] > 35}\nM106 P5 R A125 B10 C5 ;turn on bed fans with fade for chamber or bed\n{else}\nM106 P5 R A125 B10 ;turn on bed fans with fade for bed\n{endif}\n\nM109 R{((filament_notes[0]=~/.*MBL160.*/)\
