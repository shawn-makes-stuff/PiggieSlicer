kind: printer
id: FmEkU1vGj0fB09LLJfJHNQ
variants:
- condition: printer.model == "Prusa MK4S"
  name: Prusa MK4S
  id: csfdYCZBiBSx9k9+yljLxg
  variants:
  - condition: tool.nozzle_diameter == 0.25
    id: TnsGByIZT54MzawY00nxKQ
    values:
      bed_custom_model: ''
      bed_custom_texture: ''
      before_layer_gcode: |
        ;BEFORE_LAYER_CHANGE
        G92 E0.0
        ;[layer_z]
        M201 X{interpolate_table(extruded_weight_total, (0,4000), (1400,2500), (10000,2500))} Y{interpolate_table(extruded_weight_total, (0,4000), (1400,2500), (10000,2500))}
      toolchange_gcode: ''
      cooling_tube_length: 5
      cooling_tube_retraction: 91.5
      default_print: 0.12mm STRUCTURAL @MK4S 0.25
      remaining_times: true
      machine_limits_usage: emit_to_gcode
      extra_loading_move: -2
      extruder_clearance_height: 14
      extruder_clearance_radius: 45
      extruder_offset:
      - '0x0'
      gcode_flavor: marlin2
      high_current_on_filament_swap: false
      layer_gcode: |
        ;AFTER_LAYER_CHANGE
        ;[layer_z]
        {if ! spiral_vase}M74 W[extruded_weight_total]{endif}
      end_gcode: |-
        {if layer_z < max_print_height}G1 Z{z_offset+min(layer_z+1, max_print_height)} F720 ; Move print head up{endif}
        M104 S0 ; turn off temperature
        M140 S0 ; turn off heatbed
        M107 ; turn off fan
        G1 X241 Y170 F3600 ; park
        {if layer_z < max_print_height}G1 Z{z_offset+min(layer_z+23, max_print_height)} F300 ; Move print head up{endif}
        G4 ; wait
        M572 S0 ; reset PA
        M593 X T2 F0 ; disable IS
        M593 Y T2 F0 ; disable IS
        M84 X Y E ; disable motors
        ; max_layer_z = [max_layer_z]
      machine_max_acceleration_e:
      - 2500.0
      - 2500.0
      machine_max_acceleration_extruding:
      - 4000.0
      - 2500.0
      machine_max_acceleration_retracting:
      - 1200.0
      - 1200.0
      machine_max_acceleration_travel:
      - 2500.0
      - 2500.0
      machine_max_acceleration_x:
      - 4000.0
      - 2500.0
      machine_max_acceleration_y:
      - 4000.0
      - 2500.0
      machine_max_acceleration_z:
      - 200.0
      - 200.0
      machine_max_jerk_e:
      - 10.0
      - 10.0
      machine_max_jerk_x:
      - 8.0
      - 8.0
      machine_max_jerk_y:
      - 8.0
      - 8.0
      machine_max_jerk_z:
      - 2.0
      - 2.0
      machine_max_junction_deviation:
      - 0.01
      machine_max_feedrate_e:
      - 100.0
      - 100.0
      machine_max_feedrate_x:
      - 300.0
      - 160.0
      machine_max_feedrate_y:
      - 300.0
      - 160.0
      machine_max_feedrate_z:
      - 40.0
      - 40.0
      machine_min_extruding_rate:
      - 0.0
      - 0.0
      machine_min_travel_rate:
      - 0.0
      - 0.0
      pause_print_gcode: |
        M400 U1
      start_gcode: |-
        M17 ; enable steppers
        M862.1 P[nozzle_diameter] ; nozzle check
        M862.3 P "MK4S" ; printer model check
        M862.5 P2 ; g-code level check
        M862.6 P"Input shaper" ; FW feature check
        M115 U6.1.3+7898

        M555 X{(min(print_bed_max[0], first_layer_print_min[0] + 32) - 32)} Y{(max(0, first_layer_print_min[1]) - 4)} W{((min(print_bed_max[0], max(first_layer_print_min[0] + 32, first_layer_print_max[0])))) - ((min(print_bed_max[0], first_layer_print_min[0] + 32) - 32))} H{((first_layer_print_max[1])) - ((max(0, first_layer_print_min[1]) - 4))}

        G90 ; use absolute coordinates
        M83 ; extruder relative mode

        M140 S[first_layer_bed_temperature] ; set bed temp
        M104 T0 S{((filament_notes[0]=~/.*HT_MBL10.*/) ? (first_layer_temperature[0] - 10) : (filament_type[0] == "PC" or filament_type[0] == "PA") ? (first_layer_temperature[0] - 25) : (filament_type[0] == "FLEX") ? 210 : (filament_type[0]=~/.*PET.*/) ? 175 : 170)} ; set extruder temp for bed leveling
        M109 T0 R{((filament_notes[0]=~/.*HT_MBL10.*/) ? (first_layer_temperature[0] - 10) : (filament_type[0] == "PC" or filament_type[0] == "PA") ? (first_layer_temperature[0] - 25) : (filament_type[0] == "FLEX") ? 210 : (filament_type[0]=~/.*PET.*/) ? 175 : 170)} ; wait for temp

        M84 E ; turn off E motor

        G28 ; home all without mesh bed level

        G1 X42 Y-4 Z5 F4800

        M302 S160 ; lower cold extrusion limit to 160C

        {if filament_type[initial_tool]=="FLEX"}
        G1 E-4 F2400 ; retraction
        {else}
        G1 E-2 F2400 ; retraction
        {endif}

        M84 E ; turn off E motor

        G29 P9 X10 Y-4 W32 H4

        {if first_layer_bed_temperature[initial_tool]<=60}M106 S100{endif}

        G0 Z40 F10000

        M190 S[first_layer_bed_temperature] ; wait for bed temp

        M107

        ;
        ; MBL
        ;
        M84 E ; turn off E motor
        G29 P1 ; invalidate mbl & probe print area
        G29 P1 X0 Y0 W50 H20 C ; probe near purge place
        G29 P3.2 ; interpolate mbl probes
        G29 P3.13 ; extrapolate mbl outside probe area
        G29 A ; activate mbl

        ; prepare for purge
        M104 S{first_layer_temperature[0]}
        G0 X0 Y-4 Z15 F4800 ; move away and ready for the purge
        M109 S{first_layer_temperature[0]}

        G92 E0
        M569 S0 E ; set spreadcycle mode for extruder

        ;
        ; Extrude purge line
        ;
        G92 E0 ; reset extruder position
        G1 E{(filament_type[0] == "FLEX" ? 4 : 2)} F2400 ; deretraction after the initial one before nozzle cleaning
        G0 E7 X15 Z0.2 F500 ; purge
        G0 X25 E4 F500 ; purge
        G0 X35 E4 F650 ; purge
        G0 X45 E4 F800 ; purge
        G0 X48 Z0.05 F8000 ; wipe, move close to the bed
        G0 X51 Z0.2 F8000 ; wipe, move quickly away from the bed

        G92 E0
        M221 S100 ; set flow to 100%
      parking_pos_retraction: 92
      bed_shape:
      - '0x0'
      - 250x0
      - 250x210
      - '0x210'
      max_print_height: 220
      printer_notes: |-
        Don't remove the following keywords! These keywords are used in the "compatible printer" condition of the print and filament profiles to link the particular print and filament profiles to this printer profile.
        PRINTER_MODEL_MK4S
        PG
        NO_TEMPLATES
      between_objects_gcode: ''
      single_extruder_multi_material: false
      template_custom_gcode: ''
      use_firmware_retraction: false
      use_relative_e_distances: true
      z_offset: 0
      thumbnails: 16x16/QOI, 313x173/QOI, 440x240/QOI, 480x240/QOI, 640x480/PNG
      custom_parameters_printer: '{"support_air_filtration": true}'
