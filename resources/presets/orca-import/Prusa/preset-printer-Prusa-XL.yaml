kind: printer
id: yR+/nnvdQuMIPjizujZIqA
variants:
- condition: printer.model == "Prusa XL"
  name: Prusa XL
  id: aJPLjUsWIISPVmzC0JAWmg
  variants:
  - condition: tool.nozzle_diameter == 0.25
    id: 5JAGTGkX93swNHnNqqteFg
    values:
      bed_custom_model: ''
      bed_custom_texture: ''
      before_layer_gcode: |-
        ;BEFORE_LAYER_CHANGE
        G92 E0.0
        ;[layer_z]
      toolchange_gcode: |-
        M600
        G1 E0.3 F1500 ; prime after color change
      cooling_tube_length: 5
      cooling_tube_retraction: 91.5
      default_print: 0.15mm Speed @Prusa XL 0.25
      remaining_times: true
      machine_limits_usage: emit_to_gcode
      extra_loading_move: -2
      extruder_clearance_height: 21
      extruder_clearance_radius: 67
      extruder_offset:
      - '0x0'
      gcode_flavor: marlin2
      high_current_on_filament_swap: false
      layer_gcode: |-
        ;AFTER_LAYER_CHANGE
        ;[layer_z]
      end_gcode: |-
        {if max_layer_z < max_print_height}G1 Z{z_offset+min(max_layer_z+2, max_print_height)} F720{endif} ; Move bed down
        M104 S0 ; turn off temperature
        M140 S0 ; turn off heatbed
        M107 ; turn off fan
        G1 X6 Y350 F6000 ; park
        {if max_layer_z < max_print_height}G1 Z{z_offset+min(max_layer_z+100, max_print_height)} F300{endif} ; Move bed down
        M900 K0 ; reset LA
        M142 S36 ; reset heatbreak target temp
        M221 S100 ; reset flow percentage
        M84 ; disable motors
        ; max_layer_z = [max_layer_z]
      machine_max_acceleration_e:
      - 2500.0
      - 2500.0
      machine_max_acceleration_extruding:
      - 4000.0
      - 4000.0
      machine_max_acceleration_retracting:
      - 1200.0
      - 1200.0
      machine_max_acceleration_travel:
      - 5000.0
      - 5000.0
      machine_max_acceleration_x:
      - 7000.0
      - 7000.0
      machine_max_acceleration_y:
      - 7000.0
      - 7000.0
      machine_max_acceleration_z:
      - 200.0
      - 200.0
      machine_max_jerk_e:
      - 10.0
      - 10.0
      machine_max_jerk_x:
      - 8.0
      - 8.0
      machine_max_jerk_y:
      - 8.0
      - 8.0
      machine_max_jerk_z:
      - 2.0
      - 2.0
      machine_max_junction_deviation:
      - 0.01
      machine_max_feedrate_e:
      - 100.0
      - 100.0
      machine_max_feedrate_x:
      - 400.0
      - 400.0
      machine_max_feedrate_y:
      - 400.0
      - 400.0
      machine_max_feedrate_z:
      - 12.0
      - 12.0
      machine_min_extruding_rate:
      - 0.0
      - 0.0
      machine_min_travel_rate:
      - 0.0
      - 0.0
      pause_print_gcode: M601
      start_gcode: |-
        M17 ; enable steppers
        M862.3 P "XL" ; printer model check
        M115 U6.0.1+14848
        G90 ; use absolute coordinates
        M83 ; extruder relative mode
        ; set print area
        M555 X{first_layer_print_min[0]} Y{first_layer_print_min[1]} W{(first_layer_print_max[0]) - (first_layer_print_min[0])} H{(first_layer_print_max[1]) - (first_layer_print_min[1])}
        ; inform about nozzle diameter
        M862.1 P[nozzle_diameter]
        ; set & wait for bed and extruder temp for MBL
        M140 S[first_layer_bed_temperature] ; set bed temp
        M104 T0 S{((filament_notes[0]=~/.*HT_MBL10.*/) ? (first_layer_temperature[0] - 10) : (filament_type[0] == "PC" or filament_type[0] == "PA") ? (first_layer_temperature[0] - 25) : (filament_type[0] == "FLEX") ? 210 : (filament_type[0]=~/.*PET.*/) ? 175 : 170)} ; set extruder temp for bed leveling
        M109 T0 R{((filament_notes[0]=~/.*HT_MBL10.*/) ? (first_layer_temperature[0] - 10) : (filament_type[0] == "PC" or filament_type[0] == "PA") ? (first_layer_temperature[0] - 25) : (filament_type[0] == "FLEX") ? 210 : (filament_type[0]=~/.*PET.*/) ? 175 : 170)} ; wait for temp
        ; home carriage, pick tool, home all
        G28 XY
        M84 E ; turn off E motor
        G28 Z
        M190 S[first_layer_bed_temperature] ; wait for bed temp
        G29 G ; absorb heat
        ; move to the nozzle cleanup area
        G1 X{(min(((((first_layer_print_min[0] + first_layer_print_max[0]) / 2) < ((print_bed_min[0] + print_bed_max[0]) / 2)) ? (((first_layer_print_min[1] - 7) < -2) ? 70 : (min(print_bed_max[0], first_layer_print_min[0] + 32) - 32)) : (((first_layer_print_min[1] - 7) < -2) ? 260 : (min(print_bed_max[0], first_layer_print_min[0] + 32) - 32))), first_layer_print_min[0])) + 32} Y{(min((first_layer_print_min[1] - 7), first_layer_print_min[1]))} Z{5} F4800
        M302 S160 ; lower cold extrusion limit to 160C
        G1 E{-(filament_type[0] == "FLEX" ? 4 : 2)} F2400 ; retraction for nozzle cleanup
        ; nozzle cleanup
        M84 E ; turn off E motor
        G29 P9 X{((((first_layer_print_min[0] + first_layer_print_max[0]) / 2) < ((print_bed_min[0] + print_bed_max[0]) / 2)) ? (((first_layer_print_min[1] - 7) < -2) ? 70 : (min(print_bed_max[0], first_layer_print_min[0] + 32) - 32)) : (((first_layer_print_min[1] - 7) < -2) ? 260 : (min(print_bed_max[0], first_layer_print_min[0] + 32) - 32)))} Y{(first_layer_print_min[1] - 7)} W{32} H{7}
        G0 Z10 F480 ; move away in Z
        {if first_layer_bed_temperature[0] > 60}
        G0 Z70 F480 ; move away (a bit more) in Z
        G0 X30 Y{print_bed_min[1]} F6000 ; move away in X/Y for higher bed temperatures
        {endif}
        M106 S100 ; cool off the nozzle
        M107 ; stop cooling off the nozzle - turn off the fan
        ; MBL
        M84 E ; turn off E motor
        G29 P1 ; invalidate mbl & probe print area
        G29 P1 X30 Y0 W50 H20 C ; probe near purge place
        G29 P3.2 ; interpolate mbl probes
        G29 P3.13 ; extrapolate mbl outside probe area
        G29 A ; activate mbl
        M104 S[first_layer_temperature] ; set extruder temp
        G1 Z10 F720 ; move away in Z
        G0 X30 Y-8 F6000 ; move next to the sheet
        ; wait for extruder temp
        M109 T0 S{first_layer_temperature[0]}
        ;
        ; purge
        ;
        G92 E0 ; reset extruder position
        G0 X{(0 == 0 ? 30 : (0 == 1 ? 150 : (0 == 2 ? 210 : 330)))} Y{(0 < 4 ? -8 : -5.5)} ; move close to the sheet's edge
        G1 E{(filament_type[0] == "FLEX" ? 4 : 2)} F2400 ; deretraction after the initial one before nozzle cleaning
        G0 E10 X40 Z0.2 F500 ; purge
        G0 X70 E9 F800 ; purge
        G0 X{70 + 3} Z{0.05} F{8000} ; wipe, move close to the bed
        G0 X{70 + 3 * 2} Z0.2 F{8000} ; wipe, move quickly away from the bed
        G92 E0 ; reset extruder position
      parking_pos_retraction: 92
      bed_shape:
      - '0x0'
      - 360x0
      - 360x360
      - '0x360'
      max_print_height: 360
      printer_notes: |-
        Don't remove the following keywords! These keywords are used in the "compatible printer" condition of the print and filament profiles to link the particular print and filament profiles to this printer profile.
        PRINTER_MODEL_XLIS
        PG
        INPUT_SHAPER
      between_objects_gcode: ''
      single_extruder_multi_material: true
      template_custom_gcode: ''
      use_firmware_retraction: false
      use_relative_e_distances: true
      z_offset: 0
      thumbnails: 16x16/QOI, 313x173/QOI, 440x240/QOI, 480x240/QOI, 640x480/PNG
      custom_parameters_printer: '{"support_air_filtration": true}'
