kind: printer
id: 4YaXOipaVyFF2BL/xRwuGA
variants:
- condition: printer.model == "Prusa MINI IS"
  name: Prusa MINI IS
  id: Jx5WH2GkwBYUckNSpiu5Tw
  variants:
  - condition: tool.nozzle_diameter == 0.25
    id: gnE71MBc/iHSt+0Z3bS3sA
    values:
      bed_custom_model: ''
      bed_custom_texture: ''
      before_layer_gcode: |-
        ;BEFORE_LAYER_CHANGE
        G92 E0.0
        ;[layer_z]
        M201 X{interpolate_table(extruded_weight_total, (0,4000), (1000,1700), (10000,1700))} Y{interpolate_table(extruded_weight_total, (0,4000), (1000,1700), (10000,1700))}
      toolchange_gcode: M600
      cooling_tube_length: 5
      cooling_tube_retraction: 91.5
      default_print: 0.12mm Standard @MINIIS
      remaining_times: true
      machine_limits_usage: emit_to_gcode
      extra_loading_move: -2
      extruder_clearance_height: 36
      extruder_clearance_radius: 65
      extruder_offset:
      - '0x0'
      gcode_flavor: marlin2
      high_current_on_filament_swap: false
      layer_gcode: |
        ;AFTER_LAYER_CHANGE
        ;[layer_z]
        {if ! spiral_vase}M74 W[extruded_weight_total]{endif}
      end_gcode: |-
        {if max_layer_z < max_print_height}G1 Z{z_offset+min(max_layer_z+2, max_print_height)} F720 ; Move print head up{endif}
        G1 X170 Y170 F4200 ; park print head
        {if max_layer_z < max_print_height}G1 Z{z_offset+min(max_layer_z+50, max_print_height)} F720 ; Move print head further up{endif}
        G4 ; wait
        M104 S0 ; turn off temperature
        M140 S0 ; turn off heatbed
        M107 ; turn off fan
        M221 S100 ; reset flow
        M572 S0 ; reset PA
        M569 S1 X Y ; reset to stealthchop for X Y
        M84 ; disable motors
        ; max_layer_z = [max_layer_z]
      machine_max_acceleration_e:
      - 5000.0
      - 5000.0
      machine_max_acceleration_extruding:
      - 4000.0
      - 4000.0
      machine_max_acceleration_retracting:
      - 1250.0
      - 1250.0
      machine_max_acceleration_travel:
      - 4000.0
      - 4000.0
      machine_max_acceleration_x:
      - 4000.0
      - 4000.0
      machine_max_acceleration_y:
      - 4000.0
      - 4000.0
      machine_max_acceleration_z:
      - 400.0
      - 400.0
      machine_max_jerk_e:
      - 10.0
      - 2.5
      machine_max_jerk_x:
      - 8.0
      - 8.0
      machine_max_jerk_y:
      - 8.0
      - 8.0
      machine_max_jerk_z:
      - 2.0
      - 2.0
      machine_max_junction_deviation:
      - 0.01
      - 0.01
      machine_max_feedrate_e:
      - 80.0
      - 25.0
      machine_max_feedrate_x:
      - 400.0
      - 400.0
      machine_max_feedrate_y:
      - 400.0
      - 400.0
      machine_max_feedrate_z:
      - 12.0
      - 12.0
      machine_min_extruding_rate:
      - 0.0
      - 0.0
      machine_min_travel_rate:
      - 0.0
      - 0.0
      pause_print_gcode: M601
      start_gcode: "M862.3 P \"MINI\" ; printer model check\nM862.1 P[nozzle_diameter] ; nozzle diameter check\nM862.5 P2 ; g-code level check\nM862.6 P\"Input shaper\" ; FW feature check\nM115 U6.4.0+11974\nG90 ; use absolute coordinates\nM83 ; extruder relative mode\nG28 ; home all without mesh bed level\nM104 S170 ; set extruder temp for bed leveling\nM140 S[first_layer_bed_temperature] ; set bed temp\nM109 R170 ; wait for bed leveling temp\nM190 S[first_layer_bed_temperature] ; wait for bed temp\nM569 S1 X Y ; set stealthchop for X Y\nM204 T1250 ; set travel acceleration\nG29 ; mesh bed leveling \nM104 S[first_layer_temperature] ; set extruder temp\nG92 E0\n\nG1 X0 Y-2 Z3 F2400\n\nM109 S[first_layer_temperature] ; wait for extruder temp\n\n; intro line\nG1 X10 Z0.2 F1000\nG1 X70 E8 F900\nG1 X140 E10 F700\nG92 E0\n\nM569 S0 X Y ; set spreadcycle for X Y\nM204 T[machine_max_acceleration_travel] ; restore travel acceleration\nM572 W0.06 ; set smooth time\nM221 S95 ; set flow"
      parking_pos_retraction: 92
      bed_shape:
      - '0x0'
      - 180x0
      - 180x180
      - '0x180'
      max_print_height: 180
      printer_notes: |-
        Don't remove the following keywords! These keywords are used in the "compatible printer" condition of the print and filament profiles to link the particular print and filament profiles to this printer profile.
        PRINTER_VENDOR_PRUSA3D
        PRINTER_MODEL_MINIIS
        NO_TEMPLATES
      between_objects_gcode: ''
      single_extruder_multi_material: true
      template_custom_gcode: ''
      use_firmware_retraction: false
      use_relative_e_distances: true
      z_offset: 0
      thumbnails: 16x16/QOI, 220x124/QOI, 200x240/QOI, 640x480/PNG
      custom_parameters_printer: '{"support_air_filtration": true}'
