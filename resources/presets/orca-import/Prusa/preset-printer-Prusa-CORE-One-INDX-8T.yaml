kind: printer
id: m4MbkwUMp6PDC/nb55w1pA
variants:
- condition: printer.model == "Prusa CORE One INDX 8T"
  name: Prusa CORE One INDX 8T
  id: x3MPf3KHO3PmHrrjkdgaBA
  variants:
  - condition: tool.nozzle_diameter == 0.4 and printer.tool_count == 8
    id: CGwEVoBwxEtczv+Y3m8mRA
    values:
      bed_custom_model: ''
      bed_custom_texture: ''
      before_layer_gcode: |
        ;BEFORE_LAYER_CHANGE
        G92 E0.0
        ;[layer_z]
        {if layer_z > 150}
        M201 X{interpolate_table(layer_z, (0,7000), (150,7000), (200,4500), (270,2000))} Y{interpolate_table(layer_z, (0,7000), (150,7000), (200,4500), (270,2000))}
        {endif}
      toolchange_gcode: "{if not (layer_num < 0 )} \n  {\n  local speed_tc = min(travel_speed, 350.0) * 60;\n  local deretract_length = 1.0 * retract_toolchange + retract_length[next_extruder];\n  local target_temp = temperature[next_extruder];\n  local eject_temp = max(160,target_temp - 60);\n  local filament_area = 3.14 * filament_diameter[next_extruder] * filament_diameter[next_extruder] / 4.0;\n  local purge_mm = max(3.0, filament_minimal_purge_on_wipe_tower[next_extruder] * 1.0 / filament_area);\n  local purge_speed_fast = 60.0 * min(6,max(1.5,0.6*filament_max_volumetric_speed[next_extruder]/filament_area));\n  local purge_speed_slow = 60.0 * min(3,max(1.5,0.3*filament_max_volumetric_speed[next_extruder]/filament_area));\n  local tc_retract_speed = 60.0 * min(30,max(10,retract_speed[current_extruder]));\n  local tc_deretract_speed = 60.0 * min(20,max(5,deretract_speed[next_extruder]));\n  }\n\n  {if filament_minimal_purge_on_wipe_tower[next_extruder] == 0}\n    {purge_mm = 5.0}\n  {endif}\n\
        \n  \n\n  {if (custom_parameter_filament_filament_flush_volumetric_speed[next_extruder] / filament_area) > 0}\n    {purge_speed_fast = 60.0 * min(10,max(1,(custom_parameter_filament_filament_flush_volumetric_speed[next_extruder] / filament_area)))}\n    {purge_speed_slow = 60.0 * min(10,max(1,(custom_parameter_filament_filament_flush_volumetric_speed[next_extruder] / filament_area) / 2))}\n  {endif}\n\n  {if filament_type[current_extruder]==\"TPU\"}\n    {tc_retract_speed = 60*15}\n  {endif}\n\n  {if filament_type[next_extruder]==\"TPU\"}\n    {tc_deretract_speed = 60*10}\n  {endif}\n\n  {if !is_nil(custom_parameter_filament_filament_retract_length_toolchange[next_extruder])}\n    {deretract_length = retract_toolchange + custom_parameter_filament_filament_retract_length_toolchange[next_extruder]}\n  {endif}\n\n  {if tool_init[next_extruder] == 0}\n    {deretract_length = 1.6}\n  {endif}\n\n  {if layer_z <= (first_layer_height + 0.0001)}\n    {target_temp = first_layer_temperature[next_extruder]}\n\
        \  {endif}\n\n  ; Change Tool[previous_extruder] -> Tool[next_extruder] (layer [layer_num])\n  M83\n\n  {if e_retracted[current_extruder] < retract_length[current_extruder]}\n    G1 E-{retract_length[current_extruder] - e_retracted[current_extruder]} F{retract_speed[current_extruder] * 60}\n    {e_retracted[current_extruder] = retract_length[current_extruder]}\n  {endif}\n\n  G1 F{speed_tc}\n  M204 S7000\n\n  G27 W3 Z{retract_lift[current_extruder]} P2 R{retract_toolchange} V{tc_retract_speed/60} A{travel_slope[current_extruder]}\n  P0 S1 L0 D0\n\n\n  T{next_extruder} S1 L0 D0\n\n  M104 S{eject_temp+15}\n\n  G12 S90 ; enter cleaner\n\n  G0 Z{layer_z + 0.8} ; Lift\n\n  M109 C{eject_temp} ; Skip residency\n\n  M104 S{target_temp + 5}\n\n  {if ((wipe_tower == false) or (tool_init[next_extruder] == 0))}\n  ;-------Purge Station specific Gcode Start-----\n\n    {if tool_init[next_extruder] == 1}\n      ; INDX final lock extrusion\n      G1 E1.6 F{20 * 60} ; Final lock tool\n      ; End\
        \ final lock extrusion\n    {endif}\n\n    G12 S30 ; eject poop\n\n    M106 S{255 / 100 * max_fan_speed[next_extruder]}\n\n    M906 P1 ; Set extruder current\n\n    M109 C{target_temp}\n    M104 S{target_temp}\n\n    G1 E{deretract_length} F{tc_deretract_speed}\n\n    G91 ; use relative coordinates\n    M83 ; extruder relative mode\n    M572 S0.0 ; Disable PressureAdvance\n\n    ;FLUSH_START\n    G1 X-0.2  E{0}                F{1200}\n    G1 X0.40  E{0.15 * purge_mm}  F{0.40 / (0.15 * purge_mm) * purge_speed_slow}\n    G1 Y-1.20 E{0.35 * purge_mm}  F{1.20 / (0.35 * purge_mm) * purge_speed_fast}\n    G1 X-0.4  E{0.20 * purge_mm}  F{0.40 / (0.20 * purge_mm) * purge_speed_fast}\n    G1 Y1.20  E{0.25 * purge_mm}  F{1.20 / (0.25 * purge_mm) * purge_speed_fast}\n    G1 X0.20  E{0.05 * purge_mm}  F{0.20 / (0.05 * purge_mm) * purge_speed_fast}\n    ;FLUSH_END\n\n    M400\n    M906 P0 ; Revert extruder current\n\n    ; RETRACT AFTER TOOLCHANGE START\n    G1 Y0 E-{retract_length[next_extruder]\
        \ + 0.04} F{retract_speed[next_extruder] * 60}\n\n    {e_retracted[next_extruder] = retract_length[next_extruder] + retract_restart_extra_toolchange[next_extruder]}\n    ; RETRACT AFTER TOOLCHANGE END\n\n    G1 Y5 F{speed_tc}\n\n  ;-------Purge Station specific Gcode End-----\n\n\n\n\n  {else}\n  ;-------Wipe Tower specific Gcode Start-----\n\n    G1 E2.0 F{retract_speed[current_extruder] * 60}\n\n    G750 Y85 F21000 A\n    G750 Y93 F21000 A\n    G750 Y82 F21000 A\n    G750 Y98.5 F21000 A\n    G750 Y75 F21000 A\n    G750 Y98.5 F21000 A\n\n    M109 C{target_temp}\n    M104 S{target_temp}\n\n    G1 E{deretract_length-2.0-retract_length[next_extruder]+1.2} F{tc_deretract_speed}\n    {e_retracted[next_extruder] = retract_length[next_extruder]}\n    G1 F{speed_tc} ;revert travel speed\n\n  ;-------Wipe Tower specific Gcode End-----\n  {endif}\n\n  {tool_init[next_extruder] = 1}\n\n  G90 ; use absolute coordinates\n  M83 ; extruder relative mode\n  G12 S91 ; Exit cleaning station\n  G0\
        \ Z{layer_z + 1.0} ; Lift\n  G4 S0\n{else}\n  T{next_extruder} S1 L0 D0\n{endif}"
      cooling_tube_length: 20
      cooling_tube_retraction: 45
      default_print: 0.20mm Balanced @Prusa CORE One INDX HF 0.4
      remaining_times: true
      machine_limits_usage: emit_to_gcode
      extra_loading_move: -52
      extruder_clearance_height: 33
      extruder_clearance_radius: 75
      extruder_offset:
      - '0x0'
      - '0x0'
      - '0x0'
      - '0x0'
      - '0x0'
      - '0x0'
      - '0x0'
      - '0x0'
      gcode_flavor: marlin2
      high_current_on_filament_swap: false
      layer_gcode: |
        ;AFTER_LAYER_CHANGE
        ;[layer_z]

        ; dock fan control
        {if layer_num == 1 or layer_num == 3}
          M106 P6 S0 ; dock fan off (baseline)
          {if used_tools > 1}
            ;PET-family (PET/PETG/*-CF...)/CPE/PCTG - dock fan 100 from 3rd layer
            {if layer_num == 3 and ((is_extruder_used[0] and filament_type[0]=~/(PET|CPE|PCTG)/) or (is_extruder_used[1] and filament_type[1]=~/(PET|CPE|PCTG)/) or (is_extruder_used[2] and filament_type[2]=~/(PET|CPE|PCTG)/) or (is_extruder_used[3] and filament_type[3]=~/(PET|CPE|PCTG)/) or
          (is_extruder_used[4] and filament_type[4]=~/(PET|CPE|PCTG)/) or (is_extruder_used[5] and filament_type[5]=~/(PET|CPE|PCTG)/) or (is_extruder_used[6] and filament_type[6]=~/(PET|CPE|PCTG)/) or (is_extruder_used[7] and filament_type[7]=~/(PET|CPE|PCTG)/))}
              M106 P6 S100
            {endif}

            ;low-temp materials - dock fan 100% (S255) from 1st layer (uses global low_temp_types)
            {if (is_extruder_used[0] and one_of(filament_type[0], ~low_temp_types)) or (is_extruder_used[1] and one_of(filament_type[1], ~low_temp_types)) or (is_extruder_used[2] and one_of(filament_type[2], ~low_temp_types)) or (is_extruder_used[3] and one_of(filament_type[3], ~low_temp_types)) or (is_extruder_used[4] and one_of(filament_type[4], ~low_temp_types)) or (is_extruder_used[5] and one_of(filament_type[5], ~low_temp_types)) or (is_extruder_used[6] and one_of(filament_type[6], ~low_temp_types)) or (is_extruder_used[7] and one_of(filament_type[7], ~low_temp_types))}
              M106 P6 S255
            {endif} ; PLA wins by order
          {endif}
        {endif}
      end_gcode: |-
        {if layer_z < max_print_height}G1 Z{z_offset+min(max_layer_z+1, max_print_height)} F720 ; Move print head up{endif}

        ; turn off extruder heaters
        {if is_extruder_used[0]}M104 T0 S0{endif}
        {if is_extruder_used[1]}M104 T1 S0{endif}
        {if is_extruder_used[2]}M104 T2 S0{endif}
        {if is_extruder_used[3]}M104 T3 S0{endif}
        {if is_extruder_used[4]}M104 T4 S0{endif}
        {if is_extruder_used[5]}M104 T5 S0{endif}
        {if is_extruder_used[6]}M104 T6 S0{endif}
        {if is_extruder_used[7]}M104 T7 S0{endif}

        M140 S0 ; turn off heatbed
        M141 S0 ; disable chamber control
        M107 ; turn off fan
        M106 P6 S0 ; turn off dock fan

        P0 S1 ; park tool

        G1 X242 Y205 F10200 ; park
        G4 ; wait
        M572 S0 ; reset PA
        M221 S100 ; reset flow percentage
        M84 X Y E ; disable motors
        M77 ; stop print timer
        ; max_layer_z = [max_layer_z]
      machine_max_acceleration_e:
      - 5000.0
      - 2500.0
      machine_max_acceleration_extruding:
      - 7000.0
      - 2500.0
      machine_max_acceleration_retracting:
      - 2500.0
      - 2500.0
      machine_max_acceleration_travel:
      - 7000.0
      - 2500.0
      machine_max_acceleration_x:
      - 10000.0
      - 2500.0
      machine_max_acceleration_y:
      - 10000.0
      - 2500.0
      machine_max_acceleration_z:
      - 400.0
      - 200.0
      machine_max_jerk_e:
      - 10.0
      - 10.0
      machine_max_jerk_x:
      - 10.0
      - 8.0
      machine_max_jerk_y:
      - 10.0
      - 8.0
      machine_max_jerk_z:
      - 2.0
      - 2.0
      machine_max_junction_deviation:
      - 0.01
      - 0.01
      machine_max_feedrate_e:
      - 100.0
      - 100.0
      machine_max_feedrate_x:
      - 350.0
      - 160.0
      machine_max_feedrate_y:
      - 350.0
      - 160.0
      machine_max_feedrate_z:
      - 12.0
      - 12.0
      machine_min_extruding_rate:
      - 0.0
      - 0.0
      machine_min_travel_rate:
      - 0.0
      - 0.0
      pause_print_gcode: M601
      start_gcode: |
        {
        global retract_toolchange = 8;
        global tool_init = (0,0,0,0,0,0,0,0);
        global used_tools = 0 ;
        global low_temp_types = "PLA|PVA|BVOH|FLEX|TPU|TPE|PVB";
        }

        ; number of used tools
        {if is_extruder_used[0]}{used_tools = used_tools + 1}{endif}
        {if is_extruder_used[1]}{used_tools = used_tools + 1}{endif}
        {if is_extruder_used[2]}{used_tools = used_tools + 1}{endif}
        {if is_extruder_used[3]}{used_tools = used_tools + 1}{endif}
        {if is_extruder_used[4]}{used_tools = used_tools + 1}{endif}
        {if is_extruder_used[5]}{used_tools = used_tools + 1}{endif}
        {if is_extruder_used[6]}{used_tools = used_tools + 1}{endif}
        {if is_extruder_used[7]}{used_tools = used_tools + 1}{endif}

        {local probe_temp = "" + ((filament_notes[initial_tool]=~/.*MBL160.*/) ? 160 : (filament_notes[initial_tool]=~/.*HT_MBL10.*/) ? (first_layer_temperature[initial_tool] - 10) : (filament_type[initial_tool] == "PC" or filament_type[initial_tool] == "PA") ? (first_layer_temperature[initial_tool] - 55) : (filament_type[initial_tool] == "TPU") ? 170 : (filament_type[initial_tool]=~/.*PET.*/) ? 170 : 170) + "";}

        M862.3 P "COREONEINDX" ; printer model check
        M862.5 P2 ; g-code level check
        M862.6 P"Input shaper" ; FW feature check
        M862.6 P"INDX lock" ; FW feature check
        M115 U6.9.0+16311

        M591 S0 ; disable stuck detection

        M555 X{(min(print_bed_max[0], first_layer_print_min[0] + 32) - 32)} Y{(max(0, first_layer_print_min[1]) - 4)} W{((min(print_bed_max[0], max(first_layer_print_min[0] + 32, first_layer_print_max[0])))) - ((min(print_bed_max[0], first_layer_print_min[0] + 32) - 32))} H{((first_layer_print_max[1])) - ((max(0, first_layer_print_min[1]) - 4))}

        ; inform about nozzle diameter
        {if (is_extruder_used[0])}M862.1 T0 P{nozzle_diameter[0]} A{((custom_parameter_filament_required_nozzle_HRC[0] > 0) ? 1 : 0)} F{(true ? 1 : 0)}{endif}
        {if (is_extruder_used[1])}M862.1 T1 P{nozzle_diameter[1]} A{((custom_parameter_filament_required_nozzle_HRC[1] > 0) ? 1 : 0)} F{(true ? 1 : 0)}{endif}
        {if (is_extruder_used[2])}M862.1 T2 P{nozzle_diameter[2]} A{((custom_parameter_filament_required_nozzle_HRC[2] > 0) ? 1 : 0)} F{(true ? 1 : 0)}{endif}
        {if (is_extruder_used[3])}M862.1 T3 P{nozzle_diameter[3]} A{((custom_parameter_filament_required_nozzle_HRC[3] > 0) ? 1 : 0)} F{(true ? 1 : 0)}{endif}
        {if (is_extruder_used[4])}M862.1 T4 P{nozzle_diameter[4]} A{((custom_parameter_filament_required_nozzle_HRC[4] > 0) ? 1 : 0)} F{(true ? 1 : 0)}{endif}
        {if (is_extruder_used[5])}M862.1 T5 P{nozzle_diameter[5]} A{((custom_parameter_filament_required_nozzle_HRC[5] > 0) ? 1 : 0)} F{(true ? 1 : 0)}{endif}
        {if (is_extruder_used[6])}M862.1 T6 P{nozzle_diameter[6]} A{((custom_parameter_filament_required_nozzle_HRC[6] > 0) ? 1 : 0)} F{(true ? 1 : 0)}{endif}
        {if (is_extruder_used[7])}M862.1 T7 P{nozzle_diameter[7]} A{((custom_parameter_filament_required_nozzle_HRC[7] > 0) ? 1 : 0)} F{(true ? 1 : 0)}{endif}

        G90 ; use absolute coordinates
        M83 ; extruder relative mode

        M140 S{first_layer_bed_temperature[initial_tool]} ; set bed temp

        {if chamber_minimal_temperature[initial_tool] == 0}
          M141 S{chamber_temperature[initial_tool]} ; set nominal chamber temp
        {endif}

        ; Home XY
        G28 XY

        ; Pick tool for Z homing
        {if is_extruder_used[0]}T0 S1 L2 D0
        {elsif is_extruder_used[1]}T1 S1 L2 D0
        {elsif is_extruder_used[2]}T2 S1 L2 D0
        {elsif is_extruder_used[3]}T3 S1 L2 D0
        {elsif is_extruder_used[4]}T4 S1 L2 D0
        {elsif is_extruder_used[5]}T5 S1 L2 D0
        {elsif is_extruder_used[6]}T6 S1 L2 D0
        {elsif is_extruder_used[7]}T7 S1 L2 D0
        {endif}

        M104 S120

        ; Home Z
        G28 Z

        G0 Z40 F10000
        M190 R{first_layer_bed_temperature[initial_tool]} ; wait for bed temp
        ; try picking tools used in print
        G1 F10000

        {local perimeter_flow_rate = 1.0 * (external_perimeter_speed[current_extruder] > 0 ? external_perimeter_speed[current_extruder] : (perimeter_speed[current_extruder] > 0 ? perimeter_speed[current_extruder] : 100)) * (layer_height * (external_perimeter_extrusion_width[current_extruder] - layer_height) + 3.14159 * (layer_height/2) * (layer_height/2))}

        {if (is_extruder_used[0] and filament_type[0] != "TPU")}M574 S0 V35 T{temperature[0]} F{ (filament_max_volumetric_speed[0] > 0 ? min(perimeter_flow_rate, filament_max_volumetric_speed[0]) : perimeter_flow_rate ) / (3.14159 / 4 * filament_diameter[0] * filament_diameter[0]) }{endif}
        {if (is_extruder_used[1] and filament_type[1] != "TPU")}M574 S1 V35 T{temperature[1]} F{ (filament_max_volumetric_speed[1] > 0 ? min(perimeter_flow_rate, filament_max_volumetric_speed[1]) : perimeter_flow_rate ) / (3.14159 / 4 * filament_diameter[1] * filament_diameter[1]) }{endif}
        {if (is_extruder_used[2] and filament_type[2] != "TPU")}M574 S2 V35 T{temperature[2]} F{ (filament_max_volumetric_speed[2] > 0 ? min(perimeter_flow_rate, filament_max_volumetric_speed[2]) : perimeter_flow_rate ) / (3.14159 / 4 * filament_diameter[2] * filament_diameter[2]) }{endif}
        {if (is_extruder_used[3] and filament_type[3] != "TPU")}M574 S3 V35 T{temperature[3]} F{ (filament_max_volumetric_speed[3] > 0 ? min(perimeter_flow_rate, filament_max_volumetric_speed[3]) : perimeter_flow_rate ) / (3.14159 / 4 * filament_diameter[3] * filament_diameter[3]) }{endif}
        {if (is_extruder_used[4] and filament_type[4] != "TPU")}M574 S4 V35 T{temperature[4]} F{ (filament_max_volumetric_speed[4] > 0 ? min(perimeter_flow_rate, filament_max_volumetric_speed[4]) : perimeter_flow_rate ) / (3.14159 / 4 * filament_diameter[4] * filament_diameter[4]) }{endif}
        {if (is_extruder_used[5] and filament_type[5] != "TPU")}M574 S5 V35 T{temperature[5]} F{ (filament_max_volumetric_speed[5] > 0 ? min(perimeter_flow_rate, filament_max_volumetric_speed[5]) : perimeter_flow_rate ) / (3.14159 / 4 * filament_diameter[5] * filament_diameter[5]) }{endif}
        {if (is_extruder_used[6] and filament_type[6] != "TPU")}M574 S6 V35 T{temperature[6]} F{ (filament_max_volumetric_speed[6] > 0 ? min(perimeter_flow_rate, filament_max_volumetric_speed[6]) : perimeter_flow_rate ) / (3.14159 / 4 * filament_diameter[6] * filament_diameter[6]) }{endif}
        {if (is_extruder_used[7] and filament_type[7] != "TPU")}M574 S7 V35 T{temperature[7]} F{ (filament_max_volumetric_speed[7] > 0 ? min(perimeter_flow_rate, filament_max_volumetric_speed[7]) : perimeter_flow_rate ) / (3.14159 / 4 * filament_diameter[7] * filament_diameter[7]) }{endif}

        G427 R2 P3 ; Calibrate all used and mapped tools

        T{initial_tool} S1 L0 D0

        {if chamber_minimal_temperature[initial_tool] != 0}
          ; Min chamber temp section
          M104 S0
          M140 S115 ; set bed temp for chamber heating
          G1 Z10 F720 ; set bed position
          G1 X242 Y0 F4800 ; set print head position
          M191 S{chamber_minimal_temperature[initial_tool]} ; wait for minimal chamber temp
          M141 S{chamber_temperature[initial_tool]} ; set nominal chamber temp
          M140 S{first_layer_bed_temperature[initial_tool]} ; set bed temp
        {endif}

        {if first_layer_bed_temperature[initial_tool] <= 60}M106 S70{endif}
        G0 Z40 F10000
        M104 S{if (custom_parameter_filament_idle_temperature[initial_tool] == 0)}100{else}{custom_parameter_filament_idle_temperature[initial_tool]}{endif}
        M190 R{first_layer_bed_temperature[initial_tool]} ; wait for bed temp
        M107

        G29 G ; absorb heat

        M109 S{probe_temp} ; wait for temp

        ;
        ; MBL
        ;
        M84 E ; turn off E motor
        G29 P1 ; invalidate mbl & probe print area
        ;G29 P1 X150 Y0 W100 H20 C ; probe near purge place
        G29 P3.2 ; interpolate mbl probes
        G29 P3.13 ; extrapolate mbl outside probe area
        G29 A ; activate mbl

        G0 Z1 ; add Z clearance

        M569 S0 E ; set spreadcycle mode for extruder
        G92 E0 ; reset extruder position

        ;-------Clean and prime initial tool------
        {
        local speed_tc = min(travel_speed, 350.0) * 60;
        local deretract_length = 1.6;
        local target_temp = first_layer_temperature[initial_tool];
        local eject_temp = max(160,target_temp - 60);
        local filament_area = 3.14 * filament_diameter[initial_tool] * filament_diameter[initial_tool] / 4.0;
        local purge_mm = 12 / filament_area;
        local purge_speed_fast = 60.0 * min(6,max(1.5,0.6*filament_max_volumetric_speed[initial_tool]/filament_area));
        local purge_speed_slow = 60.0 * min(3,max(1.5,0.3*filament_max_volumetric_speed[initial_tool]/filament_area));
        local tc_deretract_speed = 60.0 * min(20,max(5,deretract_speed[initial_tool]));
        }

        {if (custom_parameter_filament_filament_flush_volumetric_speed[initial_tool] / filament_area) > 0}
          {purge_speed_fast = 60.0 * min(10,max(1,(custom_parameter_filament_filament_flush_volumetric_speed[initial_tool] / filament_area)))}
          {purge_speed_slow = 60.0 * min(10,max(1,(custom_parameter_filament_filament_flush_volumetric_speed[initial_tool] / filament_area) / 2))}
        {endif}

        {if filament_type[initial_tool]=="TPU"}
          {tc_deretract_speed = 60*10}
        {endif}

        M83

        G1 F{speed_tc}

        M204 S7000

        M104 S{eject_temp+15}

        G12 S90 ; enter cleaner

        M109 C{eject_temp} ; Skip residency

        M104 S{target_temp + 5}

        G12 S30 ; eject poop

        M106 S{255 / 100 * max_fan_speed[initial_tool]}

        M906 P1 ; Set extruder current

        M109 C{target_temp}

        M104 S{target_temp}

        G1 E{deretract_length} F{tc_deretract_speed}

        G91 ; use relative coordinates
        M83 ; extruder relative mode
        M572 S0.0 ; Disable PressureAdvance

        ;FLUSH_START
        G1 X-0.2 E{0.15 * purge_mm} F{0.20 / (0.15 * purge_mm) * purge_speed_slow}
        G1 X0.40 E{0.30 * purge_mm} F{0.40 / (0.30 * purge_mm) * purge_speed_slow}
        G1 Y-0.5 E{0.10 * purge_mm} F{0.50 / (0.10 * purge_mm) * purge_speed_slow}
        G1 Y-0.5 E{0.10 * purge_mm} F{0.50 / (0.10 * purge_mm) * purge_speed_fast}
        G1 X-0.4 E{0.20 * purge_mm} F{0.40 / (0.20 * purge_mm) * purge_speed_fast}
        G1 Y1.00 E{0.18 * purge_mm} F{1.00 / (0.18 * purge_mm) * purge_speed_fast}
        G1 X0.20 E{0.05 * purge_mm} F{0.20 / (0.05 * purge_mm) * purge_speed_fast}
        G1 Y0.20 E{0.02 * purge_mm} F{0.20 / (0.02 * purge_mm) * purge_speed_slow}
        ;FLUSH_END

        M400
        M906 P0 ; Revert extruder current

        G1 Y0 E-{retract_length[initial_tool] + 0.04} F{retract_speed[initial_tool] * 60}
        {e_retracted[initial_tool] = retract_length[initial_tool] + retract_restart_extra_toolchange[initial_tool]}

        G1 Y5 F{speed_tc}

        {tool_init[initial_tool] = 1}
        G90 ; use absolute coordinates
        M83 ; extruder relative mode
        G12 S91 ; Exit cleaning station
        G0 Z1.2 ; Lift
        G4 S0
        M221 S100 ; set flow to 100%
