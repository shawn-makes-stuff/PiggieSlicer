kind: printer
id: 9bqqgh+t1J+DKTC5Ety0PQ
variants:
- condition: printer.model == "FELIX Pro L 3.0"
  name: FELIX Pro L 3.0
  id: VFLLVjizp863pliM33VE4Q
  variants:
  - condition: tool.nozzle_diameter == 0.25 and printer.tool_count == 2
    id: mLZCOl8zaAPUF9EtdcFT8Q
    values:
      bed_custom_model: ''
      bed_custom_texture: ''
      before_layer_gcode: |
        ;BEFORE_LAYER_CHANGE
        ;[layer_z]
        G92 E0
      toolchange_gcode: ''
      cooling_tube_length: 5
      cooling_tube_retraction: 91.5
      default_print: FELIX Plastic Normal @ 0.25mm
      remaining_times: true
      machine_limits_usage: emit_to_gcode
      extra_loading_move: -2
      extruder_clearance_height: 36
      extruder_clearance_radius: 65
      extruder_offset:
      - '0x0'
      - '0x0'
      gcode_flavor: repetier
      high_current_on_filament_swap: false
      layer_gcode: ''
      end_gcode: |
        ; FELIX [printer_model] - OrcaSlicer End G-code - V1.00
        G92 E0
        G1 E-8 F{retract_speed[0]*60}
        G92 E0
        G91
        G1 Z20 F{travel_speed*60}
        G90
        G1 X5 Y5 F6000
        M104 S0 T0
        M104 S0 T1
        M140 S0
        M107
        M84
      machine_max_acceleration_e:
      - 5000.0
      - 5000.0
      machine_max_acceleration_extruding:
      - 2000.0
      - 2000.0
      machine_max_acceleration_retracting:
      - 5000.0
      - 5000.0
      machine_max_acceleration_travel:
      - 3000.0
      - 3000.0
      machine_max_acceleration_x:
      - 2000.0
      - 2000.0
      machine_max_acceleration_y:
      - 2000.0
      - 2000.0
      machine_max_acceleration_z:
      - 300.0
      - 200.0
      machine_max_jerk_e:
      - 2.5
      - 2.5
      machine_max_jerk_x:
      - 9.0
      - 9.0
      machine_max_jerk_y:
      - 9.0
      - 9.0
      machine_max_jerk_z:
      - 0.2
      - 0.4
      machine_max_junction_deviation:
      - 0.01
      machine_max_feedrate_e:
      - 60.0
      - 60.0
      machine_max_feedrate_x:
      - 800.0
      - 800.0
      machine_max_feedrate_y:
      - 800.0
      - 800.0
      machine_max_feedrate_z:
      - 50.0
      - 50.0
      machine_min_extruding_rate:
      - 0.0
      - 0.0
      machine_min_travel_rate:
      - 0.0
      - 0.0
      pause_print_gcode: |
        M400 U1
      start_gcode: |
        ; FELIX [printer_model] - OrcaSlicer Start G-code - V1.00
        M107
        M190 S[first_layer_bed_temperature[initial_extruder]]
        {if is_extruder_used[0]}M104 T0 S{first_layer_temperature[0]}
        {endif}{if is_extruder_used[1]}M104 T1 S{first_layer_temperature[1]}
        {endif}{if is_extruder_used[0]}M109 T0 S{first_layer_temperature[0]}
        {endif}{if is_extruder_used[1]}M109 T1 S{first_layer_temperature[1]}
        {endif}G28
        G90
        T[initial_tool]
      parking_pos_retraction: 92
      bed_shape:
      - '0x0'
      - 300x0
      - 300x400
      - '0x400'
      max_print_height: 400
      printer_notes: ''
      between_objects_gcode: ''
      single_extruder_multi_material: false
      template_custom_gcode: ''
      use_firmware_retraction: false
      use_relative_e_distances: true
      z_offset: 0
      thumbnails: 48x48/PNG, 300x300/PNG
      custom_parameters_printer: '{"support_air_filtration": true}'
