kind: printer
id: lfThWnyAlofFN9CJHi3RQQ
variants:
- condition: printer.model == "KINARB 2HB"
  name: KINARB 2HB
  id: 7vaAA7FJVuOIpj9SLVWPtQ
  variants:
  - condition: tool.nozzle_diameter == 0.4 and printer.tool_count == 2
    id: gtqAEgaCwXYGmO636jtesQ
    values:
      bed_custom_model: ''
      bed_custom_texture: ''
      before_layer_gcode: |
        ;BEFORE_LAYER_CHANGE
        ;[layer_z]
        G92 E0
      toolchange_gcode: |-
        ; --- TOOL CHANGE (placeholder) ---
        T[next_extruder]
        G92 E0
      cooling_tube_length: 0
      cooling_tube_retraction: 0
      default_print: 0.2mm Draft @Pragostroj 0.4
      remaining_times: true
      machine_limits_usage: emit_to_gcode
      extra_loading_move: 0
      extruder_clearance_height: 36
      extruder_clearance_radius: 65
      extruder_offset:
      - '0x0'
      - '0x0'
      gcode_flavor: reprapfirmware
      high_current_on_filament_swap: false
      layer_gcode: |-
        ;AFTER_LAYER_CHANGE
        ;[layer_z]
      end_gcode: |-
        {if max_layer_z < max_print_height}G1 Z{z_offset+min(max_layer_z+1, max_print_height)} F720 ; Move print head up{endif}
        G1 X0 Y200 F3600 ; park
        {if max_layer_z < max_print_height}G1 Z{z_offset+min(max_layer_z+49, max_print_height)} F720 ; Move print head further up{endif}
        M221 S100 ; reset flow
        M900 K0 ; reset LA
        M104 S0 ; turn off temperature
        M140 S0 ; turn off heatbed
        M107 ; turn off fan
        M84 ; disable motors
      machine_max_acceleration_e:
      - 5000.0
      - 5000.0
      machine_max_acceleration_extruding:
      - 500.0
      - 20000.0
      machine_max_acceleration_retracting:
      - 5000.0
      - 5000.0
      machine_max_acceleration_travel:
      - 2500.0
      - 20000.0
      machine_max_acceleration_x:
      - 2000.0
      - 20000.0
      machine_max_acceleration_y:
      - 2000.0
      - 20000.0
      machine_max_acceleration_z:
      - 200.0
      - 200.0
      machine_max_jerk_e:
      - 2.5
      - 2.5
      machine_max_jerk_x:
      - 10.0
      - 9.0
      machine_max_jerk_y:
      - 10.0
      - 9.0
      machine_max_jerk_z:
      - 0.2
      - 0.4
      machine_max_junction_deviation:
      - 0.0
      - 0.0
      machine_max_feedrate_e:
      - 500.0
      - 25.0
      machine_max_feedrate_x:
      - 200.0
      - 200.0
      machine_max_feedrate_y:
      - 200.0
      - 200.0
      machine_max_feedrate_z:
      - 12.0
      - 12.0
      machine_min_extruding_rate:
      - 0.0
      - 0.0
      machine_min_travel_rate:
      - 0.0
      - 0.0
      pause_print_gcode: M601
      start_gcode: |-
        ; --- DUAL-HEAD START G-CODE (placeholder, please verify with your RRF config) ---
        M104 S{first_layer_temperature[0]} T0 ; preheat T0 (no tool select)
        M104 S{first_layer_temperature[1]} T1 ; preheat T1 (no tool select)
        M116 ; wait for all temps
        G1 Z10 F6000 ;Move the platform down 10mm
        G1 X60 Y10 F10000
        G1 Z0.25 F6000 ;Move the platform down 0,25mm
        G92 E0
        G1 X200 E20 F1000
        G1 X450 E40 F1000
        G92 E0
      parking_pos_retraction: 0
      bed_shape:
      - '0x0'
      - 540x0
      - 540x450
      - '0x450'
      max_print_height: 500
      printer_notes: ''
      between_objects_gcode: ''
      single_extruder_multi_material: false
      template_custom_gcode: ''
      use_firmware_retraction: false
      use_relative_e_distances: true
      z_offset: 0
