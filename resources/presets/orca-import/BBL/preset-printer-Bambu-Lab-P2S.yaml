            M106 P10 S{(custom_parameter_filament_first_x_layer_fan_speed[next_filament_id] + (custom_parameter_filament_additional_cooling_fan_speed[next_filament_id] - custom_parameter_filament_first_x_layer_fan_speed[next_filament_id]) * (layer_num + 1 - custom_parameter_filament_close_additional_fan_first_x_layers[next_filament_id]) / max(custom_parameter_filament_additional_fan_full_speed_layer[next_filament_id] - custom_parameter_filament_close_additional_fan_first_x_layers[next_filament_id], 1)) * 255.0/100.0}
