              M104 S0 T0
              M104 S0 T1
              M562 P1 E0 B1
              M562 P2 E0 B1
              M18 E
              M400 P200
              M1028 S1
              M972 S19 P0   ;heatbed detection
              M972 S31 P0   ;toolhead camera dirt detection
              M1002 gcode_claim_action : 73 ; Build plate alignment detection
              M972 S34 P0   ;print plate deviation detection
              M1028 S0
              M562 P1 E1 B1
              M562 P2 E1 B1
              M17 D

          ;M400
          M104 S{first_layer_temperature[initial_extruder]} T{custom_parameter_filament_filament_map[initial_extruder] % 2} ; rise temp in advance

          {if max_print_z >= 145}
            G151 P{custom_parameter_filament_filament_map[initial_extruder] % 2} M ; plug the heat nozzle
            M1002 gcode_claim_action : 75 ;  Detect obstacles at the botton of the heated bed
            G3811 Z{max_print_z}  ; Detect obstacles at the bottom of the heated bed
          {endif}
        ;===== detection end =====

        ;===== prepare print temperature and material ==========
          M104 S{first_layer_temperature[initial_extruder]-40} A ; rise temp in advance
          M400
          M211 X0 Y0 Z0 ;turn off soft endstop
          M975 S1 ; turn on input shaping

          G29.2 S0 ; avoid invalid abl data
          G150.3
        {if ((filament_type[initial_extruder] == "PLA") || (filament_type[initial_extruder] == "PLA-CF") || (filament_type[initial_extruder] == "PETG")) && (nozzle_diameter_at_nozzle_id[initial_nozzle_id] == 0.2)}
        M620.10 A0 F74.8347 H{nozzle_diameter_at_nozzle_id[initial_nozzle_id]} T{flush_temperatures[initial_extruder]} P{first_layer_temperature[initial_extruder]} S1
        M620.10 A1 F74.8347 H{nozzle_diameter_at_nozzle_id[initial_nozzle_id]} T{flush_temperatures[initial_extruder]} P{first_layer_temperature[initial_extruder]} S1
        {else}
        M620.10 A0 F{flush_volumetric_speeds[initial_extruder]/2.4053*60} H{nozzle_diameter_at_nozzle_id[initial_nozzle_id]} T{flush_temperatures[initial_extruder]} P{first_layer_temperature[initial_extruder]} S1
        M620.10 A1 F{flush_volumetric_speeds[initial_extruder]/2.4053*60} H{nozzle_diameter_at_nozzle_id[initial_nozzle_id]} T{flush_temperatures[initial_extruder]} P{first_layer_temperature[initial_extruder]} S1
        {endif}

         M620.11 P0 L0 I[initial_extruder] B{initial_no_support_hotend} E0
         M620.11 K0 I[initial_extruder] B{initial_no_support_hotend} R0

          M620 S[initial_extruder]A H{initial_no_support_hotend} B   ; switch material if AMS exist
          M620.22 I[initial_extruder] P1    ; enable remote extruder runout auto purge.
          M1002 gcode_claim_action : 4
          M1002 set_filament_type:UNKNOWN
          M400
          T[initial_extruder] H{initial_no_support_hotend}
          M400
          M628 S0
          M629
          M400
          M1002 set_filament_type:{filament_type[initial_extruder]}
          M621 S[initial_extruder]A B
          M104 S{first_layer_temperature[initial_extruder]}
          M400
          M106 P1 S0
          M400
          G29.2 S1
        ;===== prepare print temperature and material ==========

        ;===== auto extrude cali start =========================
          M975 S1
          M1002 judge_flag extrude_cali_flag
          M622 J0
            M983.3 F{filament_max_volumetric_speed[initial_extruder]/2.4} A0.4 ; cali dynamic extrusion compensation
          M623

          M622 J1
            M1002 set_filament_type:{filament_type[initial_extruder]}
            M1002 gcode_claim_action : 8
            M109 S{temperature[initial_extruder]}
            G90
            M83
            M983.3 F{filament_max_volumetric_speed[initial_extruder]/2.4} A0.4 ; cali dynamic extrusion compensation
            M400
            M106 P1 S255
            M400 S5
            M106 P1 S0
            G150.3
          M623

          M622 J2
            M1002 set_filament_type:{filament_type[initial_extruder]}
            M1002 gcode_claim_action : 8
            M109 S{temperature[initial_extruder]}
            G90
            M83
            M983.3 F{filament_max_volumetric_speed[initial_extruder]/2.4} A0.4 ; cali dynamic extrusion compensation
            M400
            M106 P1 S255
            M400 S5
            M106 P1 S0
            G150.3
          M623
        ;===== auto extrude cali end =========================

          {if hold_chamber_temp_for_flat_print}
            G150.3
            M1002 gcode_claim_action : 58
            M104 S{first_layer_temperature[initial_extruder]}
            {if first_layer_bed_temperature[initial_extruder] > 89}
                {if overall_chamber_temperature < 40}
                    M1030 S1200
                    SYNC R0 T1200
                {else}
                    M1030 S600
                    SYNC R0 T600
                {endif}
            {else}
                M1030 S300
                SYNC R0 T300
            {endif}
            M1030 C
          {endif}

          {if filament_type[initial_extruder] == "TPU" || filament_type[initial_extruder] == "PVA"}
          {else}
            M83
            G1 E-3 F1800
            M400 P500
          {endif}
          G150.2
          G150.1 F8000
          G150.2
          G150.1 F8000

          G91
          G1 Y-16 F12000 ; move away from the trash bin
          G90
          M400

          M104 S{first_layer_temperature[initial_extruder]-80} A

        ;===== wipe right nozzle start =====
          M1002 gcode_claim_action : 14
          G150 T{first_layer_temperature[initial_extruder]}
          M400
        ;===== wipe left nozzle end =====

        {if filament_type[initial_extruder] == "PC"}
          M109 S170 A
        {else}
          M109 S140 A
        {endif}
          M106 S0 ; turn off fan , too noisy
          G91
          G1 Z5 F1200
          G90
          M400
          G150.1

        {if (overall_chamber_temperature >= 40)}
        M1002 gcode_claim_action : 49
        M191 S{overall_chamber_temperature} ; wait for chamber temp
        {endif}

        ;===== z ofst cali start =====
          M190 S[first_layer_bed_temperature[initial_extruder]]; ensure bed temp
          G383 O0 M1 T140
          M400
        ;===== z ofst cali end =====
        G90
        M83
        G0 Y200 F18000

        ;===== bed leveling ==================================
          M1002 gcode_claim_action : 54
          M190 S[first_layer_bed_temperature[initial_extruder]]; ensure bed temp
          M109 S140 A
          M106 S0 ; turn off fan , too noisy
          M1002 judge_flag g29_before_print_flag
          M622 J1
            M1002 gcode_claim_action : 1
            {if hold_chamber_temp_for_flat_print}
              G29 H R
            {else}
              G29 A1 X{first_layer_print_min[0]} Y{first_layer_print_min[1]} I{first_layer_print_size[0]} J{first_layer_print_size[1]} R
            {endif}
            M400
          M623

          M622 J2
            M1002 gcode_claim_action : 1
            {if hold_chamber_temp_for_flat_print}
              G29 H R
            {else}
              G29 A2 X{first_layer_print_min[0]} Y{first_layer_print_min[1]} I{first_layer_print_size[0]} J{first_layer_print_size[1]} R
            {endif}
            M400
          M623

          M622 J0
            G28 R
          M623
          G29.2 S1
        ;===== bed leveling end ================================

        ; cali eddy z pos
        ;G383.13 T1 C1

        M104 S{first_layer_temperature[initial_extruder]} A
        ;===== mech mode sweep start =====
          M1002 gcode_claim_action : 3
          G90
          G1 X128 Y128 F20000
          G1 Z5 F1200
          M400 P200
          M970.3 Q1 A5 K0 O1
          M974 Q1 S2 P0
          M970.3 Q0 A7 K0 O1
          M970.2 Q0 W73 K1 Z0.01
          M974 Q0 S2 P0
          M975 S1
          M400
        ;===== mech mode sweep end =====

        M104 S{first_layer_temperature[initial_extruder]} A
        G150.3

        ;===== xy ofst cali start =====
        M1002 judge_flag auto_cali_toolhead_offset_flag

        M622 J0
            M1012.5 N1 R1
        M623

        M622 J1
            M1002 gcode_claim_action : 39
            M141 S0
            M620.17 T0 S{first_layer_temperature[(first_non_support_filaments[0] != -1 ? first_non_support_filaments[0] : (first_filaments[0] != -1 ? first_filaments[0] : 0))]} L{(first_non_support_filaments[0] != -1 ? first_non_support_filaments[0] : (first_filaments[0] != -1 ? first_filaments[0] : 0))}
            M620.17 T1 S{first_layer_temperature[(first_non_support_filaments[1] != -1 ? first_non_support_filaments[1] : (first_filaments[1] != -1 ? first_filaments[1] : 0))]} L{(first_non_support_filaments[1] != -1 ? first_non_support_filaments[1] : (first_filaments[1] != -1 ? first_filaments[1] : 0))}
            M620 D{initial_no_support_hotend}
            G383 O1 T{first_layer_temperature[initial_extruder]} L{initial_extruder}
            M141 S{overall_chamber_temperature}
        M623

        M622 J2
            M1002 gcode_claim_action : 39
            M141 S0
            M620.17 T0 S{first_layer_temperature[(first_non_support_filaments[0] != -1 ? first_non_support_filaments[0] : (first_filaments[0] != -1 ? first_filaments[0] : 0))]} L{(first_non_support_filaments[0] != -1 ? first_non_support_filaments[0] : (first_filaments[0] != -1 ? first_filaments[0] : 0))}
            M620.17 T1 S{first_layer_temperature[(first_non_support_filaments[1] != -1 ? first_non_support_filaments[1] : (first_filaments[1] != -1 ? first_filaments[1] : 0))]} L{(first_non_support_filaments[1] != -1 ? first_non_support_filaments[1] : (first_filaments[1] != -1 ? first_filaments[1] : 0))}
            M620 D{initial_no_support_hotend}
            G383.3 T{first_layer_temperature[initial_extruder]} L{initial_extruder}
            M141 S{overall_chamber_temperature}
        M623
        ;===== xy ofst cali end =====

          M104 S{first_layer_temperature[initial_extruder]} A

         G150.3 ; move to garbage can to wait for temp

        ;===== wait temperature reaching the reference value =======
          M140 S[first_layer_bed_temperature[initial_extruder]]
          M190 S[first_layer_bed_temperature[initial_extruder]]

          ;========turn off light and fans =============
          M960 S1 P0 ; turn off laser
          M960 S2 P0 ; turn off laser
          M106 S0 ; turn off cooling fan

        ;===== wait temperature reaching the reference value =======

          M1002 gcode_claim_action : 255
          M400
          M975 S1 ; turn on mech mode supression
          M983.4 S0 ; turn off deformation compensation

        ;============switch again==================
          M211 X0 Y0 Z0 ;turn off soft endstop
          G91
          G1 Z6 F1200
          G90
          M1002 set_filament_type:{filament_type[initial_extruder]}
          M620 S[initial_extruder]A H{initial_no_support_hotend} B
          M620.22 I[initial_extruder] P1    ; enable remote extruder runout auto purge.
          M400
          T[initial_extruder] H{initial_no_support_hotend}
          M400
          M628 S0
          M629
          M400
          M621 S[initial_extruder]A B
        ;============switch again==================

        ;===== for Textured PEI Plate , lower the nozzle as the nozzle was touching topmost of the texture when homing ==
          {if first_layer_bed_temperature[initial_extruder] > 70}
            {if sheet_type=="Textured PEI Plate"}
              G29.1 Z{-0.003} ; for Textured PEI Plate
            {else}
              G29.1 Z{0.017}
            {endif}
          {else}
            {if sheet_type=="Textured PEI Plate"}
              G29.1 Z{0.002} ; for Textured PEI Plate
            {else}
              G29.1 Z{0.022}
            {endif}
          {endif}

        ;===== nozzle load line ===============================
        M1002 gcode_claim_action : 51
          G29.2 S1 ; ensure z comp turn on
          G90
          M83
          M400 P50
          M500 D1
          M400 S3
          M109 S{first_layer_temperature[initial_extruder]}
          G0 X100 Y0 F24000
          M400
          ;G130 O0 X100 Y-0.4 Z0.6 F{filament_max_volumetric_speed[initial_extruder]/2/2.4053} L40 E20 D5
          G130 O0 X100 Y-0.2 Z0.6 F{filament_max_volumetric_speed[initial_extruder]/2/2.4053} L40 E12 D4
        G90
          G90
          M83
          G1 Z1
          M400
        ;===== noozle load line end ===========================
        M1002 gcode_claim_action : 0
          G29.99

        ;M993 A1 B1 C1 ; nozzle cam detection allowed.

        M620.6 I[initial_extruder] H{initial_no_support_hotend} W1 ;enable ams air printing detect


        {if (filament_type[initial_extruder] == "TPU")}
        M1015.3 S1 H{nozzle_diameter_at_nozzle_id[initial_nozzle_id]};enable tpu clog detect
        {else}
        M1015.3 S0;disable tpu clog detect
        {endif}

        {if (filament_type[initial_extruder] == "PLA") ||  (filament_type[initial_extruder] == "PETG")
         ||  (filament_type[initial_extruder] == "PLA-CF")  ||  (filament_type[initial_extruder] == "PETG-CF")}
        M1015.4 S1 K1 H{nozzle_diameter_at_nozzle_id[initial_nozzle_id]} ;enable E air printing detect
        {else}
        M1015.4 S0 K0 H{nozzle_diameter_at_nozzle_id[initial_nozzle_id]} ;disable E air printing detect
        {endif}

      parking_pos_retraction: 92
      bed_shape:
      - '0x0'
      - 256x0
      - 256x256
      - '0x256'
      max_print_height: 261
      printer_notes: ''
      between_objects_gcode: ''
      single_extruder_multi_material: true
      template_custom_gcode: ''
      use_firmware_retraction: false
      use_relative_e_distances: true
      z_offset: 0
      thumbnails: 48x48/PNG, 300x300/PNG
      custom_parameters_printer: '{"cooling_filter_enabled": false, "hotend_cooling_rate__0": 2.0, "hotend_cooling_rate__1": 2.0, "hotend_heating_rate__0": 1.5, "hotend_heating_rate__1": 1.5, "long_retractions_when_cut__0": false, "long_retractions_when_cut__1": false, "retraction_distances_when_cut__0": 18.0, "retraction_distances_when_cut__1": 18.0, "scan_first_layer": false, "support_air_filtration": false, "z_hop_types__0": 0, "z_hop_types__1": 0}'
