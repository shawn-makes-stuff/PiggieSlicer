_vendor[1] != "Bambu Lab"}{is_all_bbl_filament = false}{endif}{local has_tpu_in_first_layer = false}{if is_extruder_used[0] and filament_type[0] == "TPU"}{has_tpu_in_first_layer = true}{endif}{if is_extruder_used[1] and filament_type[1] == "TPU"}{has_tpu_in_first_layer = true}{endif}{local retraction_distance_when_ec = custom_parameter_filament_retraction_distances_when_ec[initial_extruder]}{local long_retraction_when_ec = custom_parameter_filament_long_retractions_when_ec[initial_extruder]}{local max_print_z = int(max_print_height)}{local overall_chamber_temperature = 0}{if is_extruder_used[0]}{overall_chamber_temperature = max(overall_chamber_temperature, chamber_temperature[0])}{endif}{if is_extruder_used[1]}{overall_chamber_temperature = max(overall_chamber_temperature, chamber_temperature[1])}{endif};===== machine: H2D Pro start ======
