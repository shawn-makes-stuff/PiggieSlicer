      before_layer_gcode: ''
      toolchange_gcode: |-
        {local hotend_cooling_rate = (custom_parameter_printer_hotend_cooling_rate__0, custom_parameter_printer_hotend_cooling_rate__1)}{local hotend_heating_rate = (custom_parameter_printer_hotend_heating_rate__0, custom_parameter_printer_hotend_heating_rate__1)}{local retraction_distances_when_cut = (custom_parameter_printer_retraction_distances_when_cut__0, custom_parameter_printer_retraction_distances_when_cut__1)}{local _pm = (1, 0)}{local initial_nozzle_id = _pm[initial_extruder]}{local current_nozzle_id = _pm[current_extruder]}{local current_hotend = _pm[current_extruder]}{local initial_no_support_hotend = _pm[initial_extruder]}{local nozzle_diameter_at_nozzle_id = (nozzle_diameter[1], nozzle_diameter[0])}{local _ft0 = custom_parameter_filament_filament_flush_temp[0]}{if _ft0 == 0}{_ft0 = custom_parameter_filament_nozzle_temperature_range_high[0]}{endif}{local _ft1 = custom_parameter_filament_filament_flush_temp[1]}{if _ft1 == 0}{_ft1 = custom_parameter_filament_nozzle_temperature_range_high[1]}{endif}{local flush_temperatures = (_ft0, _ft1)}{local _fv0 = custom_parameter_filament_filament_flush_volumetric_speed[0]}{if _fv0 == 0}{_fv0 = filament_max_volumetric_speed[0]}{endif}{local _fv1 = custom_parameter_filament_filament_flush_volumetric_speed[1]}{if _fv1 == 0}{_fv1 = filament_max_volumetric_speed[1]}{endif}{local flush_volumetric_speeds = (_fv0, _fv1)}{local retraction_distance_when_ec = custom_parameter_filament_retraction_distances_when_ec[initial_extruder]}{local long_retraction_when_ec = custom_parameter_filament_long_retractions_when_ec[initial_extruder]}{local _rd_cut = (14, 14)}{local _lr_cut = (true, true)}{local retraction_distance_when_cut = _rd_cut[initial_extruder]}{if not is_nil(custom_parameter_filament_filament_retraction_distances_when_cut[initial_extruder])}{retraction_distance_when_cut = custom_parameter_filament_filament_retraction_distances_when_cut[initial_extruder]}{endif}{local long_retraction_when_cut = _lr_cut[initial_extruder]}{if not is_nil(custom_parameter_filament_filament_long_retractions_when_cut[initial_extruder])}{long_retraction_when_cut = custom_parameter_filament_filament_long_retractions_when_cut[initial_extruder]}{endif}{local wipe_tower_center_pos_valid = false}{local wipe_tower_center_pos_x = 0}{local wipe_tower_center_pos_y = 0};======== H2C filament_change ========
        ;===== 20260413 =====
        M993 A2 B2 C2 ; nozzle cam detection allow status save.
        M993 A0 B0 C0 ; nozzle cam detection not allowed.

        {if (filament_type[next_filament_id] == "PLA") ||  (filament_type[next_filament_id] == "PETG")
         ||  (filament_type[next_filament_id] == "PLA-CF")  ||  (filament_type[next_filament_id] == "PETG-CF")}
        M1015.4 S1 K0 ;disable E air printing detect
        {else}
        M1015.4 S0 ; disable E air printing detect
        {endif}

        M620 S[next_filament_id]A H[next_hotend]
        M1002 gcode_claim_action : 4
        M204 S9000

        G1 Z{max_layer_z + 3.0} F1200

        M400
        M106 P1 S0
        M106 P2 S0

        {if toolchange_count == 2}
        ; get travel path for change filament
        ;M620.1 X[travel_point_1_x] Y[travel_point_1_y] F21000 P0
        ;M620.1 X[travel_point_2_x] Y[travel_point_2_y] F21000 P1
        ;M620.1 X[travel_point_3_x] Y[travel_point_3_y] F21000 P2
        {endif}

        {if wipe_tower_center_pos_valid}
            M620.14 X{wipe_tower_center_pos_x} Y{wipe_tower_center_pos_y}
        {else}
            M620.14 X95.5 Y336
        {endif}

        {if ((filament_type[current_extruder] == "PLA") || (filament_type[current_extruder] == "PLA-CF") || (filament_type[current_extruder] == "PETG")) && (nozzle_diameter_at_nozzle_id[current_nozzle_id] == 0.2)}
        M620.10 A0 F74.8347 L[flush_length] H{nozzle_diameter_at_nozzle_id[current_nozzle_id]} T{flush_temperatures[current_extruder]} P[old_filament_temp] S1
        {else}
        M620.10 A0 F{flush_volumetric_speeds[current_extruder]/2.4053*60*0.8} L[flush_length] H{nozzle_diameter_at_nozzle_id[current_nozzle_id]} T{flush_temperatures[current_extruder]} P[old_filament_temp] S1
        {endif}

        {if ((filament_type[next_filament_id] == "PLA") || (filament_type[next_filament_id] == "PLA-CF") || (filament_type[next_filament_id] == "PETG")) && (nozzle_diameter_at_nozzle_id[next_nozzle_id] == 0.2)}
        M620.10 A1 F74.8347 L[flush_length] H{nozzle_diameter_at_nozzle_id[next_nozzle_id]} T{flush_temperatures[next_filament_id]} P[new_filament_temp] S1
        {else}
        M620.10 A1 F{flush_volumetric_speeds[next_filament_id]/2.4053*60*0.8} L[flush_length] H{nozzle_diameter_at_nozzle_id[next_nozzle_id]} T{flush_temperatures[next_filament_id]} P[new_filament_temp] S1
        {endif}

        {if long_retraction_when_cut}
        M620.11 P1 I[current_extruder] B{current_hotend} E-{retraction_distance_when_cut} F{max((flush_volumetric_speeds[current_extruder]/2.4053*60), 200)}
        {else}
        M620.11 P0 I[current_extruder] B{current_hotend} E0
        {endif}


        M620.15 P{custom_parameter_filament_filament_pre_cooling_temperature_nc[next_filament_id]}
        M620.15 C{new_filament_temp - custom_parameter_filament_filament_cooling_before_tower[next_filament_id]}
        M620.11 O1 T{custom_parameter_filament_filament_retract_length_nc[current_extruder]}

        {if long_retraction_when_ec}
        M620.11 K1 I[current_extruder] B{current_hotend} R{retraction_distance_when_ec} F{max((flush_volumetric_speeds[current_extruder]/2.4053*60), 200)}
        {else}
        M620.11 K0 I[current_extruder] B{current_hotend} R0
        {endif}

        M620.15 C{new_filament_temp - custom_parameter_filament_filament_cooling_before_tower[next_filament_id]}

        M628 S1
        {if filament_type[current_extruder] == "TPU"}
        M620.11 S0 L0 I[current_extruder] B{current_hotend} E-{retraction_distances_when_cut[current_extruder]} F{max((flush_volumetric_speeds[current_extruder]/2.4053*60), 200)}
        {else}
        {if (filament_type[current_extruder] == "PA") || (filament_type[current_extruder] == "PA-GF")}
