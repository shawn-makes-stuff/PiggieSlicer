        ; update layer progress
        M73 L{layer_num+1}
        M991 S0 P{layer_num} ;notify layer change
        G92 E0
      end_gcode: |+
        {local _pm = (1, 0)}{local initial_nozzle_id = _pm[initial_extruder]}{local current_nozzle_id = _pm[current_extruder]}{local current_hotend = _pm[current_extruder]}{local initial_no_support_hotend = _pm[initial_extruder]}{local _fv0 = custom_parameter_filament_filament_flush_volumetric_speed[0]}{if _fv0 == 0}{_fv0 = filament_max_volumetric_speed[0]}{endif}{local _fv1 = custom_parameter_filament_filament_flush_volumetric_speed[1]}{if _fv1 == 0}{_fv1 = filament_max_volumetric_speed[1]}{endif}{local flush_volumetric_speeds = (_fv0, _fv1)}{local retraction_distance_when_ec = custom_parameter_filament_retraction_distances_when_ec[initial_extruder]}{local long_retraction_when_ec = custom_parameter_filament_long_retractions_when_ec[initial_extruder]}{local _rd_cut = (14, 14)}{local _lr_cut = (true, true)}{local retraction_distance_when_cut = _rd_cut[initial_extruder]}{if not is_nil(custom_parameter_filament_filament_retraction_distances_when_cut[initial_extruder])}{retraction_distance_when_cut = custom_parameter_filament_filament_retraction_distances_when_cut[initial_extruder]}{endif}{local long_retraction_when_cut = _lr_cut[initial_extruder]}{if not is_nil(custom_parameter_filament_filament_long_retractions_when_cut[initial_extruder])}{long_retraction_when_cut = custom_parameter_filament_filament_long_retractions_when_cut[initial_extruder]}{endif};===== machine: H2C end =====
        ;====== date: 20260729 ======

        M1003 S0
        M73 P100 R0

        G392 S0 ;turn off nozzle clog detect
        M993 A0 B0 C0 ; nozzle cam detection not allowed.

        M400 ; wait for buffer to clear
        G92 E0 ; zero the extruder
        M211 Z1
        M640.2 R0

        G90
        G1 Z{max_layer_z + 0.4} F900 ; lower z a little
        M1002 judge_flag timelapse_record_flag
        M622 J1
            G150.3
            M400 ; wait all motion done
            M991 S0 P-1 ;end smooth timelapse at safe pos
            M400 S5 ;wait for last picture to be taken
        M623  ;end of "timelapse_record_flag"

        G90
        G1 Z{max_layer_z + 10} F900 ; lower z a little

        G90
        M141 S0 ; turn off chamber heating
        M140 S0 ; turn off bed
        M106 S0 ; turn off fan
        M106 P2 S0 ; turn off remote part cooling fan
        M106 P3 S0 ; turn off chamber cooling fan
        M106 P9 S0 ; turn off ext toodhead cooling fan

        ; pull back filament to AMS
        M620 S65535
        {if long_retraction_when_cut}
        M620.11 P1 I[current_extruder] B{current_hotend} E-{retraction_distance_when_cut} F{max((flush_volumetric_speeds[current_extruder]/2.4053*60), 200)}
        {else}
        M620.11 P0 I[current_extruder] B{current_hotend} E0
        {endif}

        {if long_retraction_when_ec}
        M620.11 K1 I[current_extruder] B{current_hotend} R{retraction_distance_when_ec} F{max((flush_volumetric_speeds[current_extruder]/2.4053*60), 200)}
        {else}
        M620.11 K0 I[current_extruder] B{current_hotend} R0
        {endif}

        M620.11 P1 I[current_extruder] B{current_hotend} E-14
        T65535
        G150.2
        M621 S65535

        M620 S65279
        T65279
        G150.2
        M621 S65279

        G150.3

        M104 S0 T0; turn off hotend
        M104 S0 T1; turn off hotend

        M400 ; wait all motion done
        M17 S
        M17 Z0.4 ; lower z motor current to reduce impact if there is something in the bottom
        {if (100.0 - max_layer_z/2) > 0}
            {if (max_layer_z + 100.0 - max_layer_z/2) < 320}
                G1 Z{max_layer_z + 100.0 - max_layer_z/2} F600
                G1 Z{max_layer_z + 98.0 - max_layer_z/2}
            {else}
                G1 Z320 F600
                G1 Z320
            {endif}
        {else}
            {if (max_layer_z + 4.0) < 320}
                G1 Z{max_layer_z + 4.0} F600
                G1 Z{max_layer_z + 2.0}
            {else}
                G1 Z320 F600
                G1 Z320
            {endif}
        {endif}
        M400 P100
        M17 R ; restore z current

        M220 S100  ; Reset feedrate magnitude
        M201.2 K1.0 ; Reset acc magnitude
        M73.2   R1.0 ;Reset left time magnitude
        M1002 set_gcode_claim_speed_level : 0

        M1015.4 S0 K0 ;disable air printing detect


