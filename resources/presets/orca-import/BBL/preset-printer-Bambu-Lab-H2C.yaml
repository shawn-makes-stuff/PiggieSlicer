        {else}
        M620.11 S1 L0 I[current_extruder] B{current_hotend} R10 D8 E-{retraction_distances_when_cut[current_extruder]} F{max((flush_volumetric_speeds[current_extruder]/2.4053*60), 200)}
        {endif}
        {endif}
        M629

        {if (filament_type[current_extruder] == "TPU") && (custom_parameter_filament_filament_map[current_extruder] == 2) && (nozzle_volume_types[current_nozzle_id] != "TPU High Flow")}
        M620.11 H2 C331
        {else}
        M620.11 H0
        {endif}

        {if  (nozzle_volume_types[current_nozzle_id] == "TPU High Flow") && (custom_parameter_filament_filament_map[current_extruder] == 2) && (custom_parameter_filament_filament_map[next_filament_id] == 1)}
        ;sw from R2L&TPU kit, travel run a distance for sketch TPU
        G1 X30 Y30 F5000
        M400
        G1 X300 Y30 F5000
        M400
        {endif}

        T[next_filament_id] H[next_hotend]

        ;deretract
        {if filament_type[next_filament_id] == "TPU"}
        {else}
        {if (filament_type[next_filament_id] == "PA") || (filament_type[next_filament_id] == "PA-GF")}
        ;VG1 E1 F{max(new_filament_e_feedrate, 200)}
        ;VG1 E1 F{max(new_filament_e_feedrate/2, 100)}
        {else}
        ;VG1 E4 F{max(new_filament_e_feedrate, 200)}
        ;VG1 E4 F{max(new_filament_e_feedrate/2, 100)}
        {endif}
        {endif}

        ; VFLUSH_START

        {if flush_length>41.5}
        ;VG1 E41.5 F{min(old_filament_e_feedrate,new_filament_e_feedrate)}
        ;VG1 E{flush_length-41.5} F{new_filament_e_feedrate}
        {else}
        ;VG1 E{flush_length} F{min(old_filament_e_feedrate,new_filament_e_feedrate)}
        {endif}

        SYNC T{ceil(flush_length / 125) * 5}

        ; compensate for heating and cooling
        {if flush_length > 0}
        {if flush_temperatures[next_filament_id] > new_filament_temp}
        SYNC T{(flush_temperatures[next_filament_id]-(new_filament_temp - custom_parameter_filament_filament_cooling_before_tower[next_filament_id]))/hotend_cooling_rate[custom_parameter_filament_filament_map[next_filament_id]-1]}
        SYNC T{(flush_temperatures[next_filament_id]-(new_filament_temp - custom_parameter_filament_filament_cooling_before_tower[next_filament_id]))/hotend_heating_rate[custom_parameter_filament_filament_map[next_filament_id]-1]}
        {else}
        SYNC T{(new_filament_temp - custom_parameter_filament_filament_cooling_before_tower[next_filament_id] -flush_temperatures[next_filament_id])/hotend_cooling_rate[custom_parameter_filament_filament_map[next_filament_id]-1]}
        SYNC T{(new_filament_temp - custom_parameter_filament_filament_cooling_before_tower[next_filament_id] -flush_temperatures[next_filament_id])/hotend_heating_rate[custom_parameter_filament_filament_map[next_filament_id]-1]}
        {endif}
        {endif}

        ; VFLUSH_END

        M1002 set_filament_type:{filament_type[next_filament_id]}

        M400
        M83
        {if next_filament_id < 255}


        M620.10 R{new_extruder_retracted_length}

        {if (custom_parameter_print_print_sequence == "by object" && !has_wipe_tower)}
        M628 S0 F1 L10.0
        ; VFLUSH_START
        ;VG1 E10 F[new_filament_e_feedrate]
        ; VFLUSH_END
        {else}
        M628 S0
        {endif}
        ;VM109 S[new_filament_temp]

        M629
        M400

        ;prime_tower_interface
        {if is_prime_tower_interface && custom_parameter_filament_filament_tower_interface_purge_volume[current_extruder] !=0}
        G150.1
        M620.13 W0 L{custom_parameter_filament_filament_tower_interface_purge_volume[current_extruder]} T{custom_parameter_filament_filament_tower_interface_print_temp[current_extruder]} R0.0
        {endif}
        ;prime_tower_interface

        M983.3 F{filament_max_volumetric_speed[next_filament_id]/2.4} A0.4 R{new_extruder_retracted_length}


        M400
        {if wipe_avoid_perimeter}
        G387 Y320 J1 F10000
        G1 X{wipe_avoid_pos_x} F30000
        {endif}
        G387 Y295 J1 F30000
        G387 Y265 J1 F18000
        G1 Z{max_layer_z + 3.0} F3000
        {if layer_z <= (first_layer_height + 0.001)}
        M204 S[first_layer_acceleration]
        {else}
        M204 S[default_acceleration]
        {endif}
        {else}
        G1 X[x_after_toolchange] Y[y_after_toolchange] Z[z_after_toolchange] F12000
        {endif}
        M621 S[next_filament_id]A

        M622.1 S0 ;for prev version, default skip
        M1002 judge_flag powerloss_resume_flag
        M622 J1
        M983.3 F{filament_max_volumetric_speed[next_filament_id]/2.4} A0.4 R{new_extruder_retracted_length}
        M400
        {if wipe_avoid_perimeter}
        G387 Y320 J1 F10000
        G1 X{wipe_avoid_pos_x} F30000
        {endif}
        G387 Y295 J1 F30000
        G387 Y265 J1 F18000
        G1 Z{max_layer_z + 3.0} F3000
        {if layer_z <= (first_layer_height + 0.001)}
        M204 S[first_layer_acceleration]
        {else}
        M204 S[default_acceleration]
        {endif}
        M1002 set_flag powerloss_resume_flag=0
        M623

