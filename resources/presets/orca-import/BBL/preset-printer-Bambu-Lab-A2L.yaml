        {local hotend_cooling_rate = (custom_parameter_printer_hotend_cooling_rate__0, custom_parameter_printer_hotend_cooling_rate__1)}{local hotend_heating_rate = (custom_parameter_printer_hotend_heating_rate__0, custom_parameter_printer_hotend_heating_rate__1)}{local z_hop_types = (custom_parameter_printer_z_hop_types__0, custom_parameter_printer_z_hop_types__1)}{local _pm = (0, -1)}{local initial_nozzle_id = _pm[initial_extruder]}{local current_nozzle_id = _pm[current_extruder]}{local current_hotend = _pm[current_extruder]}{local initial_no_support_hotend = _pm[initial_extruder]}{local nozzle_diameter_at_nozzle_id = (nozzle_diameter[0], 0)}{local _ft0 = custom_parameter_filament_filament_flush_temp[0]}{if _ft0 == 0}{_ft0 = custom_parameter_filament_nozzle_temperature_range_high[0]}{endif}{local flush_temperatures = (_ft0, 0)}{local _fv0 = custom_parameter_filament_filament_flush_volumetric_speed[0]}{if _fv0 == 0}{_fv0 = filament_max_volumetric_speed[0]}{endif}{local flush_volumetric_speeds = (_fv0, 0)}{local _rd_cut = (18, -1)}{local _lr_cut = (false, -1)}{local retraction_distance_when_cut = _rd_cut[initial_extruder]}{if not is_nil(custom_parameter_filament_filament_retraction_distances_when_cut[initial_extruder])}{retraction_distance_when_cut = custom_parameter_filament_filament_retraction_distances_when_cut[initial_extruder]}{endif}{local long_retraction_when_cut = _lr_cut[initial_extruder]}{if not is_nil(custom_parameter_filament_filament_long_retractions_when_cut[initial_extruder])}{long_retraction_when_cut = custom_parameter_filament_filament_long_retractions_when_cut[initial_extruder]}{endif};======== A2L filament_change gcode ==========
