              G29 R
            {else}
              {if (first_layer_bed_temperature[initial_extruder] > 35)}
                G29 A2 X{first_layer_print_min[0]} Y{first_layer_print_min[1]} I{first_layer_print_size[0]} J{first_layer_print_size[1]} O1 R
              {else}
                G29 A2 X{first_layer_print_min[0]} Y{first_layer_print_min[1]} I{first_layer_print_size[0]} J{first_layer_print_size[1]} O R
              {endif}
            {endif}
            M400
          M623

          M622 J0
            G28 R
          M623
          G29.2 S1
        ;===== bed leveling end ================================

          M985.1 U0 E2
          M985.1 U1 E2

          M104 S{first_layer_temperature[initial_extruder]} A
          G150.3 ; move to garbage can to wait for temp

        ;===== wait temperature reaching the reference value =======
          {if hold_chamber_temp_for_flat_print && (first_layer_bed_temperature[initial_extruder] == 55)}
            M190 S65
          {else}
            M190 S[first_layer_bed_temperature[initial_extruder]] ; ensure bed temp
          {endif}

          ;========turn off light and fans =============
          M960 S1 P0 ; turn off laser
          M960 S2 P0 ; turn off laser
          M106 S0 ; turn off cooling fan

        ;===== wait temperature reaching the reference value =======

          M1002 gcode_claim_action : 255
          M400
          M975 S1 ; turn on mech mode supression

        ;===== for Textured PEI Plate , lower the nozzle as the nozzle was touching topmost of the texture when homing ==
          {if sheet_type=="Textured PEI Plate"}
            {if hold_chamber_temp_for_flat_print && (first_layer_bed_temperature[initial_extruder] == 55)}
              G29.1 Z{-0.03} ; for Textured PEI Plate first layer
            {else}
              G29.1 Z{-0.04} ; for Textured PEI Plate
            {endif}
          {else}
            G29.1 Z{-0.01}
          {endif}

        ;===== nozzle load line ===============================
        M1002 gcode_claim_action : 51
          G29.2 S1 ; ensure z comp turn on
          G90
          M83
          M400 P50
          M500 D1
          M400 S3
          M109 S{first_layer_temperature[initial_extruder]}
          G0 X145 Y0 F24000
          M400
          G130 O0 X145 Y-0.2 Z0.8 F{filament_max_volumetric_speed[initial_extruder]/2/2.4053} L40 E20 D4
          G90
          M83
          G1 Z0.2
          M400
        ;===== nozzle load line end ===========================
        M1007 S1 C1;turn on mass estimation && clear
        M1002 gcode_claim_action : 0
          G29.99

        {if (filament_type[initial_extruder] == "TPU")}
        M1015.3 S1 H{nozzle_diameter_at_nozzle_id[initial_nozzle_id]};enable tpu clog detect
        {else}
        M1015.3 S0;disable tpu clog detect
        {endif}

        {if (filament_type[initial_extruder] == "PLA") ||  (filament_type[initial_extruder] == "PETG")
         ||  (filament_type[initial_extruder] == "PLA-CF")  ||  (filament_type[initial_extruder] == "PETG-CF")}
        M1015.4 S1 K1 H{nozzle_diameter_at_nozzle_id[initial_nozzle_id]} ;enable E air printing detect
        {else}
        M1015.4 S0 K0 H{nozzle_diameter_at_nozzle_id[initial_nozzle_id]} ;disable E air printing detect
        {endif}

        M620.6 I[initial_extruder] W1 ;enable ams air printing detect

        M1010 Q0 B0.005 S0.01
        M1010 Q1 B0.002 S0.01
        M1010.1 S1
      parking_pos_retraction: 92
      bed_shape:
      - '0x0'
      - 330x0
      - 330x320
      - '0x320'
      max_print_height: 325
      printer_notes: ''
      between_objects_gcode: ''
      single_extruder_multi_material: true
      template_custom_gcode: ''
      use_firmware_retraction: false
      use_relative_e_distances: true
      z_offset: 0
      thumbnails: 48x48/PNG, 300x300/PNG
      custom_parameters_printer: '{"cooling_filter_enabled": false, "hotend_cooling_rate__0": 2.0, "hotend_cooling_rate__1": 2.0, "hotend_heating_rate__0": 2.0, "hotend_heating_rate__1": 2.0, "long_retractions_when_cut__0": false, "long_retractions_when_cut__1": false, "retraction_distances_when_cut__0": 18.0, "retraction_distances_when_cut__1": 18.0, "scan_first_layer": false, "support_air_filtration": false, "z_hop_types__0": 0, "z_hop_types__1": 0}'
