        {local _pm = (0, -1)}{local initial_nozzle_id = _pm[initial_extruder]}{local current_nozzle_id = _pm[current_extruder]}{local current_hotend = _pm[current_extruder]}{local initial_no_support_hotend = _pm[initial_extruder]}{local nozzle_diameter_at_nozzle_id = (nozzle_diameter[0], 0)}{local _ft0 = custom_parameter_filament_filament_flush_temp[0]}{if _ft0 == 0}{_ft0 = custom_parameter_filament_nozzle_temperature_range_high[0]}{endif}{local flush_temperatures = (_ft0, 0)}{local _fv0 = custom_parameter_filament_filament_flush_volumetric_speed[0]}{if _fv0 == 0}{_fv0 = filament_max_volumetric_speed[0]}{endif}{local flush_volumetric_speeds = (_fv0, 0)}{local hold_chamber_temp_for_flat_print = false};M1002 set_flag extrude_cali_flag=1
