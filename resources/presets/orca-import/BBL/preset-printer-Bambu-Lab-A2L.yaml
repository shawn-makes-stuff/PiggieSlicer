        M620.10 A0 F74.8347 H{nozzle_diameter_at_nozzle_id[initial_nozzle_id]} T{flush_temperatures[initial_extruder]} P{first_layer_temperature[initial_extruder]} S1
        M620.10 A1 F74.8347 H{nozzle_diameter_at_nozzle_id[initial_nozzle_id]} T{flush_temperatures[initial_extruder]} P{first_layer_temperature[initial_extruder]} S1
