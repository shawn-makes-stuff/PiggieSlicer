  name: Bambu Lab A2L
  id: ojf9tDCpY6CtwJDCU855mQ
  variants:
  - condition: tool.nozzle_diameter == 0.2
    id: RxEhjM16XEQilH8lzFaHbQ
    values:
      bed_custom_model: ''
      bed_custom_texture: ''
      before_layer_gcode: ''
      toolchange_gcode: |
        {local hotend_cooling_rate = (custom_parameter_printer_hotend_cooling_rate__0, custom_parameter_printer_hotend_cooling_rate__1)}{local hotend_heating_rate = (custom_parameter_printer_hotend_heating_rate__0, custom_parameter_printer_hotend_heating_rate__1)}{local z_hop_types = (custom_parameter_printer_z_hop_types__0, custom_parameter_printer_z_hop_types__1)}{local _pm = (0, -1)}{local initial_nozzle_id = _pm[initial_extruder]}{local current_nozzle_id = _pm[current_extruder]}{local current_hotend = _pm[current_extruder]}{local initial_no_support_hotend = _pm[initial_extruder]}{local nozzle_diameter_at_nozzle_id = (nozzle_diameter[0], 0)}{local _ft0 = custom_parameter_filament_filament_flush_temp[0]}{if _ft0 == 0}{_ft0 = custom_parameter_filament_nozzle_temperature_range_high[0]}{endif}{local flush_temperatures = (_ft0, 0)}{local _fv0 = custom_parameter_filament_filament_flush_volumetric_speed[0]}{if _fv0 == 0}{_fv0 = filament_max_volumetric_speed[0]}{endif}{local flush_volumetric_speeds = (_fv0, 0)}{local _rd_cut = (18, -1)}{local _lr_cut = (false, -1)}{local retraction_distance_when_cut = _rd_cut[initial_extruder]}{if not is_nil(custom_parameter_filament_filament_retraction_distances_when_cut[initial_extruder])}{retraction_distance_when_cut = custom_parameter_filament_filament_retraction_distances_when_cut[initial_extruder]}{endif}{local long_retraction_when_cut = _lr_cut[initial_extruder]}{if not is_nil(custom_parameter_filament_filament_long_retractions_when_cut[initial_extruder])}{long_retraction_when_cut = custom_parameter_filament_filament_long_retractions_when_cut[initial_extruder]}{endif};======== A2L filament_change gcode ==========
        ;===== 2026/05/26 =====

        M620 S[next_filament_id]A
        M204 S9000
        {if toolchange_count > 1 && (z_hop_types[current_extruder] == 0 || z_hop_types[current_extruder] == 3)}
        G17
        G2 Z{z_after_toolchange + 0.4} I0.86 J0.86 P1 F10000 ; spiral lift a little from second lift
        {endif}

        ;nozzle_change_gcode

        G1 Z{max_layer_z + 3.0} F1200

        M400
        M106 P1 S0

        {if toolchange_count == 2}
        ; get travel path for change filament
        ;M620.1 X[travel_point_1_x] Y[travel_point_1_y] F21000 P0
        ;M620.1 X[travel_point_2_x] Y[travel_point_2_y] F21000 P1
        ;M620.1 X[travel_point_3_x] Y[travel_point_3_y] F21000 P2
        {endif}

        {if ((filament_type[current_extruder] == "PLA") || (filament_type[current_extruder] == "PLA-CF") || (filament_type[current_extruder] == "PETG") || (filament_type[current_extruder] == "PETG-CF")) && (nozzle_diameter_at_nozzle_id[current_nozzle_id] == 0.2)}
        M620.10 A0 F74.8347 L[flush_length] H{nozzle_diameter_at_nozzle_id[current_nozzle_id]} T{flush_temperatures[current_extruder]} P[old_filament_temp] S1
        {else}
        M620.10 A0 F{flush_volumetric_speeds[current_extruder]/2.4053*60} L[flush_length] H{nozzle_diameter_at_nozzle_id[current_nozzle_id]} T{flush_temperatures[current_extruder]} P[old_filament_temp] S1
        {endif}

        {if ((filament_type[next_filament_id] == "PLA") || (filament_type[next_filament_id] == "PLA-CF") || (filament_type[next_filament_id] == "PETG") || (filament_type[next_filament_id] == "PETG-CF")) && (nozzle_diameter_at_nozzle_id[next_nozzle_id] == 0.2)}
        M620.10 A1 F74.8347 L[flush_length] H{nozzle_diameter_at_nozzle_id[next_nozzle_id]} T{flush_temperatures[next_filament_id]} P[new_filament_temp] S1
        {else}
        M620.10 A1 F{flush_volumetric_speeds[next_filament_id]/2.4053*60} L[flush_length] H{nozzle_diameter_at_nozzle_id[next_nozzle_id]} T{flush_temperatures[next_filament_id]} P[new_filament_temp] S1
        {endif}

        {if long_retraction_when_cut}
        M620.11 P1 L0 I[current_extruder] E-{retraction_distance_when_cut} F{max((flush_volumetric_speeds[current_extruder]/2.4053*60), 200)}
        {else}
        M620.11 P0 L0 I[current_extruder] E0
        {endif}

        M620.11 K0 I[current_extruder] R0


        T[next_filament_id]

        ;deretract
        {if filament_type[next_filament_id] == "TPU"}
        {else}
        ;VG1 E4 F{max(new_filament_e_feedrate, 200)}
        ;VG1 E4 F{max(new_filament_e_feedrate/2, 100)}
        {endif}


        ; VFLUSH_START

        {if flush_length>41.5}
        ;VG1 E41.5 F{min(old_filament_e_feedrate,new_filament_e_feedrate)}
        ;VG1 E{flush_length-41.5} F{new_filament_e_feedrate}
        {else}
        ;VG1 E{flush_length} F{min(old_filament_e_feedrate,new_filament_e_feedrate)}
        {endif}

        SYNC T{ceil(flush_length / 80) * 7.5 + 6.5}

        ; compensate for heating and cooling
        {if flush_length > 0}
        {if flush_temperatures[next_filament_id] > new_filament_temp}
        SYNC T{(flush_temperatures[next_filament_id]-(new_filament_temp - custom_parameter_filament_filament_cooling_before_tower[next_filament_id]))/hotend_cooling_rate[custom_parameter_filament_filament_map[next_filament_id]-1]}
        SYNC T{(flush_temperatures[next_filament_id]-(new_filament_temp - custom_parameter_filament_filament_cooling_before_tower[next_filament_id]))/hotend_heating_rate[custom_parameter_filament_filament_map[next_filament_id]-1]}
        {else}
        SYNC T{(new_filament_temp - custom_parameter_filament_filament_cooling_before_tower[next_filament_id] -flush_temperatures[next_filament_id])/hotend_cooling_rate[custom_parameter_filament_filament_map[next_filament_id]-1]}
        SYNC T{(new_filament_temp - custom_parameter_filament_filament_cooling_before_tower[next_filament_id] -flush_temperatures[next_filament_id])/hotend_heating_rate[custom_parameter_filament_filament_map[next_filament_id]-1]}
        {endif}
        {endif}

        ; VFLUSH_END



        M1002 set_filament_type:{filament_type[next_filament_id]}

        M400
        M83
        {if next_filament_id < 255}
        M620.10 R{retract_length_toolchange[custom_parameter_filament_filament_map[next_filament_id]-1]}
        M628 S0
        ;VM109 S[new_filament_temp]
        M629
        M400
        M983.3 F{filament_max_volumetric_speed[next_filament_id]/2.4} A0.4 R{retract_length_toolchange[custom_parameter_filament_filament_map[next_filament_id]-1]}
        M400

        G1 Z{max_layer_z + 3.0} F3000
        {if layer_z <= (first_layer_height + 0.001)}
        M204 S[first_layer_acceleration]
        {else}
        M204 S[travel_acceleration]
        {endif}

        {else}
        G1 X[x_after_toolchange] Y[y_after_toolchange] Z[z_after_toolchange] F12000
        {endif}

        M621 S[next_filament_id]A

        M622.1 S0 ;for prev version, default skip
        M1002 judge_flag powerloss_resume_flag
        M622 J1
        M983.3 F{filament_max_volumetric_speed[next_filament_id]/2.4} A0.4 R{retract_length_toolchange[custom_parameter_filament_filament_map[next_filament_id]-1]}
        M400
        G1 Z{max_layer_z + 3.0} F3000
        {if layer_z <= (first_layer_height + 0.001)}
        M204 S[first_layer_acceleration]
        {else}
        M204 S[travel_acceleration]
        {endif}
        M1002 set_flag powerloss_resume_flag=0
        M623

        {if (filament_type[next_filament_id] == "TPU")}
        M1015.3 S1 H{nozzle_diameter_at_nozzle_id[next_nozzle_id]};enable tpu clog detect
        {else}
        M1015.3 S0;disable tpu clog detect
        {endif}

        {if (filament_type[next_filament_id] == "PLA") ||  (filament_type[next_filament_id] == "PETG")
         ||  (filament_type[next_filament_id] == "PLA-CF")  ||  (filament_type[next_filament_id] == "PETG-CF")}
        M1015.4 S1 K1 H{nozzle_diameter_at_nozzle_id[next_nozzle_id]} ;enable E air printing detect
        {else}
        M1015.4 S0 K0 H{nozzle_diameter_at_nozzle_id[next_nozzle_id]} ;disable E air printing detect
        {endif}

        {if ((filament_type[next_filament_id] == "PETG") || (filament_type[next_filament_id] == "PETG-CF") || (filament_type[next_filament_id] == "TPU") || (filament_type[next_filament_id] == "TPU-AMS"))}
          G390.7 M6 G4 C3
        {else}
          G390.7 M6 G6 C3
        {endif}

        M620.6 I[next_filament_id] W1 ;enable ams air printing detect

        ;Set the filament gear warning temperature
        {if (custom_parameter_filament_temperature_vitrification[next_filament_id] <= 50)}
            {if ((custom_parameter_filament_filament_ids[next_filament_id]=="GFA05") || (custom_parameter_filament_filament_ids[next_filament_id]=="GFA06"))}
                M142 P1 O45; set PLASILK gear warning temperature when filament change
            {else}
                M142 P1 O60; set PLA/PLACF/PLAAERO/PVA/TPU gear warning temperature when filament change
            {endif}
        {else}
            M142 P1 O100 ; set gear warning temperature when filament change
        {endif}
      cooling_tube_length: 5
      cooling_tube_retraction: 91.5
      default_print: 0.10mm Standard @BBL A2L 0.2 nozzle
      remaining_times: true
      machine_limits_usage: emit_to_gcode
      extra_loading_move: -2
      extruder_clearance_height: 25
      extruder_clearance_radius: 73
      extruder_offset:
      - '0x0'
      gcode_flavor: marlin
      high_current_on_filament_swap: false
      layer_gcode: |-
        {local _pm = (0, -1)}{local curr_y_acceleration_limit = machine_max_acceleration_y[0]};======== A2L layer_change gcode ==========
        ;===== 2026/04/29 ====
        ; update layer progress
        M201 N1 Y{curr_y_acceleration_limit}
        M73 L{layer_num+1}
        M991 S0 P{layer_num} ;notify layer change
        M1007 L1
        G92 E0
      end_gcode: ";======== A2L end gcode ==========\n;===== 2026/07/29 =====\n\nM1003 S0\nM73 P100 R0\n\nM400 ; wait for buffer to clear\nG92 E0 ; zero the extruder\n\n; pull back filament to AMS\nM620 S65535\nT65535\nG150.2\nM621 S65535\nG150.3\nG1 Y295 F3600\nG90\nG1 Z{max_layer_z + 0.4} F900 ; lower z a little\nM1002 judge_flag timelapse_record_flag\nM622 J1\n    M400 ; wait all motion done\n    M991 S0 P-1 ;end smooth timelapse at safe pos\n    M400 S5 ;wait for last picture to be taken\nM623  ;end of \"timelapse_record_flag\"\n\nM106 S0 ; turn off fan\nM106 P2 S0 ; turn off remote part cooling fan\nM106 P3 S0 ; turn off chamber cooling fan\nM142 P1 Q0 ; turn off extruder autocool\n\nM220 S100  ; Reset feedrate magnitude\nM204.2 K1.0 ; Reset acc magnitude\nM73.2 R1.0 ;Reset left time magnitude\n\nM1015.3 S0 ;disable clog detect\nM1015.4 S0 K0 ;disable air printing detect\n;=====printer finish sound=========\nM17\nM400 S1\nM1006 S1\nM1006 A53 B10 L30 C53 D10 M30 E53 F10 N30 \nM1006 A57\
        \ B10 L30 C57 D10 M30 E57 F10 N30 \nM1006 A0 B15 L0 C0 D15 M0 E0 F15 N0 \nM1006 A53 B10 L30 C53 D10 M30 E53 F10 N30 \nM1006 A57 B10 L30 C57 D10 M30 E57 F10 N30 \nM1006 A0 B15 L0 C0 D15 M0 E0 F15 N0 \nM1006 A48 B10 L30 C48 D10 M30 E48 F10 N30 \nM1006 A0 B15 L0 C0 D15 M0 E0 F15 N0 \nM1006 A60 B10 L30 C60 D10 M30 E60 F10 N30 \nM1006 W\n;=====printer finish sound=========\nM400\nM18\n\nM104 S0 ; turn off hotend\nM140 S0 ; turn off bed\nM1007 S0"
      machine_max_acceleration_e:
      - 5000.0
      - 5000.0
      machine_max_acceleration_extruding:
      - 12000.0
      - 12000.0
      machine_max_acceleration_retracting:
      - 5000.0
      - 5000.0
      machine_max_acceleration_travel:
      - 9000.0
      - 9000.0
      machine_max_acceleration_x:
      - 12000.0
      - 12000.0
      machine_max_acceleration_y:
      - 8000.0
      - 8000.0
      machine_max_acceleration_z:
      - 1500.0
      - 1500.0
      machine_max_jerk_e:
      - 3.0
      - 3.0
      machine_max_jerk_x:
      - 9.0
      - 9.0
      machine_max_jerk_y:
      - 9.0
      - 9.0
      machine_max_jerk_z:
      - 3.0
      - 3.0
      machine_max_junction_deviation:
      - 0.01
      machine_max_feedrate_e:
      - 30.0
      - 30.0
      machine_max_feedrate_x:
      - 500.0
      - 200.0
      machine_max_feedrate_y:
      - 500.0
      - 200.0
      machine_max_feedrate_z:
      - 30.0
      - 30.0
      machine_min_extruding_rate:
      - 0.0
      - 0.0
      machine_min_travel_rate:
      - 0.0
      - 0.0
      pause_print_gcode: M400 U1
      start_gcode: |
        {local _pm = (0, -1)}{local initial_nozzle_id = _pm[initial_extruder]}{local current_nozzle_id = _pm[current_extruder]}{local current_hotend = _pm[current_extruder]}{local initial_no_support_hotend = _pm[initial_extruder]}{local nozzle_diameter_at_nozzle_id = (nozzle_diameter[0], 0)}{local _ft0 = custom_parameter_filament_filament_flush_temp[0]}{if _ft0 == 0}{_ft0 = custom_parameter_filament_nozzle_temperature_range_high[0]}{endif}{local flush_temperatures = (_ft0, 0)}{local _fv0 = custom_parameter_filament_filament_flush_volumetric_speed[0]}{if _fv0 == 0}{_fv0 = filament_max_volumetric_speed[0]}{endif}{local flush_volumetric_speeds = (_fv0, 0)}{local hold_chamber_temp_for_flat_print = false};M1002 set_flag extrude_cali_flag=1
        ;M1002 set_flag g29_before_print_flag=1
        ;M1002 set_flag build_plate_detect_flag=1
        ;M1002 set_flag bed_heat_stable_wait_flag=1

        ;======== A2L start gcode==========
        ;===== 2026/07/14 =====
        T1000 O0
        M1002 gcode_claim_action : 2
        {if hold_chamber_temp_for_flat_print && (first_layer_bed_temperature[initial_extruder] == 55)}
            M140 S65
        {else}
            M140 S[first_layer_bed_temperature[initial_extruder]] ; heat heatbed first
        {endif}

        M993 A0 B0 C0 ; nozzle cam detection not allowed.
        M400

        ;=====printer start sound ===================
        M17
        M400 S1
        M1006 S1
        M1006 A53 B9 L30 C53 D9 M30 E53 F9 N30
        M1006 A56 B9 L30 C56 D9 M30 E56 F9 N30
        M1006 A61 B9 L30 C61 D9 M30 E61 F9 N30
        M1006 A53 B9 L30 C53 D9 M30 E53 F9 N30
        M1006 A56 B9 L30 C56 D9 M30 E56 F9 N30
        M1006 A61 B18 L30 C61 D18 M30 E61 F18 N30
        M1006 W
        ;=====printer start sound ===================

          M620 M ;enable remap
          G389

        ;===== avoid end stop =================
          G91
          G380 S2 Z22 F1200
          G380 S2 Z-12 F1200
          G90
        ;===== avoid end stop =================

        ;===== reset machine status =================
          M204 S10000
          M630 S0 P1
          G90
          M17 D ; reset motor current to default
          M960 S5 P1 ; turn on logo lamp
          M220 S100 ;Reset Feedrate
          M221 S100 ;Reset Flowrate
          M73.2   R1.0 ;Reset left time magnitude
          G29.1 Z{+0.0} ; clear z-trim value first
          M983.1 M1
          M982.2 S1 ; turn on cog noise reduction
          M983.4 S0
        ;===== reset machine status =================
        ;Set the filament gear warning temperature
        {if (custom_parameter_filament_temperature_vitrification[initial_extruder] <= 50)}
            {if ((custom_parameter_filament_filament_ids[initial_extruder]=="GFA05") || (custom_parameter_filament_filament_ids[initial_extruder]=="GFA06"))}
                M142 P1 O45; set PLASILK gear warning temperature when start
            {else}
                M142 P1 O60; set PLA/PLACF/PLAAERO/PVA/TPU gear warning temperature when start
            {endif}
        {else}
            M142 P1 O100 ; set gear warning temperature when start
        {endif}
        ;===== start to heat heatbed & hotend==========
          M1002 set_filament_type:{filament_type[initial_extruder]}
          M104 S140 A

          G29.2 S0 ; avoid invalid abl data

        ;===== first homing start =====
          M1002 gcode_claim_action : 13
          M105
          G28 X Z P0 T300 W
          G150.3
          G1 Z1.3 F1200
          G150.1 F16000 ; wipe mouth to avoid filament stick to heatbed
          G90
          M400
        ;===== first homing end =====


        ;===== detection start =====
        ;===== build_plate_detect_flag start =====
        M1002 judge_flag build_plate_detect_flag
        M622 S1
          G91
          G1 Z5 F1200
          G90
          G0 X15 F30000
          G0 Y319 F3000
          G91
          G1 Z-5 F1200
          G28 Z P0 T140
          G1 F1200
          G39.4
          G90
          G1 Z5 F1200
        M623
        ;===== build_plate_detect_flag end =====
        ;===== detection end =====


        ;===== hotend hotbed pre-heat start =====
          M104 S{first_layer_temperature[initial_extruder]-80} A ; rise nozzle temp in advance

          G90
          G1 Y220 F3000 ; Put away the heated bed to prevent collisions

          {if hold_chamber_temp_for_flat_print && (first_layer_bed_temperature[initial_extruder] == 55)}
              M190 S65
          {else}
              M190 S[first_layer_bed_temperature[initial_extruder]]
          {endif}
        ;===== hotend hotbed pre-heat end =====


        ;===== prepare print temperature and material ==========
          M400
          M211 X0 Y0 Z0 ;turn off soft endstop
          M975 S1 ; turn on input shaping

          G29.2 S0 ; avoid invalid abl data
          G150.3
        {if ((filament_type[initial_extruder] == "PLA") || (filament_type[initial_extruder] == "PLA-CF") || (filament_type[initial_extruder] == "PETG") || (filament_type[initial_extruder] == "PETG-CF")) && (nozzle_diameter_at_nozzle_id[initial_nozzle_id] == 0.2)}
        M620.10 A0 F74.8347 H{nozzle_diameter_at_nozzle_id[initial_nozzle_id]} T{flush_temperatures[initial_extruder]} P{first_layer_temperature[initial_extruder]} S1
        M620.10 A1 F74.8347 H{nozzle_diameter_at_nozzle_id[initial_nozzle_id]} T{flush_temperatures[initial_extruder]} P{first_layer_temperature[initial_extruder]} S1
        {else}
        M620.10 A0 F{flush_volumetric_speeds[initial_extruder]/2.4053*60} H{nozzle_diameter_at_nozzle_id[initial_nozzle_id]} T{flush_temperatures[initial_extruder]} P{first_layer_temperature[initial_extruder]} S1
        M620.10 A1 F{flush_volumetric_speeds[initial_extruder]/2.4053*60} H{nozzle_diameter_at_nozzle_id[initial_nozzle_id]} T{flush_temperatures[initial_extruder]} P{first_layer_temperature[initial_extruder]} S1
        {endif}

         M620.11 P0 L0 I[initial_extruder] E0
         M620.11 K0 I[initial_extruder] R0

          M620 S[initial_extruder]A   ; switch material if AMS exist
          M1002 gcode_claim_action : 4
          M1002 set_filament_type:UNKNOWN
          M400
          T[initial_extruder]
          M400
          M628 S0
          M629
          M400
          M1002 set_filament_type:{filament_type[initial_extruder]}
          M621 S[initial_extruder]A
          M104 S{first_layer_temperature[initial_extruder]}
          M400
          M106 P1 S0
          M400
          G29.2 S1
        {if ((filament_type[initial_extruder] == "PETG") || (filament_type[initial_extruder] == "PETG-CF") || (filament_type[initial_extruder] == "TPU") || (filament_type[initial_extruder] == "TPU-AMS"))}
          G390.7 M6 G4 C3
        {else}
          G390.7 M6 G6 C3
        {endif}
        ;===== prepare print temperature and material ==========


        ;===== auto extrude cali start =========================
        M975 S1
        M1002 judge_flag extrude_cali_flag
          M622 J0
            M983.3 F{filament_max_volumetric_speed[initial_extruder]/2.4} A0.4 ; cali dynamic extrusion compensation
          M623

          M622 J1
            M1002 set_filament_type:{filament_type[initial_extruder]}
            M1002 gcode_claim_action : 8
            M109 S{temperature[initial_extruder]}
            G90
            M83
            M983.3 F{filament_max_volumetric_speed[initial_extruder]/2.4} A0.4 ; cali dynamic extrusion compensation
            M400
          M623

          M622 J2
            M1002 set_filament_type:{filament_type[initial_extruder]}
            M1002 gcode_claim_action : 8
            M109 S{temperature[initial_extruder]}
            G90
            M83
            M983.3 F{filament_max_volumetric_speed[initial_extruder]/2.4} A0.4 ; cali dynamic extrusion compensation
            M400
          M623
        ;===== auto extrude cali end =========================


          {if filament_type[initial_extruder] == "TPU" || filament_type[initial_extruder] == "PVA"}
          {else}
            M83
            G1 E-3 F1800
            M400 P500
          {endif}
          G0 Z1.3 F1200
          G150.2
          G150.1 F16000

          G91
          G1 X20 F12000 ; move away from the trash bin
          G90
          M400


        ;===== wipe nozzle start =====
          M1002 gcode_claim_action : 14
          G150 T{first_layer_temperature[initial_extruder]}
          M400
          M109 S140 A
          M106 P1 S255
          G91
          G1 Z1.3 F1200
          G90
          M400 S1
          ;======== enhance brush nozzle start =====
          G150.1 F16000
          G91
          G1 Y5   F5000
          G1 X-20 F16000
          G1 Y-10 F5000
          G1 X-20 F16000
          G1 Y10  F5000
          G1 X20  F16000
          G1 Y-10 F5000
          G1 X20  F16000
          G1 Y5   F5000
          G90
          G150.1 F16000
          G150.3
          ;======== enhance brush nozzle end =====
          M106 P1 S0
        ;===== wipe nozzle end =====

        ;===== mech mode sweep start =====
          M1002 gcode_claim_action : 3
          G90
          G1 Z5 F1200
          G1 X165 Y160 F20000
          M400 P200
          M970.3 Q1 A5 K0 O3
          M970.3 Q1 B1
          M970.2 Q1 K1 W52 Z0.1 B30 ;
