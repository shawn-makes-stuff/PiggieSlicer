        SYNC T{(new_filament_temp - custom_parameter_filament_filament_cooling_before_tower[next_filament_id] -flush_temperatures[next_filament_id])/hotend_heating_rate[custom_parameter_filament_filament_map[next_filament_id]-1]}
        {endif}
        {endif}

